<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CalBuddy</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
<main class="app">

<header class="top-bar">

<div id="sideMenu" class="side-menu">
<button class="close-menu" onclick="toggleMenu()">✕</button>

<a href="index.html">🏠 Home</a>
<a href="log.html">🍽️ Log Intake</a>
<a href="goals.html">🎯 My Goals</a>
<a href="progress.html">📈 Progress</a>
<a href="log.html?mode=favorite">⭐ Favorites</a>
<a href="log.html?mode=history">📖 Meal History</a>
<a href="progress.html#caloriesBurnedSection">🔥 Calories Burned</a>
<a href="#" onclick="openCalBuddyChat()">💬 Ask CalBuddy</a>
</div>

<div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<h1 class="logo">
<span class="cal">Cal</span><span class="buddy">Buddy</span>
</h1>

<div class="right-actions">
<button class="signin-btn" id="authButton">👤 Sign In</button>
<button class="goals-pill" onclick="window.location.href='goals.html'">🎯 My Goals</button>
<button class="progress-pill" onclick="window.location.href='progress.html'">📈 Progress</button>
</div>
</header>

<div class="home-weight-badge" id="currentWeightBadge">
199 lbs
<span>Current Weight</span>
</div>

<section class="hero-card compact-calorie-card" onclick="window.location.href='progress.html#caloriesBurnedSection'">

<div class="meter-side">
<div class="true-meter-wrap">

<svg class="true-meter" viewBox="0 0 220 130">
<path
class="true-meter-bg"
d="M 25 105 A 85 85 0 0 1 195 105"
pathLength="100"
/>

<path
class="true-meter-fill"
id="trueMeterFill"
d="M 25 105 A 85 85 0 0 1 195 105"
pathLength="100"
/>
</svg>

<div class="true-meter-text">
<p>CALORIES LEFT</p>
<h2 id="caloriesLeftText">850</h2>
<span>of <span id="dailyGoalText">2,100</span> kcal</span>
</div>

</div>
</div>

<div class="consumed-inline">
<div class="flame">🔥</div>
<div>
<strong><span id="caloriesConsumedText">0</span> / <span id="dailyGoalConsumed">2,100</span></strong>
<p>Calories Consumed</p>
<p class="burned-mini">Burned: <span id="caloriesBurnedText">0</span> kcal</p>
</div>
</div>

<div class="status-side reset-side" onclick="event.stopPropagation()">
<div class="reset-click-area" onclick="toggleResetOptions()">
<p class="reset-label">Resets in:</p>
<h2 id="resetCountdownText">--h --m</h2>
</div>

<div class="track-pill" id="trackPill">On Track ✅</div>

<div id="resetOptions" class="reset-options" onclick="event.stopPropagation()">
<p class="reset-title">Reset Time</p>

<div class="reset-time-row">
<input id="resetHourInput" type="number" min="1" max="12" value="4" />
<span>:</span>
<input id="resetMinuteInput" type="number" min="0" max="59" value="00" />
<select id="resetAmPmInput">
<option value="AM">AM</option>
<option value="PM">PM</option>
</select>
</div>

<button class="reset-save-btn" type="button" onclick="saveCustomResetTime(event)">Save</button>
</div>
</div>
</section>

<section class="log-home-card" onclick="window.location.href='log.html'">
<div class="log-title-row">
<div class="tile-icon">🍽️</div>
<h2>Log Intake</h2>
</div>

<div class="log-shortcuts" onclick="event.stopPropagation()">
<button type="button" onclick="window.location.href='log.html?mode=meal'">
<span>➕</span>
Add Meal
</button>

<button type="button" onclick="window.location.href='log.html?mode=drink'">
<span>🥤</span>
Add Drink
</button>

<button type="button" onclick="window.location.href='log.html?mode=repeat'">
<span>🔁</span>
Repeat Meal
</button>

<button type="button" onclick="window.location.href='log.html?mode=favorite'">
<span>⭐</span>
Favorite Meal
</button>
</div>

<img
class="food-illustration"
src="assets/food-bowl.svg"
alt="Healthy meal bowl with water"
/>
</section>

<button class="ask-card final-ask-card" type="button">
<div class="ask-content">
<div class="chat-icon">💬</div>
<h2>Ask CalBuddy</h2>

<div class="question-bubble" id="calbuddy-question">
“You have 850 calories left. Need dinner ideas?”
</div>
</div>

<img
class="robot-illustration"
src="calbuddy-robot.png?v=2"
alt="CalBuddy AI Nutrition Coach"
/>
</button>

</main>

<script>
function safeNumber(value, fallback = 0) {
const number = Number(value);
return Number.isFinite(number) ? number : fallback;
}

function getTodayDate() {
return new Date().toISOString().split("T")[0];
}

async function getCurrentUser() {
if (!window.calbuddySupabase) return null;

const { data, error } = await window.calbuddySupabase.auth.getSession();

if (error || !data.session) return null;

return data.session.user;
}

async function getResetTime() {
const saved = localStorage.getItem("calbuddyResetTime");
const user = await getCurrentUser();

if (user && window.calbuddySupabase) {
const { data, error } = await window.calbuddySupabase
.from("profiles")
.select("reset_hour, reset_minute, reset_ampm")
.eq("id", user.id)
.maybeSingle();

if (!error && data) {
const resetTime = {
hour: safeNumber(data.reset_hour, 4),
minute: safeNumber(data.reset_minute, 0),
ampm: data.reset_ampm || "AM"
};

localStorage.setItem("calbuddyResetTime", JSON.stringify(resetTime));
return resetTime;
}
}

if (saved) {
try {
return JSON.parse(saved);
} catch {
return { hour: 4, minute: 0, ampm: "AM" };
}
}

return {
hour: 4,
minute: 0,
ampm: "AM"
};
}

function convertTo24Hour(hour, ampm) {
hour = Number(hour);

if (ampm === "AM" && hour === 12) return 0;
if (ampm === "PM" && hour !== 12) return hour + 12;

return hour;
}

function toggleMenu() {
const menu = document.getElementById("sideMenu");
const overlay = document.getElementById("menuOverlay");

if (!menu || !overlay) return;

menu.classList.toggle("open");
overlay.classList.toggle("show");
}

function openCalBuddyChat() {
const askCard = document.querySelector(".ask-card");

if (askCard) {
askCard.scrollIntoView({ behavior: "smooth" });
}

toggleMenu();
}

function toggleResetOptions() {
const box = document.getElementById("resetOptions");

if (box) {
box.classList.toggle("show");
}
}

async function saveCustomResetTime(event) {
if (event) event.stopPropagation();

const hour = Number(document.getElementById("resetHourInput").value);
const minute = Number(document.getElementById("resetMinuteInput").value);
const ampm = document.getElementById("resetAmPmInput").value;

if (hour < 1 || hour > 12 || minute < 0 || minute > 59) {
alert("Please enter a valid reset time.");
return;
}

const resetTime = { hour, minute, ampm };

localStorage.setItem("calbuddyResetTime", JSON.stringify(resetTime));

const user = await getCurrentUser();

if (user && window.calbuddySupabase) {
const { error } = await window.calbuddySupabase
.from("profiles")
.upsert(
{
id: user.id,
reset_hour: hour,
reset_minute: minute,
reset_ampm: ampm,
updated_at: new Date().toISOString()
},
{ onConflict: "id" }
);

if (error) {
console.log("Reset time cloud save failed:", error);
}
}

document.getElementById("resetOptions").classList.remove("show");
await updateResetCountdown();
}

async function updateResetCountdown() {
const reset = await getResetTime();
const resetHour24 = convertTo24Hour(reset.hour, reset.ampm);

const now = new Date();
const nextReset = new Date();

nextReset.setHours(resetHour24, Number(reset.minute), 0, 0);

if (now >= nextReset) {
nextReset.setDate(nextReset.getDate() + 1);
}

const diff = nextReset - now;
const hours = Math.floor(diff / (1000 * 60 * 60));
const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

const countdown = document.getElementById("resetCountdownText");

if (countdown) {
countdown.textContent = `${hours}h ${minutes}m`;
}

const hourInput = document.getElementById("resetHourInput");
const minuteInput = document.getElementById("resetMinuteInput");
const ampmInput = document.getElementById("resetAmPmInput");

if (hourInput) hourInput.value = reset.hour;
if (minuteInput) minuteInput.value = String(reset.minute).padStart(2, "0");
if (ampmInput) ampmInput.value = reset.ampm;
}

function animateNumber(element, start, end) {
const duration = 800;
const startTime = performance.now();

function update(currentTime) {
const progress = Math.min((currentTime - startTime) / duration, 1);
const easedProgress = 1 - Math.pow(1 - progress, 3);
const value = Math.round(start + (end - start) * easedProgress);

element.textContent = value.toLocaleString();

if (progress < 1) {
requestAnimationFrame(update);
}
}

requestAnimationFrame(update);
}

function updateMeterStatus(consumed, goal, burned = 0) {
const heroCard = document.querySelector(".hero-card");
const trackPill = document.getElementById("trackPill");

if (!heroCard || !goal) return;

const netConsumed = Math.max(consumed - burned, 0);
const percentUsed = netConsumed / goal;

heroCard.classList.remove("meter-green", "meter-yellow", "meter-red", "meter-blue");

if (burned > 0) {
heroCard.classList.add("meter-blue");
if (trackPill) trackPill.textContent = "Deficit Mode 🔵";
} else if (percentUsed < 0.8) {
heroCard.classList.add("meter-green");
if (trackPill) trackPill.textContent = "On Track ✅";
} else if (percentUsed <= 1) {
heroCard.classList.add("meter-yellow");
if (trackPill) trackPill.textContent = "Close ⚠️";
} else {
heroCard.classList.add("meter-red");
if (trackPill) trackPill.textContent = "Over Goal ⚠️";
}
}

function updateLiveArchMeter(consumed, goal, burned = 0) {
const fill = document.getElementById("trueMeterFill");

if (!fill || !goal) return;

const netConsumed = Math.max(consumed - burned, 0);

const percentLeft = Math.max(
0,
Math.min((goal - netConsumed) / goal, 1)
);

fill.style.strokeDasharray = "100";
fill.style.strokeDashoffset = String(100 - percentLeft * 100);

fill.classList.remove(
"meter-fill-green",
"meter-fill-yellow",
"meter-fill-red",
"meter-fill-blue"
);

if (percentLeft > 0.4) {
fill.classList.add("meter-fill-green");
} else if (percentLeft > 0.15) {
fill.classList.add("meter-fill-yellow");
} else {
fill.classList.add("meter-fill-red");
}
}

function updateCalBuddyQuestion(consumed, goal, caloriesLeft, burned = 0) {
const question = document.getElementById("calbuddy-question");

if (!question) return;

if (burned > 0) {
question.textContent =
`“You burned ${burned.toLocaleString()} kcal today. Want help using that deficit wisely?”`;
} else if (consumed === 0) {
question.textContent =
`“You have ${goal.toLocaleString()} calories available. Want meal ideas?”`;
} else if (consumed < goal * 0.8) {
question.textContent =
`“You have ${caloriesLeft.toLocaleString()} calories left. Need dinner ideas?”`;
} else if (consumed <= goal) {
question.textContent =
`“You’re close to your goal. Want a lighter option?”`;
} else {
question.textContent =
"“Over goal? No panic. Want help planning tomorrow?”";
}
}

async function getTodaysConsumedCaloriesFromSupabase() {
const user = await getCurrentUser();

if (!user || !window.calbuddySupabase) return null;

const today = getTodayDate();

const { data, error } = await window.calbuddySupabase
.from("meals")
.select("calories")
.eq("user_id", user.id)
.eq("nutrition_date", today);

if (error || !data) {
console.log("Could not load today's meals from Supabase.", error);
return null;
}

const total = data.reduce((sum, meal) => {
return sum + safeNumber(meal.calories, 0);
}, 0);

localStorage.setItem("calbuddyCaloriesConsumed", Math.round(total));

return Math.round(total);
}

async function getTodaysCaloriesBurned() {
const localBurned = safeNumber(localStorage.getItem("calbuddyCaloriesBurned") || 0, 0);
const user = await getCurrentUser();

if (!user || !window.calbuddySupabase) return localBurned;

const today = getTodayDate();

try {
const { data, error } = await window.calbuddySupabase
.from("activity_logs")
.select("calories_burned")
.eq("user_id", user.id)
.eq("log_date", today)
.maybeSingle();

if (error || !data) return localBurned;

const burned = safeNumber(data.calories_burned, localBurned);
localStorage.setItem("calbuddyCaloriesBurned", burned);

return burned;
} catch {
return localBurned;
}
}

function updateWeightBadgeFromStorage() {
const savedGoals = localStorage.getItem("calbuddyGoals");
const currentWeightBadge = document.getElementById("currentWeightBadge");

if (!currentWeightBadge) return;

const localCurrentWeight =
localStorage.getItem("calbuddyCurrentWeight") ||
localStorage.getItem("calbuddyLatestWeight");

if (localCurrentWeight) {
currentWeightBadge.innerHTML =
`${localCurrentWeight} lbs <span>Current Weight</span>`;
return;
}

if (savedGoals) {
try {
const goals = JSON.parse(savedGoals);

if (goals.weight) {
currentWeightBadge.innerHTML =
`${goals.weight} lbs <span>Current Weight</span>`;
}
} catch {
console.log("Could not read saved goals.");
}
}
}

async function updateHomeCalories() {
const savedGoal = localStorage.getItem("calbuddyDailyCalorieGoal");
const goal = savedGoal ? safeNumber(savedGoal, 2100) : 2100;

let consumed = await getTodaysConsumedCaloriesFromSupabase();

if (consumed === null) {
consumed = safeNumber(localStorage.getItem("calbuddyCaloriesConsumed") || 0, 0);
}

const burned = await getTodaysCaloriesBurned();
const caloriesLeft = Math.max(goal - consumed + burned, 0);

const caloriesLeftText = document.getElementById("caloriesLeftText");
const dailyGoalText = document.getElementById("dailyGoalText");
const caloriesConsumedText = document.getElementById("caloriesConsumedText");
const dailyGoalConsumed = document.getElementById("dailyGoalConsumed");
const caloriesBurnedText = document.getElementById("caloriesBurnedText");

if (caloriesLeftText) {
const currentValue =
safeNumber(caloriesLeftText.textContent.replace(/,/g, ""), 0);

animateNumber(caloriesLeftText, currentValue, caloriesLeft);
updateMeterStatus(consumed, goal, burned);
updateLiveArchMeter(consumed, goal, burned);
}

if (dailyGoalText) dailyGoalText.textContent = goal.toLocaleString();
if (caloriesConsumedText) caloriesConsumedText.textContent = consumed.toLocaleString();
if (dailyGoalConsumed) dailyGoalConsumed.textContent = goal.toLocaleString();
if (caloriesBurnedText) caloriesBurnedText.textContent = burned.toLocaleString();

updateCalBuddyQuestion(consumed, goal, caloriesLeft, burned);
updateWeightBadgeFromStorage();
}

document.addEventListener("DOMContentLoaded", async () => {
await updateHomeCalories();
await updateResetCountdown();

setInterval(updateResetCountdown, 60000);
});

window.addEventListener("focus", updateHomeCalories);
window.addEventListener("pageshow", updateHomeCalories);
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
