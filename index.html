<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CalBuddy</title>
<link rel="stylesheet" href="style.css" />

<style>
.clickable-card {
cursor: pointer;
transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.clickable-card:active {
transform: scale(0.98);
}

.home-status {
margin-top: 8px;
font-weight: 700;
}

.home-subtext {
font-size: 0.9rem;
opacity: 0.75;
}

.quick-reset {
margin-top: 10px;
font-size: 0.8rem;
background: transparent;
border: none;
color: #6b7280;
text-decoration: underline;
cursor: pointer;
}
</style>
</head>

<body>
<main class="app">

<header class="top-bar">
<button class="menu-btn">≡</button>

<h1 class="logo">
<span class="cal">Cal</span><span class="buddy">Buddy</span>
</h1>

<div>
<button class="signin-btn" id="authButton">👤 Sign In</button>
<button class="goals-pill" onclick="window.location.href='goals.html'">🎯 My Goals</button>
</div>
</header>

<section class="hero-card">
<div class="calorie-main">
<p>CALORIES LEFT</p>
<h2 id="caloriesLeftText">0</h2>
<span>of <span id="dailyGoalText">2,100</span> kcal</span>
</div>

<div class="status-pill" id="statusPill">On Track</div>

<div class="calorie-consumed">
<strong>
<span id="caloriesConsumedText">0</span> /
<span id="dailyGoalConsumed">2,100</span>
</strong>
<p>Calories Consumed</p>
</div>

<p class="home-status" id="homeMessage">
You have not logged any food yet today.
</p>

<button class="quick-reset" onclick="resetTodayCalories()">
Reset today’s calories
</button>
</section>

<section class="tile-grid">

<div class="tile clickable-card" onclick="window.location.href='log.html'">
<div>
<h3>Log Intake</h3>
<p class="home-subtext">Search food and add meals</p>
</div>
<span class="tile-icon">🥗</span>
</div>

<div class="tile clickable-card" onclick="window.location.href='goals.html'">
<div>
<h3>My Goals</h3>
<p class="home-subtext">Weight, calories, activity</p>
</div>
<span class="tile-icon">🎯</span>
</div>

<div class="tile clickable-card" onclick="alert('Progress page coming soon.')">
<div>
<h3>Progress</h3>
<p id="progressSummary" class="home-subtext">Set your goals to begin</p>
</div>
<span class="tile-icon">📈</span>
</div>

</section>

<section class="ask-card">
<div class="ask-content">
<h3>Ask CalBuddy</h3>
<p id="calbuddy-question">
"Need help choosing your next meal?"
</p>
</div>

<img
class="robot-illustration"
src="calbuddy-robot.png?v=2"
alt="CalBuddy AI Nutrition Coach"
/>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>

<script>
function updateHomeCalories() {
const savedGoal = localStorage.getItem("calbuddyDailyCalorieGoal");
const savedConsumed = localStorage.getItem("calbuddyCaloriesConsumed") || 0;
const savedGoals = localStorage.getItem("calbuddyGoals");

const goal = savedGoal ? Number(savedGoal) : 2100;
const consumed = Number(savedConsumed);
const caloriesLeft = Math.max(goal - consumed, 0);

document.getElementById("dailyGoalText").textContent = goal.toLocaleString();
document.getElementById("dailyGoalConsumed").textContent = goal.toLocaleString();
document.getElementById("caloriesConsumedText").textContent = consumed.toLocaleString();
document.getElementById("caloriesLeftText").textContent = caloriesLeft.toLocaleString();

const statusPill = document.getElementById("statusPill");
const homeMessage = document.getElementById("homeMessage");

if (consumed === 0) {
statusPill.textContent = "Ready";
homeMessage.textContent = "You have not logged any food yet today.";
} else if (consumed < goal) {
statusPill.textContent = "On Track";
homeMessage.textContent = `${caloriesLeft.toLocaleString()} calories left for today.`;
} else {
statusPill.textContent = "Over Goal";
homeMessage.textContent = `You are ${Math.abs(goal - consumed).toLocaleString()} calories over today.`;
}

const progressSummary = document.getElementById("progressSummary");

if (savedGoals) {
const goals = JSON.parse(savedGoals);
progressSummary.textContent =
`${goals.weight || "—"} lbs now • Goal ${goals.targetWeight || "—"} lbs`;
}
}

function resetTodayCalories() {
localStorage.setItem("calbuddyCaloriesConsumed", 0);
updateHomeCalories();
}

updateHomeCalories();
</script>
</body>
</html>
