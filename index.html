<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARI | CalBuddy Health</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
<main class="app ari-master-home ari-chatgpt-home">

<header class="top-bar ari-header">
  <button class="menu-btn" type="button" onclick="toggleMenu()">☰</button>

  <a class="ari-wordmark" href="index.html" aria-label="ARI Home">
    <span class="ari-a">A</span><span class="ari-r">R</span><span class="ari-i">I</span>
  </a>

  <button class="profile-btn" id="authButton" type="button">👤</button>
</header>

<nav id="sideMenu" class="side-menu ari-side-menu">
  <button class="close-menu" type="button" onclick="toggleMenu()">✕</button>

  <a href="index.html">🏠 Home</a>
  <a href="profile.html">👤 Profile</a>
  <a href="goals.html">🎯 My Goals</a>
  <a href="log.html?mode=today">🍽️ Daily Intake</a>
  <a href="progress.html">📈 Progress</a>
  <a href="log.html?mode=favorite">⭐ Favorites</a>
  <a href="log.html?mode=history">💭 Conversation History</a>

  <div class="nav-dashboard-card">
  <p class="nav-dashboard-label">CALORIES LEFT</p>

  <div class="nav-meter-wrap">
    <svg class="nav-meter" viewBox="0 0 220 130">
      <path class="nav-meter-bg" d="M 25 105 A 85 85 0 0 1 195 105" pathLength="100" />
      <path class="nav-meter-fill" id="navMeterFill" d="M 25 105 A 85 85 0 0 1 195 105" pathLength="100" />
    </svg>

    <div class="nav-meter-text">
      <h2 id="caloriesLeftText">2,100</h2>
      <span><span id="caloriesConsumedText">0</span> / <span id="dailyGoalText">2,100</span> kcal</span>
    </div>
  </div>

  <a href="log.html?mode=today" class="nav-dashboard-link">Open Daily Intake</a>
</div>
</nav>

<div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>

<section class="ari-main-chat-stage">
  <img
    id="ariMascot"
    class="ari-master-img ari-transparent-mascot"
    src="assets/ari/ari-idle-open.png"
    alt="Ari, CalBuddy AI Nutrition Coach"
  />

  <section class="ari-search-section ari-primary-chat" id="ariSearchSection">
    <div id="ariConversationPanel" class="ari-conversation-panel ari-chat-panel">
      <div id="ariMessages" class="ari-thread"></div>

      <div id="pendingActionBar" class="pending-action-bar">
        <p id="pendingActionText">Want me to log that?</p>
        <div class="pending-action-buttons">
          <button type="button" onclick="confirmAriAction()">Yes</button>
          <button type="button" onclick="cancelAriAction()">Cancel</button>
        </div>
      </div>
    </div>

    <div class="ari-search-bar ari-large-chat-bar">
      <textarea
        id="ariInput"
        rows="1"
        placeholder="Message Ari..."
        oninput="autoResizeAriInput()"
        onkeydown="handleAriEnter(event)"
      ></textarea>

      <button id="ariSendBtn" class="ari-send-btn" type="button" onclick="sendAriMessage()">➤</button>
    </div>
  </section>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="calbuddy-core.js?v=3.5.3"></script>
<script src="ari/ari-rebirth-app-bridge.js?v=1.4.7"></script>

<script>
let ariChatHistory = [];
let ariBlinkInterval = null;
let ariBlinkTimeout = null;
let ariResetTimeout = null;
let ariBusy = false;

const ARI_DEFAULT_BUBBLE = "";

const ARI_ASSETS = {
  idleOpen: "assets/ari/ari-idle-open.png",
  idleClosed: "assets/ari/ari-idle-closed.png",
  thinking: "assets/ari/ari-thinking.png",
  goodNews: "assets/ari/ari-good-news.png",
  badNews: "assets/ari/ari-bad-news.png",
  concerned: "assets/ari/ari-concerned.png",
  celebrate: "assets/ari/ari-celebrate.png",
  excited: "assets/ari/ari-excited.png",
  shocked: "assets/ari/ari-shocked.png",
  shrug: "assets/ari/ari-shrug.png",
  shy: "assets/ari/ari-shy.png",
  sad: "assets/ari/ari-sad.png",
  armsCrossed: "assets/ari/ari-arms-crossed.png",
  disappointed: "assets/ari/ari-disappointed.png",
  knifeHand: "assets/ari/ari-knife-hand.png",
  pointing: "assets/ari/ari-pointing-finger.png",
  wave1: "assets/ari/ari-wave-1.png",
  wave2: "assets/ari/ari-wave-2.png",
  wave3: "assets/ari/ari-wave-3.png"
};

document.addEventListener("DOMContentLoaded", async () => {
  preloadAriAssets();
  setAriPose("idleOpen");
  startAriBlinkLoop();

  await setupHomeAuth();
  await refreshHomeDashboard();

  const savedPending = window.CalBuddy?.getPendingAction?.();
  if (savedPending) showPendingAction(savedPending);

  setInterval(refreshHomeDashboard, 60000);
});

window.addEventListener("focus", refreshHomeDashboard);
window.addEventListener("pageshow", () => setTimeout(refreshHomeDashboard, 300));

window.addEventListener("calbuddy:dashboardUpdated", (event) => {
  renderDashboard(event.detail);
});

window.addEventListener("calbuddy:pendingAction", (event) => {
  showPendingAction(event.detail.action);
});

window.addEventListener("calbuddy:pendingActionCleared", () => {
  hidePendingAction();
});

function preloadAriAssets() {
  Object.values(ARI_ASSETS).forEach((src) => {
    const img = new Image();
    img.src = src;
  });
}

function setAriPose(poseKey) {
  const img = document.getElementById("ariMascot");
  if (!img || !ARI_ASSETS[poseKey]) return;
  img.src = ARI_ASSETS[poseKey];
}

function setAriBubble() {}

function startAriBlinkLoop() {
  clearInterval(ariBlinkInterval);

  ariBlinkInterval = setInterval(() => {
    if (ariBusy) return;

    setAriPose("idleClosed");

    clearTimeout(ariBlinkTimeout);
    ariBlinkTimeout = setTimeout(() => {
      if (!ariBusy) setAriPose("idleOpen");
    }, 150);
  }, 30000);
}

function interruptAri(poseKey) {
  ariBusy = true;
  clearTimeout(ariResetTimeout);
  clearTimeout(ariBlinkTimeout);
  setAriPose(poseKey);
}

function resetAriAfterDelay(delay = 120000) {
  clearTimeout(ariResetTimeout);

  ariResetTimeout = setTimeout(() => {
    ariBusy = false;
    setAriPose("idleOpen");
  }, delay);
}

function chooseAriReaction(message = "") {
  const text = message.toLowerCase();

  if (
    text.includes("fat") ||
    text.includes("gained") ||
    text.includes("5 lbs") ||
    text.includes("5 pounds") ||
    text.includes("weight gain")
  ) {
    return { pose: "concerned" };
  }

  if (text.includes("lose weight fast") || text.includes("can i lose")) {
    return { pose: "excited" };
  }

  if (text.includes("thank") || text.includes("beautiful") || text.includes("love you")) {
    return { pose: "shy" };
  }

  if (text.includes("sad") || text.includes("bad day") || text.includes("relapse") || text.includes("failed")) {
    return { pose: "sad" };
  }

  if (text.includes("excuse") || text.includes("monday") || text.includes("cheated")) {
    return { pose: "armsCrossed" };
  }

  return { pose: "thinking" };
}

function applyAriAfterResponseEmotion(message = "", reply = "") {
  const combined = `${message} ${reply}`.toLowerCase();

  if (
    combined.includes("water weight") ||
    combined.includes("scale") ||
    combined.includes("not fat")
  ) {
    setAriPose("concerned");
  } else if (
    combined.includes("yes") ||
    combined.includes("possible") ||
    combined.includes("good news")
  ) {
    setAriPose("goodNews");
  } else if (
    combined.includes("great job") ||
    combined.includes("congrats") ||
    combined.includes("nice work")
  ) {
    setAriPose("celebrate");
  } else {
    setAriPose("idleOpen");
  }

  resetAriAfterDelay();
}

function toggleMenu() {
  document.getElementById("sideMenu")?.classList.toggle("open");
  document.getElementById("menuOverlay")?.classList.toggle("show");
}

async function setupHomeAuth() {
  const authButton = document.getElementById("authButton");
  if (!authButton || !window.calbuddySupabase) return;

  const { data } = await window.calbuddySupabase.auth.getSession();

  if (data?.session) {
    authButton.textContent = "Sign Out";
    authButton.onclick = async () => {
      await window.calbuddySupabase.auth.signOut();
      window.location.href = "signin.html";
    };
  } else {
    authButton.textContent = "Sign In";
    authButton.onclick = () => {
      window.location.href = "signin.html";
    };
  }
}

async function refreshHomeDashboard() {
  if (!window.CalBuddy) return;

  try {
    const context = await CalBuddy.refreshDashboard();
    renderDashboard(context);
  } catch (error) {
    console.log("Home dashboard refresh skipped:", error.message);
  }
}

function renderDashboard(context = {}) {
  const goal = Number(context.dailyGoal || 2100);
  const consumed = Number(context.caloriesConsumed || 0);
  const burned = Number(context.caloriesBurned || 0);

  const netConsumed = Math.max(consumed - burned, 0);
  const caloriesLeft = Math.max(goal - netConsumed, 0);

  const percentLeft = goal
    ? Math.max(0, Math.min(caloriesLeft / goal, 1))
    : 1;

  const percentUsed = goal
    ? Math.max(0, Math.min(netConsumed / goal, 1))
    : 0;

  setText("caloriesLeftText", caloriesLeft.toLocaleString());
  setText("dailyGoalText", goal.toLocaleString());
  setText("caloriesConsumedText", netConsumed.toLocaleString());

  const navFill = document.getElementById("navMeterFill");

  if (navFill) {
    navFill.style.strokeDasharray = "100";
    navFill.style.strokeDashoffset = String(100 - percentLeft * 100);

    navFill.classList.remove("nav-meter-yellow", "nav-meter-red");

    if (percentUsed >= 1) {
      navFill.classList.add("nav-meter-red");
    } else if (percentUsed >= 0.75) {
      navFill.classList.add("nav-meter-yellow");
    }
  }
}

function setText(id, value) {
  const element = document.getElementById(id);
  if (element) element.textContent = value;
}

function autoResizeAriInput() {
  const input = document.getElementById("ariInput");
  if (!input) return;

  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}

function handleAriEnter(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendAriMessage();
  }
}

function addAriMessage(text, sender = "ari") {
  const messages = document.getElementById("ariMessages");
  const panel = document.getElementById("ariConversationPanel");

  if (!messages) return null;

  const div = document.createElement("div");
  div.className = `ari-message ${sender === "user" ? "ari-user" : "ari-ai"}`;

  const label = document.createElement("span");
  label.className = "ari-label";
  label.textContent = sender === "user" ? "You" : "Ari";

  const body = document.createElement("p");
  body.textContent = text;

  div.appendChild(label);
  div.appendChild(body);

  messages.appendChild(div);

  if (panel) {
    panel.scrollTop = panel.scrollHeight;
  }

  return div;
}

async function sendAriMessage() {
  const input = document.getElementById("ariInput");
  const button = document.getElementById("ariSendBtn");

  if (!input) return;

  const message = input.value.trim();
  if (!message) return;

  const ariTimingStart = performance.now();
  const ariTiming = [];

  const markAriTiming = (label) => {
    ariTiming.push({
      label,
      ms: Math.round(performance.now() - ariTimingStart)
    });
  };

  markAriTiming("message accepted");

  const reaction = chooseAriReaction(message);
  interruptAri(reaction.pose);
  markAriTiming("reaction applied");

  input.value = "";
  autoResizeAriInput();

  addAriMessage(message, "user");
  const thinkingMessage = addAriMessage("Thinking...", "ari");
  markAriTiming("thinking message rendered");

  ariChatHistory.push({ role: "user", content: message });
  ariChatHistory = ariChatHistory.slice(-10);

  if (button) button.disabled = true;

  try {
    markAriTiming("before CalBuddy.askAri");

    const response = await CalBuddy.askAri({
      message,
      history: ariChatHistory,
      ownerMode: true,
      appContext: {
        ownerMode: true
      },
      debugTiming: true
    });

    markAriTiming("after CalBuddy.askAri");

    const reply = response.reply || "Hmm. I had trouble answering that. Try again.";

    if (thinkingMessage) {
      const body = thinkingMessage.querySelector("p");
      if (body) body.textContent = reply;
    }

    markAriTiming("reply rendered");

    ariChatHistory.push({ role: "assistant", content: reply });
    ariChatHistory = ariChatHistory.slice(-10);

    applyAriAfterResponseEmotion(message, reply);

    if (response.pendingAction) {
      showPendingAction(response.pendingAction);
    }

    markAriTiming("before refreshHomeDashboard");
    await refreshHomeDashboard();
    markAriTiming("after refreshHomeDashboard");

  } catch (error) {
    markAriTiming("error caught");

    setAriPose("concerned");

    if (thinkingMessage) {
      const body = thinkingMessage.querySelector("p");
      if (body) body.textContent = error.message || "Something glitched. Try again in a second.";
    }

    resetAriAfterDelay();
  } finally {
    markAriTiming("complete");

    console.table(ariTiming);
    console.log(
      "[Ari Homepage Timing] Total:",
      Math.round(performance.now() - ariTimingStart) + "ms"
    );

    if (button) button.disabled = false;
  }
}

function showPendingAction(action) {
  const bar = document.getElementById("pendingActionBar");
  const text = document.getElementById("pendingActionText");

  if (!bar || !text || !action) return;

  text.textContent = action.confirmation_text || "Want me to log that?";
  bar.classList.add("show");
}

function hidePendingAction() {
  document.getElementById("pendingActionBar")?.classList.remove("show");
}

async function confirmAriAction() {
  const result = await CalBuddy.confirmPendingAction();

  addAriMessage(result.reply || "Done.", "ari");
  setAriPose("celebrate");
  hidePendingAction();

  await refreshHomeDashboard();
  resetAriAfterDelay();
}

function cancelAriAction() {
  const result = CalBuddy.cancelPendingAction();

  addAriMessage(result.reply || "No problem.", "ari");
  setAriPose("idleOpen");
  hidePendingAction();

  resetAriAfterDelay();
}
</script>
</body>
</html>
