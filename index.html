<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CalBuddy</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
<main class="app">

<header class="top-bar">
<button class="menu-btn">☰</button>

<h1 class="logo">
<span class="cal">Cal</span><span class="buddy">Buddy</span>
</h1>

<div class="right-actions">
<button class="signin-btn">👤 Sign In</button>
<button class="goals-pill">🎯 My Goals</button>
</div>
</header>

<section class="hero-card">
<div class="meter-side">
<div class="arch-meter">
<div class="meter-text">
<p>CALORIES LEFT</p>
<h2>850</h2>
<span>of 2,100 kcal</span>
</div>
</div>

<div class="consumed-row">
<div class="flame">🔥</div>
<div>
<strong>1,250 / 2,100</strong>
<p>Calories Consumed</p>
</div>
</div>
</div>

<div class="status-side">
<div class="badge">✅ On Track</div>
<h3>You’re doing great!</h3>
<p>Keep it up and crush your goal.</p>
</div>
</section>

<section class="dashboard-grid">

<button class="tile intake">
<div class="tile-icon">🍽️</div>
<h2>Log Intake</h2>
<p>Log breakfast, lunch, dinner, snacks, and drinks.</p>

<img 
  class="food-illustration" 
  src="assets/food-bowl.svg" 
  alt="Healthy meal bowl with apple and water"
/>
</button>

<button class="tile progress">
<div class="tile-icon">📈</div>
<h2>Progress</h2>

<div class="weight-badge">
183 lbs
<span>Current Weight</span>
</div>

<h3>4 lb ↓</h3>
<p>lost this month</p>

<div class="mini-stats">
<span>🔥 12 Day Streak</span>
<span>🎯 83% Goal Adherence</span>
</div>

<div class="trend-line"></div>
</button>

</section>

<button class="ask-card">
<div class="ask-content">
<div class="chat-icon">💬</div>
<h2>Ask CalBuddy</h2>

<div class="question-bubble" id="calbuddy-question">
“You have 850 calories left. Need dinner ideas?”
</div>
</div>

<img
class="robot-illustration"
src="calbuddy-robot.png"
alt="CalBuddy AI Nutrition Coach"
/>
</button>

<footer>
🔒 Your data is private and secure.
</footer>

</main>

<script src="app.js"></script>
</body>
</html>
