<!-- =====================================================
ARI REBIRTH
File: signin.html
Version: 1.1.3

Purpose:
  Sign-in, account creation, email verification instructions,
  and normal ARI boot flow.

Email confirmation behavior:
  - Signup sends a confirmation email.
  - Confirmation redirects to /email-confirmed.html.
  - Confirmation does NOT auto-login the user.
  - User returns to /signin.html and signs in manually.

Dependencies:
  - /assets/css/animations.css
  - /assets/css/auth.css
  - Supabase CDN
  - /supabase-config.js
  - /js/auth.js
  - /js/signin.js
===================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Sign In - ARI Rebirth</title>

  <style>
    .ari-auth-body .hidden {
      display: none !important;
    }

    /*
      Makes the verification return link behave like the existing
      primary auth button even if auth.css was originally written
      with <button> elements in mind.
    */
    .ari-auth-return-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-decoration: none;
    }
  </style>

  <link
    rel="stylesheet"
    href="/assets/css/animations.css?v=15"
  />

  <link
    rel="stylesheet"
    href="/assets/css/auth.css?v=15"
  />
</head>

<body class="ari-auth-body">

  <main class="ari-auth-page">

    <!-- =================================================
         SIGN IN / CREATE ACCOUNT
    ================================================== -->

    <section
      class="ari-auth-card"
      id="authCard"
    >
      <div class="ari-auth-brand">

        <div
          class="ari-chip-core"
          aria-hidden="true"
        >
          <div class="chip-ring"></div>
          <div class="chip-ring ring2"></div>

          <div class="chip-grid">
            <span></span>
            <span></span>
            <span></span>

            <span></span>
            <span class="core"></span>
            <span></span>

            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <h1 id="ariBootLogo">
          ARI REBIRTH
        </h1>

        <p
          id="ariBootMeaning"
          aria-live="polite"
        ></p>
      </div>

      <!-- ===============================================
           MODE TABS
      ================================================ -->

      <div
        class="ari-auth-tabs"
        role="tablist"
        aria-label="Authentication options"
      >
        <button
          id="showLoginBtn"
          class="ari-auth-tab active"
          type="button"
          role="tab"
          aria-selected="true"
        >
          Sign In
        </button>

        <button
          id="showSignupBtn"
          class="ari-auth-tab"
          type="button"
          role="tab"
          aria-selected="false"
        >
          Create
        </button>
      </div>

      <!-- ===============================================
           DISPLAY NAME
      ================================================ -->

      <div
        id="signupNameWrap"
        class="ari-auth-field hidden"
      >
        <label for="displayName">
          What should Ari call you?
        </label>

        <input
          id="displayName"
          type="text"
          placeholder="Display name"
          autocomplete="name"
        />
      </div>

      <!-- ===============================================
           EMAIL
      ================================================ -->

      <div class="ari-auth-field">
        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
        />
      </div>

      <!-- ===============================================
           PASSWORD
      ================================================ -->

      <div class="ari-auth-field">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        />
      </div>

      <!-- ===============================================
           CONFIRM PASSWORD
      ================================================ -->

      <div
        id="confirmPasswordWrap"
        class="ari-auth-field hidden"
      >
        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          placeholder="Confirm password"
          autocomplete="new-password"
        />
      </div>

      <!-- ===============================================
           ACTIONS
      ================================================ -->

      <button
        id="loginBtn"
        type="button"
        class="ari-auth-main-btn"
      >
        ENTER
      </button>

      <button
        id="signupBtn"
        type="button"
        class="ari-auth-main-btn gold hidden"
      >
        CREATE ACCOUNT
      </button>

      <button
        id="forgotPasswordBtn"
        type="button"
        class="ari-auth-link-btn"
      >
        Forgot Password?
      </button>

      <p
        id="authMessage"
        class="ari-auth-message"
        role="status"
        aria-live="polite"
      ></p>
    </section>

    <!-- =================================================
         EMAIL VERIFICATION

         This is now informational only.
         signin.js should NOT poll for a new session or automatically
         initialize ARI after email confirmation.
    ================================================== -->

    <section
      class="ari-auth-card hidden"
      id="verifyCard"
      aria-live="polite"
    >
      <div class="ari-auth-brand">

        <p class="ari-auth-kicker">
          EMAIL VERIFICATION
        </p>

        <h1>
          CHECK YOUR EMAIL
        </h1>

        <p class="ari-auth-subtitle">
          Confirmation required
          <span
            class="ari-terminal-cursor"
            aria-hidden="true"
          >â</span>
        </p>
      </div>

      <p
        id="verifyMessage"
        class="ari-auth-message"
        role="status"
      >
        We sent you a verification link. Open it to confirm your email.
        After confirmation, return to ARI and sign in with your email and password.
      </p>

      <a
        class="ari-auth-main-btn ari-auth-return-link"
        href="/signin.html"
      >
        RETURN TO SIGN IN
      </a>
    </section>

    <!-- =================================================
         INITIALIZATION TERMINAL

         This remains for the normal signed-in ARI boot flow.
         It should run only after a successful manual sign-in.
    ================================================== -->

    <section
      class="ari-init-screen hidden"
      id="initScreen"
      aria-live="polite"
    >
      <div class="ari-terminal-shell">

        <div
          class="terminal-glow"
          aria-hidden="true"
        ></div>

        <div
          class="terminal-grid"
          aria-hidden="true"
        ></div>

        <div
          id="initTerminal"
          class="ari-init-terminal"
        ></div>
      </div>
    </section>

  </main>

  <!-- ===================================================
       SCRIPTS

       Order matters:
       1. Supabase library
       2. Supabase configuration
       3. Shared authentication helpers
       4. Sign-in page controller
  ==================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <script
    src="/supabase-config.js?v=10"
    defer
  ></script>

  <script
    src="/js/auth.js?v=13"
    defer
  ></script>

  <script
    src="/js/signin.js?v=12"
    defer
  ></script>

</body>
</html>
