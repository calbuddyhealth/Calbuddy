<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In - CalBuddy</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
<main class="app">
<header class="top-bar">
<button class="menu-btn" onclick="window.location.href='index.html'">☰</button>

<h1 class="logo">
<span class="cal">Cal</span><span class="buddy">Buddy</span>
</h1>
</header>

<section class="hero-card" style="display:block; padding:28px;">
<h2>Sign In</h2>

<input
id="email"
type="email"
placeholder="Email"
autocomplete="email"
style="width:100%; padding:14px; margin:10px 0; border-radius:14px; border:1px solid #ddd;"
/>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
style="width:100%; padding:14px; margin:10px 0; border-radius:14px; border:1px solid #ddd;"
/>

<button id="loginBtn" type="button" class="signin-btn" style="width:100%; margin-top:12px;">
Sign In
</button>

<button id="signupBtn" type="button" class="goals-pill" style="width:100%; margin-top:12px;">
Create Account
</button>

<p id="authMessage" style="margin-top:16px; font-weight:700;"></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=8"></script>

<script>
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const message = document.getElementById("authMessage");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");

function setMessage(text) {
message.textContent = text;
}

function validateInputs() {
const email = emailInput.value.trim();
const password = passwordInput.value.trim();

if (!email) {
setMessage("Enter your email.");
return null;
}

if (!password) {
setMessage("Enter your password.");
return null;
}

if (password.length < 6) {
setMessage("Password must be at least 6 characters.");
return null;
}

return { email, password };
}

async function createUserProfile(user) {
if (!user || !user.id) return;

const { error } = await window.calbuddySupabase
.from("profiles")
.upsert(
{
id: user.id,
email: user.email || "",
daily_calorie_goal: 2100,
reset_hour: 4,
updated_at: new Date().toISOString()
},
{
onConflict: "id"
}
);

if (error) {
console.error("Profile save error:", error.message);
setMessage("Signed in, but profile could not be saved: " + error.message);
}
}

loginBtn.addEventListener("click", async () => {
const values = validateInputs();
if (!values) return;

loginBtn.disabled = true;
setMessage("Signing in...");

try {
const { data, error } =
await window.calbuddySupabase.auth.signInWithPassword({
email: values.email,
password: values.password
});

if (error) {
setMessage(error.message);
loginBtn.disabled = false;
return;
}

if (data && data.user) {
await createUserProfile(data.user);
setMessage("Signed in successfully.");
window.location.href = "index.html";
return;
}

setMessage("Sign in failed. Please try again.");
loginBtn.disabled = false;

} catch (err) {
console.error(err);
setMessage("Sign in error. Please try again.");
loginBtn.disabled = false;
}
});

signupBtn.addEventListener("click", async () => {
const values = validateInputs();
if (!values) return;

signupBtn.disabled = true;
setMessage("Creating account...");

try {
const { data, error } =
await window.calbuddySupabase.auth.signUp({
email: values.email,
password: values.password
});

if (error) {
setMessage(error.message);
signupBtn.disabled = false;
return;
}

if (data && data.user) {
await createUserProfile(data.user);
}

setMessage("Account created. Check your email if confirmation is required.");
signupBtn.disabled = false;

} catch (err) {
console.error(err);
setMessage("Account creation error. Please try again.");
signupBtn.disabled = false;
}
});
</script>
</body>
</html>
