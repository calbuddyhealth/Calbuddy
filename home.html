<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>ARI Rebirth</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="assets/css/base.css?v=16">
<link rel="stylesheet" href="assets/css/animations.css?v=16">
<link rel="stylesheet" href="assets/css/home.css?v=16">
<link rel="stylesheet" href="assets/css/header.css?v=16">
<link rel="stylesheet" href="assets/css/nav-menu.css?v=16">
<link rel="stylesheet" href="assets/css/avatar.css?v=16">
<link rel="stylesheet" href="assets/css/composer.css?v=1.2.1">
<link rel="stylesheet" href="assets/css/conversation-history.css?v=16">
</head>

<body>

<main class="ari-v1-home welcome-mode" id="ariApp">

<header class="top-bar ari-header ari-header-v4">
  <button class="menu-btn ari-menu-toggle" type="button" onclick="toggleMenu()" aria-label="Open menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="ari-header-avatar-shell" id="ariHeaderAvatarShell">
    <img id="ariHeaderAvatar" src="assets/ari/avatar-idle-open.png" alt="Ari avatar">
  </div>

  <a class="ari-brand-right" href="home.html" aria-label="ARI Home">
    <span class="ari-brand-title">ARI</span>
    <span class="ari-brand-subtitle">REBIRTH</span>
  </a>
</header>

<nav id="sideMenu" class="side-menu ari-side-menu">
  <button class="close-menu ari-close-menu" type="button" onclick="toggleMenu()">×</button>

  <a href="identity.html" class="ari-nav-link nav-identity">
    <span class="ari-nav-icon"></span>
    <span>My Identity</span>
  </a>

  <a href="goals.html" class="ari-nav-link nav-goals">
    <span class="ari-nav-icon"></span>
    <span>My Goals</span>
  </a>

  <a href="conversations.html" class="ari-nav-link nav-conversations">
    <span class="ari-nav-icon"></span>
    <span>Conversations</span>
  </a>

  <a href="account.html" class="ari-nav-link nav-account">
    <span class="ari-nav-icon"></span>
    <span>Account</span>
  </a>
</nav>

<div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>

<section class="ari-welcome" id="ariWelcome">
  <img
    id="ariHero"
    class="ari-hero-img"
    data-ari-mascot
    src="assets/ari/ari-idle-open.png"
    alt="Ari"
  >

  <div class="ari-welcome-prompt">
    <h1 id="ariWelcomeQuestion" class="ari-welcome-question">
      Tell me about yourself.
    </h1>
  </div>
</section>

<section class="ari-conversation-shell" id="ariConversationShell">
  <div id="ariMessages" class="ari-thread"></div>

  <div id="pendingActionBar" class="pending-action-bar">
    <p id="pendingActionText">Want me to log that?</p>

    <div class="pending-action-buttons">
      <button type="button" onclick="confirmAriAction()">Yes</button>
      <button type="button" onclick="cancelAriAction()">Cancel</button>
    </div>
  </div>
</section>

<div class="ari-bottom-input">
  <div class="ari-input-shell">
    <textarea
      id="ariInput"
      rows="1"
      placeholder="Tell Ari something..."
      oninput="autoResizeAriInput()"
      onkeydown="handleAriEnter(event)"
    ></textarea>

    <button
      id="ariSendBtn"
      class="ari-send-btn"
      type="button"
      onclick="sendAriMessage()">
      ➤
    </button>
  </div>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="calbuddy-core.js?v=3.5.8"></script>
<script src="ari/ari-rebirth-app-bridge.js?v=1.7.4"></script>
<script src="js/home.js"></script>

</body>
</html>
