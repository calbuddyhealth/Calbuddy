<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Ari · Harness comparison</title>
<style>body{font:16px/1.6 system-ui;background:#071120;color:#e8f0ff;margin:0}main{max-width:1000px;margin:auto;padding:30px 20px}h1{line-height:1.1}p{color:#aabbd0}button,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #49617f;background:#152944;color:white;margin:5px 5px 5px 0}button{cursor:pointer}button:disabled{opacity:.5}article{padding:20px;border:1px solid #29415e;border-radius:18px;margin:20px 0;background:#0d1b30}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.answer{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#8fb9d9}a{color:#8cdffa}#status{min-height:28px}details{margin-top:16px}@media(max-width:650px){.pair{grid-template-columns:1fr}}</style></head>
<body><main><a href="/ari-vnext-growth.html">← Growth inbox</a><h1>Does Ari’s harness help?</h1><p>Compare two answers before revealing which used the harness. Same SOL model, input, high reasoning effort, and 4,096 output-token limit. Each test makes two paid model calls. No automatic judge.</p><p id="scope"></p><label for="task">Test case</label><br><select id="task"></select><button id="run" disabled>Run one comparison</button><button id="refresh">Refresh results</button><button id="download">Download results</button><p id="status" role="status" aria-live="polite">Checking owner access…</p><p id="summary"></p><section id="results"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="calbuddy-core.js?v=3.6.4"></script>
<script>
let trials=[],busy=false;const $=id=>document.getElementById(id);const revealed=new Set();
async function api(body){const session=await CalBuddy.getCurrentSession();if(!session?.access_token)throw Error('Sign in to Ari with your owner account, then refresh this page.');const r=await fetch('/api/ari-harness-comparison',{method:body?'POST':'GET',headers:{Authorization:`Bearer ${session.access_token}`,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function node(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;parent?.append(n);return n}
async function refresh(){const data=await api();trials=data.trials||[];$('scope').textContent=data.scope;$('task').replaceChildren();for(const c of data.cases||[]){const o=node('option',c.title,$('task'));o.value=c.id}render();$('run').disabled=busy;$('status').textContent='Ready. Start with one pair; repeat cases to check consistency.'}
function render(){const root=$('results');root.replaceChildren();let wins=0,losses=0,ties=0;for(const t of trials){const r=t.result;if(r?.valid&&t.preference){if(t.preference==='tie')ties++;else if(['A','B'].includes(t.preference)){if(r.candidates.find(c=>c.label===t.preference)?.variant==='with_harness')wins++;else losses++}}}
$('summary').textContent=`Rated valid pairs: harness ${wins}, basic SOL ${losses}, ties ${ties}. Small samples are exploratory; this is not proof of overall superiority.`;
for(const t of trials){const a=node('article',undefined,root);node('h2',t.case_id,a);node('small',`${new Date(t.created_at).toLocaleString()} · ${t.status}`,a);if(!t.result?.candidates){node('p',t.result?.error||'This trial is still pending or was interrupted. It will not automatically run again.',a);continue}const pair=node('div',undefined,a);pair.className='pair';for(const c of t.result.candidates){const panel=node('section',undefined,pair);node('h3',`Answer ${c.label}`,panel);node('small',c.valid?'':'Invalid trial: '+c.error,panel);const text=node('div',c.answer||'No answer returned.',panel);text.className='answer'}
if(t.result.valid&&!revealed.has(t.trial_id)){node('p','Which answer is more correct, useful, and faithful to the instructions?',a);for(const choice of ['A','B','tie','neither']){const b=node('button',t.preference===choice?`✓ ${choice}`:choice,a);b.onclick=async()=>{try{await api({action:'vote',trialId:t.trial_id,preference:choice});t.preference=choice;render()}catch(e){$('status').textContent=e.message}}}}
const b=node('button',revealed.has(t.trial_id)?'Labels revealed':'Reveal labels and measurements',a);b.onclick=()=>{revealed.add(t.trial_id);render()};if(revealed.has(t.trial_id)){for(const c of t.result.candidates)node('p',`${c.label}: ${c.variant==='with_harness'?'Ari harness':'Basic SOL'} · ${(c.latencyMs/1000).toFixed(1)}s · input ${c.usage?.input_tokens??'unknown'} / output ${c.usage?.output_tokens??'unknown'} tokens · ${c.instructionCharacters??'unknown'} instruction characters`,a);node('small','Once labels are revealed, voting is disabled for this view. '+t.result.scope,a)}}}
$('run').onclick=async()=>{if(busy)return;busy=true;$('run').disabled=true;$('status').textContent='Running two independent SOL calls. This may take up to two minutes…';try{const data=await api({action:'run',trialId:crypto.randomUUID(),caseId:$('task').value});if(data.trial)trials.unshift(data.trial);render();$('status').textContent=data.trial?.result?.valid?'Finished. Compare A and B before revealing labels.':'Trial did not complete successfully. Check results before starting another.'}catch(e){$('status').textContent=e.message}finally{busy=false;$('run').disabled=false}};
$('refresh').onclick=()=>refresh().catch(e=>$('status').textContent=e.message);
$('download').onclick=()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),trials},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=node('a');a.href=url;a.download='ari-harness-comparison.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
refresh().catch(e=>$('status').textContent=e.message);
</script></body></html>
