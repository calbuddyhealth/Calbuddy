<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Goals - CalBuddy</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main class="app">

<header class="top-bar">
<button class="menu-btn" onclick="window.location.href='index.html'">≡</button>

<h1 class="logo">
<span class="cal">Cal</span><span class="buddy">Buddy</span>
</h1>

<button class="signin-btn"
onclick="window.location.href='index.html'">
← Back
</button>
</header>

<section class="hero-card" style="display:block;padding:24px;">
<h2>🎯 My Goals</h2>

<br>

<label>Target Weight (lbs)</label>
<input
type="number"
placeholder="185"
style="width:100%;padding:12px;margin-top:6px;margin-bottom:16px;"
>

<label>Daily Calorie Goal</label>
<input
type="number"
placeholder="2100"
style="width:100%;padding:12px;margin-top:6px;margin-bottom:16px;"
>

<label>Weekly Weight Loss Goal</label>
<select
style="width:100%;padding:12px;margin-top:6px;margin-bottom:20px;"
>
<option>0.5 lb/week</option>
<option>1 lb/week</option>
<option>1.5 lb/week</option>
<option>2 lb/week</option>
</select>

<button class="signin-btn" style="width:100%;">
Save Goals
</button>

</section>

</main>
</body>
</html>
