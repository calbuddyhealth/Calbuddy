<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fc" />
  <title>Meetup Room | ARI Circle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/ari-circle-v5-real-world.css?v=5.0.0" />
  <link rel="stylesheet" href="assets/css/ari-circle-v5-pearl.css?v=5.1.0" />
  <link rel="stylesheet" href="assets/css/ari-circle-v5-premium.css?v=5.2.0" />
  <link rel="stylesheet" href="assets/css/ari-circle-v5-visual-authority.css?v=5.2.5" />
  <link rel="stylesheet" href="assets/css/ari-circle-meetup-room-v1.css?v=1.1.0" />
</head>
<body class="circle-v5-real-world">
  <div class="meetup-room-loading" id="meetupRoomLoading" role="status" aria-live="polite">Opening meetup room…</div>

  <main class="circle-v5-page meetup-room-page" id="meetupRoomPage" hidden>
    <header class="circle-v5-header feed-header">
      <a class="feed-icon-button meetup-room-back" href="ari-circle-meetup.html" aria-label="Back to Meet Up">←</a>
      <a class="feed-brand circle-v5-brand" href="ari-circle-feed.html" aria-label="ARI Circle Feed"><span>ARI CIRCLE</span></a>
      <a class="circle-v4-message" href="ari-circle-messages.html" aria-label="Messages">💬</a>
    </header>

    <div class="circle-v5-page-main meetup-room-main">
      <section class="meetup-room-hero" aria-labelledby="meetupRoomTitle">
        <div class="meetup-room-kicker-row">
          <p>MEETUP ROOM</p>
          <span class="meetup-room-status" id="meetupRoomStatusBadge">Scheduled</span>
        </div>
        <h1 id="meetupRoomTitle">Meetup</h1>
        <p class="meetup-room-description" id="meetupRoomDescription" hidden></p>
        <div class="meetup-room-meta">
          <span id="meetupRoomTime">◷ Time</span>
          <span id="meetupRoomArea">📍 Area</span>
          <span id="meetupRoomCount">👥 0 going</span>
        </div>
        <p class="meetup-room-countdown" id="meetupRoomCountdown" hidden></p>
      </section>

      <section class="meetup-room-section meetup-room-point" aria-labelledby="meetingPointTitle">
        <div class="meetup-room-section-head">
          <div><p>MEET HERE</p><h2 id="meetingPointTitle">📍 Meeting point</h2></div>
        </div>

        <div class="meetup-room-point-summary">
          <div class="meetup-room-point-copy">
            <strong id="meetingPointValue">Not set yet</strong>
            <span id="meetingPointPrivacy">Private to attendees</span>
          </div>
          <div class="meetup-room-point-actions">
            <button class="circle-v5-button meetup-room-copy" id="copyMeetingPoint" type="button" hidden>Copy</button>
            <button class="circle-v5-button meetup-room-edit-point" id="editMeetingPoint" type="button" hidden>Set</button>
          </div>
        </div>

        <form class="meetup-room-point-form" id="meetingPointForm" hidden>
          <label class="sr-only" for="meetingPointInput">Exact meeting point</label>
          <input class="circle-v5-input" id="meetingPointInput" maxlength="180" placeholder="North entrance by the front desk" autocomplete="off" />
          <div class="meetup-room-point-form-actions">
            <button class="circle-v5-button-primary" id="saveMeetingPoint" type="submit">Save</button>
            <button class="circle-v5-button" id="cancelMeetingPoint" type="button">Cancel</button>
          </div>
        </form>
      </section>

      <section class="meetup-room-section meetup-room-people" aria-labelledby="goingTitle">
        <div class="meetup-room-section-head">
          <div><p>PEOPLE</p><h2 id="goingTitle">Going</h2></div>
        </div>
        <div class="meetup-room-attendees" id="meetupAttendeeList" aria-live="polite"></div>
      </section>

      <section class="meetup-room-section meetup-room-chat" aria-labelledby="meetupChatTitle">
        <div class="meetup-room-section-head">
          <div><p>CHAT</p><h2 id="meetupChatTitle">Meetup chat</h2></div>
          <span class="meetup-room-chat-state" id="meetupChatState">Live</span>
        </div>

        <div class="meetup-room-messages" id="meetupRoomMessages" aria-live="polite"></div>
        <div class="meetup-room-chat-empty" id="meetupChatEmpty">No messages yet. Say something 👋</div>

        <div class="meetup-room-quick-actions" id="meetupRoomQuickActions" aria-label="Quick meetup messages">
          <button type="button" data-meetup-quick-message="On my way 🚶">On my way</button>
          <button type="button" data-meetup-quick-message="I'm here 👋">I'm here 👋</button>
          <button type="button" data-meetup-quick-message="Running a little late">Running late</button>
        </div>

        <form class="meetup-room-composer" id="meetupRoomMessageForm">
          <textarea id="meetupRoomMessageInput" maxlength="1000" rows="1" placeholder="Say something…" aria-label="Message the meetup"></textarea>
          <button class="circle-v5-button-primary" id="meetupRoomSend" type="submit">Send</button>
        </form>
        <p class="meetup-room-readonly" id="meetupRoomReadonly" hidden>This meetup chat is now read-only.</p>
        <p class="meetup-room-archive-note" id="meetupRoomArchiveNote"></p>
      </section>
    </div>
  </main>

  <div id="meetupRoomToast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script id="ariCircleMenuV5Script" src="js/ari-circle/circle-menu-v5.js?v=2.4.3" defer></script>
  <script id="ariCircleSocialBadgesScript" src="js/ari-circle/social-badges.js?v=1.2.0" defer></script>
  <script src="supabase-config.js?v=1.1.8"></script>
  <script id="ariCircleV5RealWorldModerationScript" src="js/ari-circle/real-world-moderation-v5.js?v=5.1.0" defer></script>
  <script id="ariCircleV5RealWorldScript" src="js/ari-circle/v5-real-world.js?v=5.2.4" defer></script>
  <script src="js/ari-circle/meetups/meetup-room-v1.js?v=1.1.0" defer></script>
</body>
</html>
