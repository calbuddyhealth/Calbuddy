<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - ARI XP</title>

<link rel="stylesheet" href="style.css">

<style>
.profile-page {
  max-width: 430px;
  margin: 0 auto;
  padding: 20px;
}

.profile-card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 20px;
  margin-top: 20px;
}

.profile-card h2 {
  margin-top: 0;
}

.profile-label {
  margin: 15px 0 8px;
  font-weight: 800;
}

.profile-email {
  margin: 10px 0 15px;
  font-weight: 700;
  word-break: break-word;
}

.profile-input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid rgba(45, 212, 191, 0.45);
  background: rgba(2, 6, 23, 0.85);
  color: white;
  font-weight: 800;
  outline: none;
  margin-bottom: 10px;
}

.profile-input:focus {
  border-color: #67e8f9;
  box-shadow: 0 0 18px rgba(103, 232, 249, 0.25);
}

.profile-btn {
  width: 100%;
  margin-top: 10px;
  border: none;
  border-radius: 16px;
  padding: 14px;
  font-weight: 900;
  cursor: pointer;
}

.primary-btn {
  background: #2dd4bf;
  color: white;
}

.secondary-btn {
  background: #0891b2;
  color: white;
}

.danger-btn {
  background: #ef4444;
  color: white;
}

.home-btn {
  background: linear-gradient(135deg,#0891b2,#22d3ee);
  color: white;
  margin-bottom: 16px;
}

.status-text {
  margin-top: 10px;
  font-size: 14px;
  font-weight: 800;
  color: #67e8f9;
}
</style>

</head>
<body>

<main class="profile-page">

<h1>
<span class="cal">ARI</span><span class="buddy"> XP</span>
</h1>

<div class="profile-card">

<button
class="profile-btn home-btn"
onclick="window.location.href='home.html'">
🏠 Home
</button>

<h2>My Identity</h2>

<p class="profile-label">What should Ari call you?</p>

<input
id="displayName"
class="profile-input"
type="text"
placeholder="Enter your display name"
autocomplete="name"
/>

<button
class="profile-btn primary-btn"
onclick="saveDisplayName()">
Save Display Name
</button>

<div id="profileStatus" class="status-text"></div>

<p class="profile-label">Email Address</p>

<div id="userEmail" class="profile-email">
Loading...
</div>

<button
class="profile-btn primary-btn"
onclick="changeEmail()">
Change Email
</button>

<button
class="profile-btn secondary-btn"
onclick="resetPassword()">
Change Password
</button>

<button
class="profile-btn danger-btn"
onclick="logoutUser()">
Log Out
</button>

<button
class="profile-btn"
onclick="window.location.href='home.html'">
Back Home
</button>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
document.addEventListener("DOMContentLoaded", loadProfile);

async function loadProfile() {
  const { data, error } =
    await window.calbuddySupabase.auth.getSession();

  if (error || !data?.session) {
    window.location.href = "signin.html";
    return;
  }

  const user = data.session.user;

  document.getElementById("userEmail").textContent =
    user.email || "No email found.";

  const { data: profile, error: profileError } =
    await window.calbuddySupabase
      .from("profiles")
      .select("display_name")
      .eq("id", user.id)
      .single();

  if (profileError) {
    console.warn("Profile load warning:", profileError.message);
    return;
  }

  document.getElementById("displayName").value =
    profile?.display_name || user.user_metadata?.display_name || "";
}

async function saveDisplayName() {
  const statusEl = document.getElementById("profileStatus");
  statusEl.textContent = "";

  const {
    data: { session },
    error: sessionError
  } = await window.calbuddySupabase.auth.getSession();

  if (sessionError || !session) {
    window.location.href = "signin.html";
    return;
  }

  const displayName =
    document.getElementById("displayName").value.trim();

  if (!displayName) {
    statusEl.textContent = "Please enter what Ari should call you.";
    return;
  }

  const { error } =
    await window.calbuddySupabase
      .from("profiles")
      .upsert(
        {
          id: session.user.id,
          email: session.user.email,
          display_name: displayName,
          updated_at: new Date().toISOString()
        },
        {
          onConflict: "id"
        }
      );

  if (error) {
    statusEl.textContent = error.message;
    return;
  }

  await window.calbuddySupabase.auth.updateUser({
    data: {
      display_name: displayName
    }
  });

  statusEl.textContent = "Display name updated.";
}

async function logoutUser() {
  await window.calbuddySupabase.auth.signOut();
  sessionStorage.removeItem("ari_boot_intro");
  window.location.href = "signin.html";
}

async function resetPassword() {
  const { data } =
    await window.calbuddySupabase.auth.getSession();

  if (!data?.session) {
    window.location.href = "signin.html";
    return;
  }

  const email = data.session.user.email;

  await window.calbuddySupabase.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:
        window.location.origin +
        "/reset-password.html"
    }
  );

  alert("Password reset email sent.");
}

async function changeEmail() {
  const newEmail =
    prompt("Enter your new email address:");

  if (!newEmail) return;

  const { error } =
    await window.calbuddySupabase.auth.updateUser({
      email: newEmail
    });

  if (error) {
    alert(error.message);
    return;
  }

  alert("Confirmation email sent to your new address.");
}
</script>

</body>
</html>
