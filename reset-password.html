<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Reset Password | ARI Rebirth</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
/>

<style>
:root {
  --ari-bg: #020617;
  --ari-panel: rgba(8, 20, 38, 0.86);
  --ari-cyan: #22d3ee;
  --ari-cyan-soft: #67e8f9;
  --ari-cyan-pale: #cffafe;
  --ari-text: #f8fafc;
  --ari-muted: #94a3b8;
  --ari-border: rgba(103, 232, 249, 0.26);
  --ari-error: #fecaca;
  --ari-success: #bbf7d0;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.18), transparent 32%),
    radial-gradient(circle at 18% 28%, rgba(59, 130, 246, 0.1), transparent 30%),
    linear-gradient(180deg, #020617 0%, #07111f 50%, #020617 100%);
  color: var(--ari-text);
  font-family:
    Orbitron,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(103, 232, 249, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(103, 232, 249, 0.04) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(circle at center, black 0%, transparent 76%);
}

.ari-reset-page {
  position: relative;
  z-index: 1;
  width: min(430px, 100%);
  min-height: 100dvh;
  margin: 0 auto;
  padding: 18px 16px 80px;
}

.ari-reset-header {
  display: grid;
  grid-template-columns: 52px 1fr 52px;
  align-items: center;
  gap: 10px;
  padding: 8px 0 20px;
}

.ari-back-btn {
  width: 48px;
  min-height: 44px;
  border: 1px solid var(--ari-border);
  border-radius: 15px;
  background: rgba(2, 6, 23, 0.74);
  color: var(--ari-cyan-pale);
  font-family: inherit;
  font-size: 1.15rem;
  font-weight: 900;
  cursor: pointer;
}

.ari-brand-mark {
  text-align: center;
}

.ari-brand-title {
  margin: 0;
  font-family: Audiowide, Orbitron, sans-serif;
  font-size: 1.3rem;
  letter-spacing: 0.12em;
  text-shadow: 0 0 18px rgba(34, 211, 238, 0.28);
}

.ari-brand-subtitle {
  margin: 4px 0 0;
  color: var(--ari-cyan-soft);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.22em;
}

.ari-reset-card {
  padding: 24px 20px;
  border: 1px solid var(--ari-border);
  border-radius: 28px;
  background:
    radial-gradient(circle at 90% 0%, rgba(34, 211, 238, 0.13), transparent 28%),
    linear-gradient(180deg, rgba(15, 23, 42, 0.94), var(--ari-panel));
  box-shadow:
    0 0 34px rgba(34, 211, 238, 0.12),
    inset 0 0 28px rgba(103, 232, 249, 0.035);
}

.ari-reset-kicker {
  margin: 0 0 8px;
  color: var(--ari-cyan-soft);
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.ari-reset-title {
  margin: 0;
  font-family: Audiowide, Orbitron, sans-serif;
  font-size: 1.8rem;
  line-height: 1.1;
}

.ari-reset-description {
  margin: 12px 0 20px;
  color: var(--ari-muted);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size: 0.9rem;
  font-weight: 650;
  line-height: 1.5;
}

.ari-reset-field {
  margin-top: 14px;
}

.ari-reset-label {
  display: block;
  margin-bottom: 8px;
  color: var(--ari-cyan-soft);
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.ari-reset-input {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid rgba(103, 232, 249, 0.24);
  border-radius: 17px;
  outline: none;
  background: rgba(2, 6, 23, 0.82);
  color: var(--ari-text);
  font: inherit;
  font-size: 0.92rem;
  font-weight: 750;
}

.ari-reset-input:focus {
  border-color: rgba(103, 232, 249, 0.68);
  box-shadow: 0 0 20px rgba(34, 211, 238, 0.15);
}

.ari-reset-input::placeholder {
  color: rgba(203, 213, 225, 0.46);
}

.ari-reset-btn {
  width: 100%;
  min-height: 54px;
  margin-top: 18px;
  border: 1px solid rgba(103, 232, 249, 0.42);
  border-radius: 18px;
  background: linear-gradient(135deg, #0891b2, #22d3ee);
  color: white;
  font-family: inherit;
  font-weight: 950;
  letter-spacing: 0.06em;
  cursor: pointer;
  box-shadow: 0 0 22px rgba(34, 211, 238, 0.2);
}

.ari-reset-btn:disabled {
  opacity: 0.58;
  cursor: not-allowed;
}

.ari-reset-message {
  min-height: 22px;
  margin: 14px 2px 0;
  color: var(--ari-cyan-pale);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size: 0.8rem;
  font-weight: 750;
  line-height: 1.4;
}

.ari-reset-message.error {
  color: var(--ari-error);
}

.ari-reset-message.success {
  color: var(--ari-success);
}
</style>
</head>

<body>

<main class="ari-reset-page">

<header class="ari-reset-header">
  <button
    class="ari-back-btn"
    type="button"
    onclick="window.location.href='signin.html'"
    aria-label="Return to sign in"
  >
    ←
  </button>

  <div class="ari-brand-mark" aria-label="ARI Rebirth">
    <h1 class="ari-brand-title">ARI</h1>
    <p class="ari-brand-subtitle">REBIRTH</p>
  </div>

  <div aria-hidden="true"></div>
</header>

<section class="ari-reset-card">
  <p class="ari-reset-kicker">Account Recovery</p>
  <h2 class="ari-reset-title">Reset Password</h2>

  <p class="ari-reset-description">
    Enter a new password for your ARI Rebirth account.
  </p>

  <div class="ari-reset-field">
    <label class="ari-reset-label" for="newPassword">New Password</label>
    <input
      id="newPassword"
      class="ari-reset-input"
      type="password"
      placeholder="At least 6 characters"
      autocomplete="new-password"
    />
  </div>

  <div class="ari-reset-field">
    <label class="ari-reset-label" for="confirmPassword">Confirm Password</label>
    <input
      id="confirmPassword"
      class="ari-reset-input"
      type="password"
      placeholder="Re-enter your password"
      autocomplete="new-password"
    />
  </div>

  <button id="resetBtn" class="ari-reset-btn" type="button">
    UPDATE PASSWORD
  </button>

  <p
    id="resetMessage"
    class="ari-reset-message"
    role="status"
    aria-live="polite"
  ></p>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=10"></script>

<script>
const newPasswordInput = document.getElementById("newPassword");
const confirmPasswordInput = document.getElementById("confirmPassword");
const resetBtn = document.getElementById("resetBtn");
const resetMessage = document.getElementById("resetMessage");

function setResetMessage(text = "", type = "") {
  resetMessage.textContent = text;
  resetMessage.classList.remove("error", "success");

  if (type) {
    resetMessage.classList.add(type);
  }
}

async function updatePassword() {
  const newPassword = newPasswordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if (!newPassword) {
    setResetMessage("Enter a new password.", "error");
    return;
  }

  if (newPassword.length < 6) {
    setResetMessage("Password must be at least 6 characters.", "error");
    return;
  }

  if (newPassword !== confirmPassword) {
    setResetMessage("Passwords do not match.", "error");
    return;
  }

  if (!window.calbuddySupabase) {
    setResetMessage("Supabase is not loaded.", "error");
    return;
  }

  resetBtn.disabled = true;
  setResetMessage("Updating password...");

  try {
    const { error } = await window.calbuddySupabase.auth.updateUser({
      password: newPassword
    });

    if (error) {
      setResetMessage(error.message, "error");
      resetBtn.disabled = false;
      return;
    }

    setResetMessage(
      "Password updated. Redirecting to sign in...",
      "success"
    );

    setTimeout(() => {
      window.location.replace("signin.html");
    }, 1200);
  } catch (error) {
    console.error("Password reset error:", error);
    setResetMessage(
      "Unable to update your password. Request a new reset link and try again.",
      "error"
    );
    resetBtn.disabled = false;
  }
}

resetBtn.addEventListener("click", updatePassword);

[newPasswordInput, confirmPasswordInput].forEach((input) => {
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      updatePassword();
    }
  });
});
</script>

</body>
</html>
