<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - CalBuddy</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
<main class="app">
<header class="top-bar">
<button class="menu-btn" onclick="window.location.href='signin.html'">←</button>

<h1 class="logo">
<span class="cal">Cal</span><span class="buddy">Buddy</span>
</h1>
</header>

<section class="hero-card" style="display:block; padding:28px;">
<h2>Reset Password</h2>

<input id="newPassword" type="password" placeholder="New password"
style="width:100%; padding:14px; margin:10px 0; border-radius:14px; border:1px solid #ddd;" />

<input id="confirmPassword" type="password" placeholder="Confirm password"
style="width:100%; padding:14px; margin:10px 0; border-radius:14px; border:1px solid #ddd;" />

<button id="resetBtn" type="button" class="signin-btn" style="width:100%; margin-top:12px;">
Update Password
</button>

<p id="resetMessage" style="margin-top:16px; font-weight:700;"></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=8"></script>

<script>
const newPasswordInput = document.getElementById("newPassword");
const confirmPasswordInput = document.getElementById("confirmPassword");
const resetBtn = document.getElementById("resetBtn");
const resetMessage = document.getElementById("resetMessage");

function setResetMessage(text) {
resetMessage.textContent = text;
}

resetBtn.addEventListener("click", async () => {
const newPassword = newPasswordInput.value.trim();
const confirmPassword = confirmPasswordInput.value.trim();

if (!newPassword) {
setResetMessage("Enter a new password.");
return;
}

if (newPassword.length < 6) {
setResetMessage("Password must be at least 6 characters.");
return;
}

if (newPassword !== confirmPassword) {
setResetMessage("Passwords do not match.");
return;
}

resetBtn.disabled = true;
setResetMessage("Updating password...");

const { error } = await window.calbuddySupabase.auth.updateUser({
password: newPassword
});

if (error) {
setResetMessage(error.message);
resetBtn.disabled = false;
return;
}

setResetMessage("Password updated. Redirecting to sign in...");

setTimeout(() => {
window.location.href = "signin.html";
}, 1200);
});
</script>
</body>
</html>
