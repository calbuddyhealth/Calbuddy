<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARI Nutrition Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/nutrition.css">
<link rel="stylesheet" href="assets/css/composer.css">

</head>

<body>

<main class="ari-nutrition-page" id="ariNutritionApp">

<!-- ==========================================
HEADER
========================================== -->

<header class="ari-nutrition-header">

    <button
        class="ari-back-btn"
        type="button"
        onclick="goBack()">

        ←

    </button>

    <div class="ari-brand">

        <h1 class="ari-brand-title">

            ARI

        </h1>

        <p class="ari-brand-subtitle">

            Nutrition Intelligence

        </p>

    </div>

    <button
        class="ari-home-btn"
        type="button"
        onclick="goHome()">

        Home

    </button>

</header>

<!-- ==========================================
ASK ARI
========================================== -->

<section
class="ari-panel"
id="askAriSection">

    <div class="ari-panel-header">

        <h2>

            Ask Ari

        </h2>

        <p>

            Ask anything about nutrition,
            meal planning,
            calories,
            macros,
            supplements,
            or healthy eating.

        </p>

    </div>

    <div
    id="ariMessages"
    class="ari-thread">

    </div>

    <div class="ari-bottom-input">

        <div class="ari-input-shell">

            <textarea

                id="ariInput"

                rows="1"

                placeholder="Ask Ari about nutrition..."

            ></textarea>

            <button

                id="ariSendBtn"

                class="ari-send-btn"

                type="button">

                ➤

            </button>

        </div>

    </div>

</section>

<!-- ==========================================
MANUAL ENTRY
========================================== -->

<section
class="ari-panel"
id="manualEntrySection">

    <div class="ari-panel-header">

        <h2>

            Manual Entry

        </h2>

    </div>

    <div class="ari-form">

        <input
        id="mealName"
        type="text"
        placeholder="Food Name">

        <input
        id="mealCalories"
        type="number"
        placeholder="Calories">

        <details>

            <summary>

                Advanced Nutrition

            </summary>

            <input
            id="mealProtein"
            type="number"
            placeholder="Protein">

            <input
            id="mealCarbs"
            type="number"
            placeholder="Carbs">

            <input
            id="mealFat"
            type="number"
            placeholder="Fat">

            <select
            id="mealType">

                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Dinner</option>
                <option>Snack</option>
                <option>Drink</option>

            </select>

        </details>

        <button
        id="saveMealBtn">

            Save Meal

        </button>

    </div>

</section>

<!-- ==========================================
TODAY'S MEALS
========================================== -->

<details
class="ari-panel"
id="todayMealsSection">

    <summary>

        Today's Meals

    </summary>

    <div
    id="todayMealList">

    </div>

</details>

<!-- ==========================================
TODAY'S NUTRITION
========================================== -->

<details
class="ari-panel"
id="todayNutritionSection">

    <summary>

        Today's Nutrition

    </summary>

    <div
    class="nutrition-summary">

        <div id="totalCalories">

            Calories

        </div>

        <div id="totalProtein">

            Protein

        </div>

        <div id="totalCarbs">

            Carbs

        </div>

        <div id="totalFat">

            Fat

        </div>

        <div id="fiberTotal">

            Fiber

        </div>

        <div id="vitaminCTotal">

            Vitamin C

        </div>

        <div id="ironTotal">

            Iron

        </div>

        <div id="calciumTotal">

            Calcium

        </div>

        <div id="potassiumTotal">

            Potassium

        </div>

    </div>

</details>

<!-- ==========================================
RECENT MEALS
========================================== -->

<section
class="ari-panel"
id="recentMealsSection">

    <div class="ari-panel-header">

        <h2>

            Recent Meals

        </h2>

    </div>

    <div
    id="recentMealList">

    </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="js/auth.js"></script>

<script src="ari/ari-rebirth-app-bridge.js"></script>

<script src="calbuddy-core.js"></script>

<script src="js/nutrition.js"></script>

</body>
</html>
