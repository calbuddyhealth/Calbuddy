<body>
<main class="ari-nutrition-page" id="ariNutritionApp">

  <!-- Header -->
  <header class="ari-nutrition-header">
    <button class="ari-back-btn" type="button" onclick="goBack()" aria-label="Go back">&#8592;</button>
    <div class="ari-brand">
      <h1 class="ari-brand-title">ARI</h1>
      <p class="ari-brand-subtitle">Nutrition Intelligence</p>
    </div>
    <button class="ari-home-btn" type="button" onclick="goHome()" aria-label="Go home">Home</button>
  </header>

  <!-- 1. LOG A MEAL -->
  <section class="ari-panel ari-manual-console" id="manualEntrySection">
    <header class="ari-manual-header">
      <div class="ari-manual-title-group">
        <div>
          <p class="ari-manual-eyebrow">Find a food or add your own</p>
          <h2>Log a meal</h2>
        </div>
      </div>
      <div class="ari-manual-status" id="manualFoodSystemStatus" aria-live="polite">
        <span></span><span id="manualFoodSystemStatusText">READY</span>
      </div>
    </header>

    <div class="ari-form">
      <div class="ari-food-search-shell" id="mealFoodSearchShell">
        <label class="ari-field-shell" for="mealName">
          <span class="ari-field-label">Food Name</span>
          <span class="ari-field-control">
            <input id="mealName" type="text" placeholder="Search foods and drinks" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="mealFoodResults" />
          </span>
        </label>
        <div id="mealFoodResults" class="ari-food-search-results" role="listbox" aria-label="Food search results" hidden></div>
        <div id="mealFoodSelection" class="ari-food-selection" aria-live="polite" hidden>
          <div class="ari-food-selection-copy">
            <span class="ari-food-selection-kicker">DATABASE MATCH</span>
            <strong id="mealSelectedFoodName"></strong>
            <span id="mealSelectedFoodMeta"></span>
          </div>
          <button id="clearSelectedFoodBtn" class="ari-food-selection-clear" type="button" aria-label="Clear selected food">CLEAR</button>
        </div>
      </div>

      <div class="ari-manual-measurement-grid" id="mealMeasurementControls" hidden>
        <label class="ari-field-shell" for="mealQuantity">
          <span class="ari-field-label">Amount</span>
          <span class="ari-field-control">
            <input id="mealQuantity" type="number" min="0.01" step="0.01" value="1" inputmode="decimal" aria-label="Food amount" />
          </span>
        </label>
        <label class="ari-field-shell" for="mealUnit">
          <span class="ari-field-label">Serving / Unit</span>
          <span class="ari-field-control"><select id="mealUnit" aria-label="Food serving or measurement unit"></select></span>
        </label>
      </div>

      <p id="mealCalculationStatus" class="ari-food-calculation-status" role="status" aria-live="polite" hidden></p>

      <label class="ari-field-shell" for="mealCalories">
        <span class="ari-field-label">Calories</span>
        <span class="ari-field-control">
          <input id="mealCalories" type="number" min="0" step="1" placeholder="Auto-calculated or enter manually" inputmode="decimal" />
          <span class="ari-field-unit" aria-hidden="true">KCAL</span>
        </span>
      </label>

      <details class="ari-advanced-nutrition">
        <summary><span class="ari-advanced-summary-title">Advanced Nutrition</span></summary>

        <label class="ari-field-shell" for="mealProtein">
          <span class="ari-field-label">Protein</span>
          <span class="ari-field-control"><input id="mealProtein" type="number" min="0" step="0.1" placeholder="Protein" inputmode="decimal" /><span class="ari-field-unit">G</span></span>
        </label>

        <label class="ari-field-shell" for="mealCarbs">
          <span class="ari-field-label">Carbohydrates</span>
          <span class="ari-field-control"><input id="mealCarbs" type="number" min="0" step="0.1" placeholder="Carbs" inputmode="decimal" /><span class="ari-field-unit">G</span></span>
        </label>

        <label class="ari-field-shell" for="mealFat">
          <span class="ari-field-label">Fat</span>
          <span class="ari-field-control"><input id="mealFat" type="number" min="0" step="0.1" placeholder="Fat" inputmode="decimal" /><span class="ari-field-unit">G</span></span>
        </label>

        <label class="ari-field-shell" for="mealType">
          <span class="ari-field-label">Meal Type</span>
          <span class="ari-field-control">
            <select id="mealType" aria-label="Meal type">
              <option>Breakfast</option>
              <option>Lunch</option>
              <option>Dinner</option>
              <option>Snack</option>
              <option>Drink</option>
              <option>Meal</option>
            </select>
          </span>
        </label>

        <label class="ari-field-shell" for="mealDate">
          <span class="ari-field-label">Date</span>
          <span class="ari-field-control"><input id="mealDate" type="date" aria-label="Meal date" /></span>
        </label>

        <label class="ari-field-shell" for="mealTime">
          <span class="ari-field-label">Time</span>
          <span class="ari-field-control"><input id="mealTime" type="time" aria-label="Meal time" /></span>
        </label>
      </details>

      <button id="saveMealBtn" type="button">
        <span id="saveMealIcon" aria-hidden="true">+</span>
        <span id="saveMealLabel">Save Meal</span>
      </button>
    </div>
  </section>

  <!-- 2. ASK ARI -->
  <section class="ari-panel ari-network-panel" id="askAriSection">
    <div class="nutrition-ask-heading">
      <h2>Ask Ari</h2>
      <p>Meals, macros, portions, or goals</p>
    </div>

    <div class="ari-crt-console">
      <div class="ari-crt-bezel">
        <div class="ari-crt-screen">
          <div id="ariMessages" class="ari-thread" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div class="ari-transmission-console">
      <div class="ari-bottom-input">
        <div class="ari-input-shell">
          <textarea id="ariInput" rows="1" placeholder="Ask Ari about nutrition..." aria-label="Ask Ari about nutrition"></textarea>
          <button id="ariSendBtn" class="ari-send-btn" type="button" aria-label="Send message to Ari">
            <span class="ari-send-icon" aria-hidden="true"></span>
            <span class="ari-send-label">Send</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. TODAY'S NUTRITION -->
  <details class="ari-panel ari-data-console" id="todayNutritionSection" open>
    <summary><span class="ari-summary-title">Today's Nutrition</span></summary>

    <div class="nutrition-summary">
      <div id="totalCalories">Calories</div>
      <div id="totalProtein">Protein</div>
      <div id="totalCarbs">Carbs</div>
      <div id="totalFat">Fat</div>
    </div>

    <details id="todayMealsSection" class="nutrition-today-meals">
      <summary><span id="todayMealCountLabel">Meals today · 0</span></summary>
      <div id="todayMealList"></div>
    </details>
  </details>

  <!-- 4. RECENT MEALS -->
  <details class="ari-panel ari-data-console" id="recentMealsSection">
    <summary><span class="ari-summary-title">Recent Meals</span></summary>
    <div id="recentMealList"></div>
  </details>

  <footer class="ari-nutrition-network-footer" aria-hidden="true">ARI Nutrition</footer>
</main>
