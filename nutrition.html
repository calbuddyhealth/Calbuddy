<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARI Nutrition Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="assets/css/base.css?v=16">
<link rel="stylesheet" href="assets/css/animations.css?v=16">
<link rel="stylesheet" href="assets/css/composer.css?v=1">
<link rel="stylesheet" href="assets/css/nutrition.css?v=1.0.1">
</head>

<body>

<main class="ari-nutrition-page" id="ariNutritionApp">

<!-- ==========================================
HEADER
========================================== -->

<header class="ari-nutrition-header">

  <button
    class="ari-back-btn"
    type="button"
    onclick="goBack()"
    aria-label="Go back"
  >
    ←
  </button>

  <div class="ari-brand">

    <h1 class="ari-brand-title">
      ARI
    </h1>

    <p class="ari-brand-subtitle">
      Nutrition Intelligence
    </p>

  </div>

  <button
    class="ari-home-btn"
    type="button"
    onclick="goHome()"
    aria-label="Go home"
  >
    Home
  </button>

</header>

<!-- ==========================================
ASK ARI
========================================== -->

<section class="ari-panel" id="askAriSection">

  <div class="ari-panel-header">

    <h2>
      Ask Ari
    </h2>

    <p>
      Ask anything about nutrition, meal planning, calories,
      macros, supplements, or healthy eating.
    </p>

  </div>

  <div
    id="ariMessages"
    class="ari-thread"
    aria-live="polite"
  ></div>

  <div class="ari-bottom-input">

    <div class="ari-input-shell">

      <textarea
        id="ariInput"
        rows="1"
        placeholder="Ask Ari about nutrition..."
        aria-label="Ask Ari about nutrition"
      ></textarea>

      <button
        id="ariSendBtn"
        class="ari-send-btn"
        type="button"
        aria-label="Send message"
      >
        ➤
      </button>

    </div>

  </div>

</section>

<!-- ==========================================
MANUAL ENTRY
========================================== -->

<section class="ari-panel" id="manualEntrySection">

  <div class="ari-panel-header">

    <h2>
      Manual Entry
    </h2>

  </div>

  <div class="ari-form">

    <input
      id="mealName"
      type="text"
      placeholder="Food Name"
      autocomplete="off"
    >

    <input
      id="mealCalories"
      type="number"
      min="0"
      step="1"
      placeholder="Calories"
      inputmode="decimal"
    >

    <details class="ari-advanced-nutrition">

      <summary>
        Advanced Nutrition
      </summary>

      <input
        id="mealProtein"
        type="number"
        min="0"
        step="0.1"
        placeholder="Protein"
        inputmode="decimal"
      >

      <input
        id="mealCarbs"
        type="number"
        min="0"
        step="0.1"
        placeholder="Carbs"
        inputmode="decimal"
      >

      <input
        id="mealFat"
        type="number"
        min="0"
        step="0.1"
        placeholder="Fat"
        inputmode="decimal"
      >

      <select id="mealType" aria-label="Meal type">
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
        <option>Snack</option>
        <option>Drink</option>
      </select>

    </details>

    <button
      id="saveMealBtn"
      type="button"
    >
      Save Meal
    </button>

  </div>

</section>

<!-- ==========================================
TODAY'S MEALS
========================================== -->

<details class="ari-panel" id="todayMealsSection">

  <summary>
    Today's Meals
  </summary>

  <div id="todayMealList"></div>

</details>

<!-- ==========================================
TODAY'S NUTRITION
========================================== -->

<details class="ari-panel" id="todayNutritionSection">

  <summary>
    Today's Nutrition
  </summary>

  <div class="nutrition-summary">

    <div id="totalCalories">
      Calories
    </div>

    <div id="totalProtein">
      Protein
    </div>

    <div id="totalCarbs">
      Carbs
    </div>

    <div id="totalFat">
      Fat
    </div>

  </div>

</details>

<!-- ==========================================
RECENT MEALS
========================================== -->

<details class="ari-panel" id="recentMealsSection">

  <summary>
    Recent Meals
  </summary>

  <div id="recentMealList"></div>

</details>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js?v=10"></script>
<script src="js/auth.js?v=1"></script>

<!-- Shared CalBuddy entry point -->
<script src="calbuddy-core.js?v=3.6.1"></script>

<!-- ARI Rebirth runtime -->
<script src="ari/ari-rebirth-app-bridge.js?v=2.5.1"></script>

<!-- Nutrition page behavior must load last -->
<script src="js/nutrition.js?v=4.0.1"></script>

</body>
</html>
