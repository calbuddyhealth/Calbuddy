<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log Intake - CalBuddy</title>
<link rel="stylesheet" href="style.css" />

<style>
.log-card {
display: block;
padding: 26px;
}

.log-tabs {
display: flex;
gap: 8px;
margin-bottom: 22px;
}

.log-tab {
flex: 1;
padding: 12px;
border: none;
border-radius: 18px;
font-weight: 900;
font-size: 0.9rem;
background: #f1f5f9;
cursor: pointer;
}

.log-tab.active {
background: #14b8a6;
color: white;
}

.meal-options {
display: none;
grid-template-columns: repeat(2, 1fr);
gap: 10px;
margin-bottom: 20px;
}

.meal-option {
padding: 12px;
border: none;
border-radius: 16px;
background: #f8f5ff;
font-weight: 900;
cursor: pointer;
}

.meal-option.active {
background: #8b5cf6;
color: white;
}

.search-section,
.manual-section {
display: none;
margin-top: 14px;
}

.search-section label,
.manual-section label {
display: block;
font-weight: 900;
margin-bottom: 8px;
}

.search-section input,
.manual-section input,
.manual-section select {
width: 100%;
box-sizing: border-box;
padding: 14px;
border-radius: 16px;
border: 1px solid #d8d8d8;
font-size: 16px;
margin-bottom: 10px;
}

.search-button,
.manual-save-btn {
width: 100%;
margin-top: 8px;
padding: 14px;
}

.food-result {
margin-top: 14px;
padding: 16px;
border-radius: 18px;
background: #f8fafc;
}

.food-result h3 {
margin-bottom: 6px;
}

.add-food-btn {
width: 100%;
margin-top: 10px;
}

.intake-list {
margin-top: 24px;
padding: 18px;
border-radius: 22px;
background: #f4fff8;
}

.intake-item {
padding: 10px 0;
border-bottom: 1px solid #d1fae5;
font-weight: 700;
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
}

.delete-intake-btn {
border: none;
background: #fff1f2;
color: #be123c;
border-radius: 12px;
padding: 6px 10px;
cursor: pointer;
font-weight: 900;
}

.success-message {
margin-top: 14px;
font-weight: 900;
color: #18a558;
text-align: center;
}
</style>
</head>

<body>
<main class="app">

<header class="top-bar">
<button class="menu-btn" onclick="window.location.href='index.html'">☰</button>

<h1 class="logo">
<span class="cal">Cal</span><span class="buddy">Buddy</span>
</h1>

<button class="signin-btn" onclick="window.location.href='index.html'">← Back</button>
</header>

<section class="hero-card log-card">

<div class="log-tabs">
<button class="log-tab" id="mealTab" onclick="selectMode('meal')">🍽️ Add Meal</button>
<button class="log-tab" id="drinkTab" onclick="selectMode('drink')">🥤 Add Drink</button>
<button class="log-tab" id="calorieTab" onclick="selectMode('calories')">🔢 Add Calories</button>
</div>

<div id="mealOptions" class="meal-options">
<button class="meal-option" onclick="selectMealType('Breakfast')">Breakfast</button>
<button class="meal-option" onclick="selectMealType('Lunch')">Lunch</button>
<button class="meal-option" onclick="selectMealType('Dinner')">Dinner</button>
<button class="meal-option" onclick="selectMealType('Snack')">Snack</button>
</div>

<div id="searchSection" class="search-section">
<label id="searchLabel">Search food</label>

<input
id="foodSearchInput"
type="text"
placeholder="Type food item"
/>

<button class="signin-btn search-button" onclick="searchFood()">
🔍 Search
</button>
</div>

<div id="manualSection" class="manual-section">
<label>Food / Item Name</label>
<input id="manualFoodName" type="text" placeholder="Example: homemade pasta" />

<label>Calories</label>
<input id="manualCalories" type="number" step="1" placeholder="Example: 650" />

<label>Category</label>
<select id="manualCategory">
<option value="Breakfast">Breakfast</option>
<option value="Lunch">Lunch</option>
<option value="Dinner">Dinner</option>
<option value="Snack">Snack</option>
<option value="Drink">Drink</option>
</select>

<button class="signin-btn manual-save-btn" onclick="saveManualCalories()">
Save
</button>
</div>

<div id="results"></div>

<div id="successMessage" class="success-message"></div>

<div class="intake-list">
<h3>Today’s Intake</h3>
<div id="todayIntakeItems"></div>
<p><strong>Total Consumed:</strong> <span id="totalConsumedText">0</span> kcal</p>
</div>

</section>

<footer>
🔒 Your data is private and secure.
</footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=8"></script>

<script>
let currentMode = "";
let selectedMealType = "";

function getTodayDate() {
return new Date().toISOString().split("T")[0];
}

async function getCurrentUser() {
const { data, error } = await window.calbuddySupabase.auth.getSession();

if (error || !data.session) {
return null;
}

return data.session.user;
}

function selectMode(mode) {
currentMode = mode;
selectedMealType = mode === "drink" ? "Drink" : "";

document.getElementById("mealTab").classList.toggle("active", mode === "meal");
document.getElementById("drinkTab").classList.toggle("active", mode === "drink");
document.getElementById("calorieTab").classList.toggle("active", mode === "calories");

document.getElementById("mealOptions").style.display =
mode === "meal" ? "grid" : "none";

document.getElementById("searchSection").style.display =
mode === "drink" ? "block" : "none";

document.getElementById("manualSection").style.display =
mode === "calories" ? "block" : "none";

document.getElementById("searchLabel").textContent =
mode === "drink" ? "Search drink" : "Search food";

document.getElementById("foodSearchInput").placeholder =
mode === "drink" ? "Example: orange juice" : "Example: chicken burrito";

document.getElementById("results").innerHTML = "";
document.getElementById("successMessage").textContent = "";
}

function selectMealType(type) {
selectedMealType = type;

document.querySelectorAll(".meal-option").forEach(button => {
button.classList.toggle("active", button.textContent === type);
});

document.getElementById("searchSection").style.display = "block";
document.getElementById("manualSection").style.display = "none";
document.getElementById("searchLabel").textContent = `Search food for ${type}`;
document.getElementById("foodSearchInput").placeholder = "Example: chicken burrito";
document.getElementById("results").innerHTML = "";
document.getElementById("successMessage").textContent = "";
}

async function searchFood() {
const query = document.getElementById("foodSearchInput").value.trim();
const results = document.getElementById("results");

if (!currentMode) {
results.innerHTML = "<p>Please choose Add Meal, Add Drink, or Add Calories first.</p>";
return;
}

if (currentMode === "meal" && !selectedMealType) {
results.innerHTML = "<p>Please choose Breakfast, Lunch, Dinner, or Snack first.</p>";
return;
}

if (!query) {
results.innerHTML = "<p>Please type a food or drink to search.</p>";
return;
}

results.innerHTML = "<p>Searching...</p>";

try {
const response = await fetch(`/api/search-food?query=${encodeURIComponent(query)}`);
const data = await response.json();

if (!data.foods || data.foods.length === 0) {
results.innerHTML = "<p>No results found.</p>";
return;
}

results.innerHTML = "";

data.foods.forEach(food => {
if (!food.calories && food.calories !== 0) return;

const calories = Math.round(food.calories);

const card = document.createElement("div");
card.className = "food-result";

card.innerHTML = `
<h3>${food.description}</h3>
<p>${food.brandName ? food.brandName : "USDA FoodData Central"}</p>
<p><strong>${calories} kcal</strong></p>
<button class="signin-btn add-food-btn">Add to ${selectedMealType || "Intake"}</button>
`;

card.querySelector("button").addEventListener("click", async event => {
event.target.disabled = true;
event.target.textContent = "Added ✅";
await addToIntake(food.description, calories, selectedMealType);
});

results.appendChild(card);
});

} catch (error) {
results.innerHTML = "<p>Search failed. Check your USDA API setup.</p>";
}
}

async function saveManualCalories() {
const name = document.getElementById("manualFoodName").value.trim();
const calories = Number(document.getElementById("manualCalories").value);
const category = document.getElementById("manualCategory").value;

if (!name) {
document.getElementById("successMessage").textContent = "Please enter a food or item name.";
return;
}

if (!calories || calories <= 0) {
document.getElementById("successMessage").textContent = "Please enter a valid calorie amount.";
return;
}

await addToIntake(name, Math.round(calories), category);

document.getElementById("manualFoodName").value = "";
document.getElementById("manualCalories").value = "";
}

async function addToIntake(name, calories, category) {
const user = await getCurrentUser();
const today = getTodayDate();

if (user) {
const { error } = await window.calbuddySupabase
.from("meals")
.insert({
user_id: user.id,
name: name,
calories: calories,
category: category,
nutrition_date: today
});

if (error) {
document.getElementById("successMessage").textContent =
"Meal saved on this device, but cloud save failed: " + error.message;
saveMealLocally(name, calories, category, today);
} else {
document.getElementById("successMessage").textContent =
`✅ Added to ${category}: ${name} — ${calories} kcal`;
}
} else {
saveMealLocally(name, calories, category, today);

document.getElementById("successMessage").textContent =
`✅ Added to ${category}: ${name} — ${calories} kcal`;
}

document.getElementById("foodSearchInput").value = "";
document.getElementById("results").innerHTML = "";

await renderTodayIntake();
}

function saveMealLocally(name, calories, category, date) {
const meals = JSON.parse(localStorage.getItem("calbuddyMeals") || "[]");

const meal = {
id: Date.now(),
name,
calories,
category,
date
};

meals.push(meal);

localStorage.setItem("calbuddyMeals", JSON.stringify(meals));
}

async function deleteIntakeItem(id, source) {
if (source === "supabase") {
const { error } = await window.calbuddySupabase
.from("meals")
.delete()
.eq("id", id);

if (error) {
document.getElementById("successMessage").textContent =
"Could not delete cloud meal: " + error.message;
return;
}
} else {
const meals = JSON.parse(localStorage.getItem("calbuddyMeals") || "[]");
const updatedMeals = meals.filter(meal => String(meal.id) !== String(id));
localStorage.setItem("calbuddyMeals", JSON.stringify(updatedMeals));
}

document.getElementById("successMessage").textContent =
"🗑️ Item removed. Calories updated.";

await renderTodayIntake();
}

async function getTodaysMeals() {
const user = await getCurrentUser();
const today = getTodayDate();

if (user) {
const { data, error } = await window.calbuddySupabase
.from("meals")
.select("*")
.eq("user_id", user.id)
.eq("nutrition_date", today)
.order("created_at", { ascending: true });

if (!error && data) {
return data.map(meal => ({
id: meal.id,
name: meal.name,
calories: meal.calories,
category: meal.category,
date: meal.nutrition_date,
source: "supabase"
}));
}
}

const meals = JSON.parse(localStorage.getItem("calbuddyMeals") || "[]");

return meals
.filter(meal => meal.date === today)
.map(meal => ({
...meal,
source: "local"
}));
}

async function renderTodayIntake() {
const itemsDiv = document.getElementById("todayIntakeItems");
const totalText = document.getElementById("totalConsumedText");
const meals = await getTodaysMeals();

if (meals.length === 0) {
itemsDiv.innerHTML = "<p>No meals logged yet today.</p>";
totalText.textContent = "0";
localStorage.setItem("calbuddyCaloriesConsumed", 0);
return;
}

itemsDiv.innerHTML = "";

meals.forEach(meal => {
const item = document.createElement("div");
item.className = "intake-item";

const label = document.createElement("span");
label.textContent = `${meal.category}: ${meal.name} — ${Math.round(meal.calories)} kcal`;

const deleteButton = document.createElement("button");
deleteButton.className = "delete-intake-btn";
deleteButton.textContent = "🗑️";
deleteButton.addEventListener("click", () => {
deleteIntakeItem(meal.id, meal.source);
});

item.appendChild(label);
item.appendChild(deleteButton);
itemsDiv.appendChild(item);
});

const total = meals.reduce((sum, item) => sum + Number(item.calories), 0);
totalText.textContent = total.toLocaleString();
localStorage.setItem("calbuddyCaloriesConsumed", total);
}

renderTodayIntake();
</script>
</body>
</html>
