  <script>
    function runAriOnce(message) {
      const analysis = window.Ari.core.analyzeMessage(message, {});

      let summary = window.Ari.core.createSystemSummary(analysis);

      summary.userMessage = message;
      summary.message = message;
      summary.input = message;
      summary.normalizedMessage = String(message || "").toLowerCase().trim();

      if (
        window.AriRebirthPipeline &&
        typeof window.AriRebirthPipeline.run === "function"
      ) {
        summary = window.AriRebirthPipeline.run(summary);
      }

      const languageRoute = window.Ari.languageRouter
        ? window.Ari.languageRouter.route(analysis)
        : "language-router-unavailable";

      const oldResponse = window.Ari.languageSystem.generate(analysis, {
        length: "normal"
      });

      const rebirthResponse =
        summary.finalResponse ||
        summary.synthesisRecommendedQuestion ||
        summary.salienceQuestion ||
        summary.recommendedRecoveryQuestion ||
        oldResponse;

      return {
        analysis,
        summary,
        languageRoute,
        oldResponse,
        rebirthResponse
      };
    }

    document.getElementById("ariAnalyzeBtn").addEventListener("click", () => {
      const output = document.getElementById("ariOutput");

      try {
        const message = document.getElementById("ariInput").value;

        if (!message.trim()) {
          output.textContent = "Enter a message first.";
          return;
        }

        const run = runAriOnce(message);
        const summary = run.summary;

        const primaryPriority =
          typeof summary.primaryPriority === "object"
            ? summary.primaryPriority?.name
            : summary.primaryPriority;

        const thingsToDelay = Array.isArray(summary.thingsToDelay)
          ? summary.thingsToDelay
              .map(item => typeof item === "string" ? item : item.name)
              .filter(Boolean)
              .join(", ")
          : "";

        output.textContent =
`===== OLD ARI RESPONSE =====

${run.oldResponse}

==================================================

===== ARI REBIRTH RESPONSE =====

${run.rebirthResponse}

==================================================

===== REBIRTH LEAD ORGAN =====

${summary.salienceLeadOrgan || "none"}

Mode:
${summary.salienceMode || "none"}

Life Chapter Strength:
${summary.lifeChapterStrength || 0}

Lead Identity:
${summary.resolvedLeadIdentity || summary.leadIdentity || "none"}

Lead Identity Score:
${summary.leadIdentityScore || 0}

Primary Life Chapter:
${summary.primaryLifeChapter || "none"}

Primary Human Need:
${summary.primaryHumanNeed || "none"}

Need Response Mode:
${summary.needResponseMode || "none"}

Uncertainty Type:
${summary.uncertaintyType || "none"}

Integrated Value:
${summary.integratedValue || "none"}

Value Integration:
${summary.valueIntegrationDetected ? "yes" : "no"}

Salience Lead Score:
${summary.salienceLeadScore || 0}

Organism Function:
${summary.organismPrimaryFunction || summary.organismFunction || "none"}

Organism Needs Stabilization:
${summary.organismNeedsStabilization ? "yes" : "no"}

Emotional Classification:
${summary.emotionalClassification || "none"}

==================================================

===== MOUTH DIRECTOR =====

Mouth Director Source:
${summary.mouthDirectorSource || "none"}

Mouth Pattern:
${summary.mouthResponsePattern || "none"}

Mouth Explanation:
${summary.mouthExplanationLevel || "none"}

Mouth Max Sections:
${summary.mouthMaxBodySections || "none"}

Ask Before Teaching:
${summary.mouthAskBeforeTeaching === true ? "yes" : summary.mouthAskBeforeTeaching === false ? "no" : "none"}

Allows Meaning:
${summary.mouthAllows?.meaning === true ? "yes" : summary.mouthAllows?.meaning === false ? "no" : "none"}

Allows Emotion:
${summary.mouthAllows?.emotion === true ? "yes" : summary.mouthAllows?.emotion === false ? "no" : "none"}

Allows Truth:
${summary.mouthAllows?.truth === true ? "yes" : summary.mouthAllows?.truth === false ? "no" : "none"}

Allows Wisdom:
${summary.mouthAllows?.wisdom === true ? "yes" : summary.mouthAllows?.wisdom === false ? "no" : "none"}

Allows Action:
${summary.mouthAllows?.action === true ? "yes" : summary.mouthAllows?.action === false ? "no" : "none"}

==================================================

===== OLD LANGUAGE ROUTE =====

${run.languageRoute}

Recommended Language Lead:
${summary.recommendedLanguageLead || run.analysis.signals?.recommendedLanguageLead || "none"}

Strongest Signal:
${summary.strongestSignal || run.analysis.signals?.strongestSignalName || "none"}

Strongest Signal Category:
${summary.strongestSignalCategory || run.analysis.signals?.strongestSignalCategory || "none"}

==================================================

===== EXECUTIVE DECISION =====

${summary.executiveDecision || "none"}

Primary Priority:
${primaryPriority || "none"}

Recommended Focus:
${summary.recommendedFocus || "none"}

Things To Delay:
${thingsToDelay || "none"}

==================================================

===== OBSERVER HIERARCHY =====

Primary Observation:
${summary.observerHierarchyPrimaryObservation || "none"}

Primary Category:
${summary.observerHierarchyPrimaryCategory || "none"}

Primary Reason:
${summary.observerHierarchyPrimaryReason || "none"}

Primary Confidence:
${summary.observerHierarchyPrimaryConfidence ?? "none"}

Dominant Tension:
${summary.observerHierarchyDominantTension || "none"}

Life Chapter:
${summary.observerHierarchyLifeChapter || "none"}

Objective Lead:
${summary.observerHierarchyObjectiveLead || "none"}

Subjective Lead:
${summary.observerHierarchySubjectiveLead || "none"}

Dual Salience Mode:
${summary.observerHierarchyDualSalienceMode || "none"}

Executive Instruction:
${summary.observerHierarchyExecutiveInstruction || "none"}

Should Ask Clarifying Question:
${summary.observerHierarchyShouldAskClarifyingQuestion === true ? "yes" : summary.observerHierarchyShouldAskClarifyingQuestion === false ? "no" : "none"}

Recommended Question:
${summary.observerHierarchyRecommendedQuestion || "none"}

==================================================

===== DUAL SALIENCE =====

Available:
${summary.dualSalienceAvailable === true ? "yes" : summary.dualSalienceAvailable === false ? "no" : "none"}

Lead:
${summary.dualSalienceLead || "none"}

Mode:
${summary.dualSalienceMode || "none"}

Objective Lead:
${summary.dualSalienceObjectiveLead || "none"}

Subjective Lead:
${summary.dualSalienceSubjectiveLead || "none"}

Reason:
${summary.dualSalienceReason || "none"}

Clarity Confidence:
${summary.dualSalienceClarityConfidence ?? "none"}

Clarity Action:
${summary.dualSalienceClarityAction || "none"}

Recommended Move:
${summary.dualSalienceRecommendedMove || "none"}

==================================================

===== REBIRTH PIPELINE CHECK =====

Pipeline Ran:
${summary.rebirthPipelineRan ? "yes" : "no"}

Pipeline Source:
${summary.rebirthPipelineSource || "none"}

Need Engine Ran:
${summary.needEngineRan ? "yes" : "no"}

Need Engine Source:
${summary.needEngineSource || "none"}

Mouth Director Ran:
${summary.mouthDirectorRan ? "yes" : "no"}

Mouth Director Source:
${summary.mouthDirectorSource || "none"}

Language Source:
${summary.source || "none"}

==================================================

===== LIFE CHAPTER =====

Primary Chapter:
${summary.primaryLifeChapter || "none"}

Strength:
${summary.lifeChapterStrength || 0}

Statement:
${summary.lifeChapterStatement || "none"}

Question:
${summary.lifeChapterQuestion || "none"}

==================================================

===== IDENTITY PRIORITY =====

Lead Identity:
${summary.leadIdentity || "none"}

Score:
${summary.leadIdentityScore || 0}

Leadership Mode:
${summary.identityLeadershipMode || "none"}

Summary:
${summary.identityPrioritySummary || "none"}

==================================================

===== VALUE INTEGRATION =====

Integrated Value:
${summary.integratedValue || "none"}

Conflict:
${summary.apparentConflict || "none"}

Statement:
${summary.integrationStatement || "none"}

Question:
${summary.valueIntegrationQuestion || "none"}

==================================================

===== SALIENCE GOVERNOR =====

Lead Organ:
${summary.salienceLeadOrgan || "none"}

Lead Score:
${summary.salienceLeadScore || 0}

Mode:
${summary.salienceMode || "none"}

Question:
${summary.salienceQuestion || "none"}

Reason:
${summary.salienceReason || "none"}

==================================================

===== REBIRTH SYSTEM SUMMARY =====

${JSON.stringify(summary, null, 2)}
`;
      } catch (error) {
        console.error("[ARI LAB ERROR]", error);

        output.textContent =
`===== ARI LAB ERROR =====

${error.message}

==================================================

${error.stack}
`;
      }
    });

    document.getElementById("ariDiagnosticBtn").addEventListener("click", () => {
      const output = document.getElementById("ariOutput");

      try {
        if (!window.Ari.readinessDiagnostic) {
          output.textContent = "Ari Readiness Diagnostic not loaded.";
          return;
        }

        const responseMap = {};
        const fullRuns = [];

        window.Ari.readinessDiagnostic.testCases.forEach((testCase) => {
          const run = runAriOnce(testCase.prompt);

          responseMap[testCase.id] = run.rebirthResponse;

          fullRuns.push({
            id: testCase.id,
            category: testCase.category,
            prompt: testCase.prompt,
            oldResponse: run.oldResponse,
            rebirthResponse: run.rebirthResponse,
            languageRoute: run.languageRoute,
            summary: run.summary
          });
        });

        const results = window.Ari.readinessDiagnostic.testCases.map((testCase) => {
          return window.Ari.readinessDiagnostic.analyzeResponse(
            testCase,
            responseMap[testCase.id]
          );
        });

        const grade = window.Ari.readinessDiagnostic.grade(results);

        output.textContent =
`===== ARI READINESS DIAGNOSTIC =====

Average Score:
${grade.averageScore}

Readiness:
${grade.readiness}

Recommendation:
${grade.recommendation}

==================================================

Weak Areas:
${JSON.stringify(grade.weakAreas, null, 2)}

==================================================

Full Results:
${JSON.stringify(results, null, 2)}

==================================================

Full Ari Runs:
${JSON.stringify(fullRuns, null, 2)}
`;

      } catch (error) {
        console.error("[ARI DIAGNOSTIC ERROR]", error);

        output.textContent =
`===== ARI DIAGNOSTIC ERROR =====

${error.message}

==================================================

${error.stack}
`;
      }
    });
  </script>
