<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ari Lab</title>
</head>

<body>
  <main style="max-width: 900px; margin: 40px auto; padding: 20px; font-family: system-ui;">
    <h1>Ari Lab</h1>
    <p>A clean test space for Ari Rebirth + Medical OS debugging.</p>

    <textarea
      id="ariInput"
      placeholder="Talk with Ari..."
      style="width: 100%; min-height: 120px; padding: 14px; font-size: 16px;"
    ></textarea>

    <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
      <button id="ariAnalyzeBtn" type="button" style="padding: 12px 18px; font-weight: 700;">
        Analyze with Ari
      </button>

      <button id="ariMedicalDebugBtn" type="button" style="padding: 12px 18px; font-weight: 700;">
        Medical OS Debug
      </button>

      <button id="ariClearBtn" type="button" style="padding: 12px 18px; font-weight: 700;">
        Clear Output
      </button>
    </div>

    <pre
      id="ariOutput"
      style="margin-top: 20px; padding: 16px; background: #111827; color: #d1fae5; white-space: pre-wrap; overflow: auto;"
    ></pre>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
<script src="calbuddy-core.js?v=3.6.4"></script>
<script src="ari/diagnostics/ari-execution-trace.js"></script>
<script src="ari/ari-rebirth-app-bridge.js"></script>

  <!-- Medical OS Core -->
  <script src="ari/medical/executive/ari-clinical-situation-room.js"></script>
  <script src="ari/medical/executive/ari-medical-audit-engine.js"></script>
  <script src="ari/medical/operations/ari-medical-action-registry.js"></script>
  <script src="ari/medical/operations/ari-medical-action-engine.js"></script>
  <script src="ari/medical/operations/ari-hospital-action-resolver.js"></script>
  <script src="ari/medical/operations/ari-hospital-operations-engine.js"></script>
  <script src="ari/medical/monitoring/ari-monitoring-registry.js"></script>
  <script src="ari/medical/monitoring/ari-monitoring-engine.js"></script>
  <script src="ari/medical/executive/ari-escalation-engine.js"></script>
  <script src="ari/medical/executive/ari-clinical-priority-engine.js"></script>
  <script src="ari/medical/executive/ari-clinical-executive-engine.js"></script>
  <script src="ari/medical/executive/ari-medical-why-engine.js"></script>
  <script src="ari/medical/executive/ari-medical-timeline-engine.js"></script>
  <script src="ari/medical/communication/ari-medical-communication-engine.js"></script>

  <!-- Infectious Disease -->
  <script src="ari/medical/infectious-disease/infection-control/ari-precaution-registry.js"></script>
  <script src="ari/medical/infectious-disease/infection-control/ari-id-infection-control-engine.js"></script>
  <script src="ari/medical/infectious-disease/infection-control/ari-reportable-disease-registry.js"></script>
  <script src="ari/medical/infectious-disease/infection-control/ari-reportable-disease-engine.js"></script>
  <script src="ari/medical/infectious-disease/infection-control/ari-post-exposure-prophylaxis-registry.js"></script>
  <script src="ari/medical/infectious-disease/infection-control/ari-exposure-management-engine.js"></script>
  <script src="ari/medical/infectious-disease/sti/ari-sti-registry.js"></script>
  <script src="ari/medical/infectious-disease/sti/ari-sti-reasoning-engine.js"></script>
  <script src="ari/medical/infectious-disease/antibiotics/ari-antibiotic-spectrum-registry.js"></script>
  <script src="ari/medical/infectious-disease/antibiotics/ari-culture-interpretation-engine.js"></script>
  <script src="ari/medical/infectious-disease/antibiotics/ari-antibiotic-selection-engine.js"></script>
  <script src="ari/medical/infectious-disease/ari-infectious-disease-orchestrator.js"></script>

  <!-- Medical OS Orchestrator + Test Harness -->
  <script src="ari/medical/core/ari-medical-os-orchestrator.js"></script>
  <script src="ari/medical/core/ari-medical-os-test-harness.js"></script>

  <script>
    const output = () => document.getElementById("ariOutput");

    function print(text) {
      output().textContent = text;
    }

    function section(title, body = "") {
      return [
        "",
        "==================================================",
        `===== ${title} =====`,
        "",
        body
      ].join("\n");
    }

    function firstObject(...values) {
      for (const value of values) {
        if (
          value &&
          typeof value === "object" &&
          !Array.isArray(value)
        ) {
          return value;
        }
      }

      return {};
    }

    function firstText(...values) {
      for (const value of values) {
        if (
          typeof value === "string" &&
          value.trim()
        ) {
          return value.trim();
        }
      }

      return "";
    }

    function getRuntimeSummary(result = {}) {
      return firstObject(
        result.summary,
        result.runtimeSummary,
        result.delivery?.summary,
        result.delivery?.runtimeSummary,
        result.diagnostics?.summary,
        result.diagnostics?.runtimeSummary
      );
    }

    async function runAriOnce(message, options = {}) {
  if (
    !window.CalBuddy ||
    typeof window.CalBuddy.askAri !== "function"
  ) {
    throw new Error(
      "CalBuddy.askAri is not loaded."
    );
  }

  const result =
    await window.CalBuddy.askAri({
      message,
      history:
        Array.isArray(options.history)
          ? options.history
          : [],
      debugTiming:
        options.debugTiming !== false
    });

  return {
    reply:
      firstText(
        result.reply,
        result.text,
        result.message,
        result.response,
        result.finalResponse
      ),

    emotion:
      firstText(
        result.emotion,
        result.finalEmotion
      ) || "idle",

    source:
      firstText(
        result.responseSource,
        result.source
      ) || "calbuddy-core",

    summary:
      getRuntimeSummary(result),

    analysis:
      firstObject(
        result.analysis
      ),

    raw:
      result
  };
}

    function formatTiming(summary = {}, raw = {}) {
      const pipelineTiming =
        Array.isArray(summary.pipelineTiming)
          ? summary.pipelineTiming
          : [];

      const bridgeTiming =
        Array.isArray(raw?.diagnostics?.timing)
          ? raw.diagnostics.timing
          : [];

      const lines = [];

      if (bridgeTiming.length) {
        lines.push("BRIDGE TIMING");

        lines.push(
          ...bridgeTiming.map(
            item => `${item.label}: ${item.ms}ms`
          )
        );
      }

      if (
        bridgeTiming.length &&
        pipelineTiming.length
      ) {
        lines.push("");
      }

      if (pipelineTiming.length) {
        lines.push("PIPELINE TIMING");

        lines.push(
          ...pipelineTiming.map(
            item => `${item.label}: ${item.ms}ms`
          )
        );
      }

      return lines.length
        ? lines.join("\n")
        : "No bridge or pipeline timing found.";
    }

    function formatFinalSummary(run = {}) {
      const summary = run.summary || {};
      const raw = run.raw || {};

      const bridgeDiagnostics = {
        ok: raw.ok === true,
        success: raw.success === true,
        complete: raw.complete === true,
        deliveryStatus: raw.deliveryStatus || null,
        bridgeVersion: raw.bridgeVersion || null,
        responseSource: raw.responseSource || null,
        source: raw.source || null,
        error: raw.error || null,
        diagnostics: raw.diagnostics || null
      };

      const finalResponseText =
        firstText(
          summary.finalResponse,
          summary.finalResponseText,
          summary.finalComposition?.text,
          summary.responseRealization?.text
        );

      const compactSummary = {
        request: {
          userMessage:
            summary.userMessage ||
            summary.turn?.originalText ||
            summary.turn?.text ||
            null,

          resolvedUserQuestion:
            summary.resolvedUserQuestion ||
            summary.resolvedQuestion ||
            null
        },

        lifecycle: {
          architecture:
            summary.pipelineArchitecture ||
            summary.architecture ||
            null,

          complete:
            summary.pipelineLifecycleComplete === true ||
            summary.complete === true,

          layers:
            summary.pipelineLayers ||
            summary.layers ||
            {},

          lifecycleErrors:
            summary.pipelineLifecycleErrors ||
            summary.lifecycleErrors ||
            []
        },

        perception: {
          ran:
            summary.perceptionPipelineRan === true ||
            summary.layers?.perception?.ran === true,

          observationCount:
            summary.observationCount ||
            summary.observations?.length ||
            0,

          primaryFunction:
            summary.conversationFunction?.primaryFunction ||
            null,

          conversationType:
            summary
              .universalConversationClassification
              ?.conversationType ||
            null,

          conversationIntent:
            summary
              .universalConversationClassification
              ?.conversationIntent ||
            null,

          semanticSummary:
            summary.semanticSummary ||
            summary.semanticFrame?.summary ||
            null
        },

        routing: {
          mode:
            summary.conversationMode ||
            null,

          primaryIntent:
            summary.primaryIntent ||
            null,

          domain:
            summary.conversationDomain ||
            null,

          contextLane:
            summary.contextLane ||
            summary.lane ||
            null,

          primaryLane:
            summary.primaryLane ||
            null,

          planner:
            summary.selectedPlanner ||
            null
        },

        deliberation: {
          ran:
            summary.deliberationPipelineRan === true ||
            summary.layers?.deliberation?.ran === true,

          resolvedQuestion:
            summary.resolvedUserQuestion ||
            summary.resolvedQuestion ||
            null,

          situation:
            summary.situationMap?.situations?.[0] ||
            null,

          triageLane:
            summary.triage?.primaryLane ||
            null,

          reasoningRan:
            summary.reasoningEngineRan === true,

          memoryRetrievalRan:
            summary.memoryRetrievalRan === true,

          responsePlannerRan:
            summary.responsePlannerRan === true
        },

        expression: {
          ran:
            summary.expressionPipelineRan === true ||
            summary.layers?.expression?.ran === true,

          characterStageRan:
            summary.characterStageRan === true ||
            summary.expressionStages?.character?.ran === true,

          languageGuidanceStageRan:
            summary.languageGuidanceStageRan === true ||
            summary.expressionStages?.languageGuidance?.ran === true,

          responseRealizationStageRan:
            summary.responseRealizationStageRan === true ||
            summary.expressionStages?.responseRealization?.ran === true,

          responseRealizationRan:
            summary.responseRealizationRan === true ||
            summary.responseRealization?.ran === true,

          realizationReady:
            summary.responseRealization?.ready === true ||
            summary.realizationReady === true,

          realizationUsable:
            summary.responseRealization?.usable === true ||
            summary.realizationUsable === true,

          realizationSource:
            summary.responseRealization?.source ||
            summary.realizationSource ||
            null,

          realizationText:
            summary.responseRealization?.text ||
            summary.realizationResponseText ||
            null,

          languageComposerRan:
            summary.languageComposerRan === true ||
            summary.responseRealization?.languageComposerRan === true,

          finalCompositionStageRan:
            summary.finalCompositionStageRan === true ||
            summary.expressionStages?.finalComposition?.ran === true,

          finalCompositionReady:
            summary.finalComposition?.ready === true ||
            summary.finalCompositionReady === true,

          finalCompositionSource:
            summary.finalComposition?.source ||
            summary.finalCompositionSource ||
            null
        },

        delivery: {
          ran:
            summary.deliveryPipelineRan === true ||
            summary.layers?.delivery?.ran === true,

          threadSaved:
            summary.threadSaveRan === true,

          conversationHistorySaved:
            summary.conversationHistorySaveRan === true,

          memorySaved:
            summary.memorySaveRan === true,

          healthy:
            summary.deliveryDiagnostics?.healthy === true,

          warnings:
            summary.deliveryDiagnostics?.warnings ||
            []
        },

        errors: {
          deliberation:
            summary.deliberationStageErrors ||
            [],

          expression:
            summary.expressionStageErrors ||
            [],

          delivery:
            summary.deliveryStageErrors ||
            []
        },

        finalResponse: {
          text:
            finalResponseText ||
            null,

          source:
            summary.finalResponseSource ||
            summary.finalComposition?.source ||
            null,

          usable:
            summary.finalResponseUsable !== false,

          length:
            finalResponseText.length
        }
      };

      return [
        "===== ARI REBIRTH APP RESPONSE =====",
        "",
        run.reply || "none",
        "",
        `Emotion:\n${run.emotion || "none"}`,
        "",
        `Source:\n${run.source || "none"}`,

        section(
          "BRIDGE DIAGNOSTICS",
          JSON.stringify(
            bridgeDiagnostics,
            null,
            2
          )
        ),

        section(
          "TIMING",
          formatTiming(
            summary,
            raw
          )
        ),

        section(
          "COMPACT PIPELINE SUMMARY",
          JSON.stringify(
            compactSummary,
            null,
            2
          )
        ),

        section(
          "RAW APP BRIDGE RESULT",
          JSON.stringify(
            raw,
            null,
            2
          )
        )
      ].join("\n");
    }

    function engineStatus() {
      const checks = [
        ["Situation Room", window.AriClinicalSituationRoom],
        ["Infectious Disease Orchestrator", window.AriInfectiousDiseaseOrchestrator],
        ["Medical OS Orchestrator", window.AriMedicalOSOrchestrator],
        ["Monitoring Engine", window.AriMonitoringEngine],
        ["Escalation Engine", window.AriEscalationEngine],
        ["Priority Engine", window.AriClinicalPriorityEngine],
        ["Hospital Operations Engine", window.AriHospitalOperationsEngine],
        ["Why Engine", window.AriMedicalWhyEngine],
        ["Communication Engine", window.AriMedicalCommunicationEngine],
        ["Test Harness", window.AriMedicalOSTestHarness]
      ];

      return checks.map(([name, object]) => ({
        name,
        loaded: Boolean(object),
        version: object?.version || "none"
      }));
    }

    function formatMedicalDebug(result = {}) {
      return [
        "===== ARI MEDICAL OS DEBUG =====",
        "",

        section(
          "ENGINE STATUS",
          JSON.stringify(engineStatus(), null, 2)
        ),

        section(
          "RESPONSE",
          result.response || "none"
        ),

        section(
          "EXECUTIVE SUMMARY",
          JSON.stringify(
            result.room?.executiveSummary || null,
            null,
            2
          )
        ),

        section(
          "OPERATIONS",
          JSON.stringify(
            result.operations || null,
            null,
            2
          )
        ),

        section(
          "MONITORING",
          JSON.stringify(
            result.monitoring || null,
            null,
            2
          )
        ),

        section(
          "WHY",
          JSON.stringify(
            result.why || null,
            null,
            2
          )
        ),

        section(
          "SITUATION ROOM",
          JSON.stringify(
            result.room || null,
            null,
            2
          )
        ),

        section(
          "FULL RESULT",
          JSON.stringify(
            result,
            null,
            2
          )
        )
      ].join("\n");
    }

    document
      .getElementById("ariAnalyzeBtn")
      .addEventListener("click", async event => {
        event.preventDefault();
        event.stopPropagation();

        const button = event.currentTarget;

        try {
          const message =
            document
              .getElementById("ariInput")
              .value
              .trim();

          if (!message) {
            print("Enter a message first.");
            return;
          }

          button.disabled = true;
          print("Loading Ari Rebirth...");

          const run =
            await runAriOnce(message);

          console.dir(
            run.raw,
            {
              depth: null
            }
          );

          print(
            formatFinalSummary(run)
          );
        } catch (error) {
          console.error(
            "[ARI LAB ERROR]",
            error
          );

          print(
            [
              "===== ARI LAB ERROR =====",
              "",
              error?.message ||
                String(error),
              "",
              error?.stack ||
                ""
            ].join("\n")
          );
        } finally {
          button.disabled = false;
        }
      });

    document
      .getElementById("ariMedicalDebugBtn")
      .addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();

        try {
          const message =
            document
              .getElementById("ariInput")
              .value
              .trim();

          if (!message) {
            print("Enter a medical scenario first.");
            return;
          }

          if (!window.AriMedicalOSOrchestrator?.run) {
            print("Ari Medical OS Orchestrator is not loaded.");
            return;
          }

          const result =
            window.AriMedicalOSOrchestrator.run({
              userMessage: message,
              chiefComplaint: message,

              context: {
                source:
                  "ari-lab-medical-debug",

                debugMode:
                  true
              }
            });

          print(
            formatMedicalDebug(result)
          );
        } catch (error) {
          console.error(
            "[ARI MEDICAL DEBUG ERROR]",
            error
          );

          print(
            [
              "===== ARI MEDICAL DEBUG ERROR =====",
              "",
              error?.message ||
                String(error),
              "",
              error?.stack ||
                ""
            ].join("\n")
          );
        }
      });

    document
      .getElementById("ariClearBtn")
      .addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        print("");
      });

    function showPriorAriLoadInterruption() {
      let loadingCompleted = null;
      let attemptedScript = null;
      let lastSuccessfulScript = null;
      let attemptedIndex = null;
      let lastSuccessfulIndex = null;
      let loadError = null;

      try {
        loadingCompleted =
          sessionStorage.getItem(
            "ariLoadingCompleted"
          );

        attemptedScript =
          sessionStorage.getItem(
            "ariLastLoadingScript"
          );

        lastSuccessfulScript =
          sessionStorage.getItem(
            "ariLastLoadedScript"
          );

        attemptedIndex =
          sessionStorage.getItem(
            "ariLastLoadingIndex"
          );

        lastSuccessfulIndex =
          sessionStorage.getItem(
            "ariLastLoadedIndex"
          );

        loadError =
          sessionStorage.getItem(
            "ariLastLoadError"
          );
      } catch {
        return;
      }

      if (
        loadingCompleted === "false" &&
        attemptedScript
      ) {
        print(
          [
            "===== ARI LOAD WAS INTERRUPTED =====",
            "",
            "Script being processed when the page reloaded:",
            attemptedScript,
            "",
            "Script index:",
            attemptedIndex || "unknown",
            "",
            "Last successful script:",
            lastSuccessfulScript || "none",
            "",
            "Last successful index:",
            lastSuccessfulIndex || "none",
            "",
            "Recorded load error:",
            loadError || "none"
          ].join("\n")
        );
      }
    }

    showPriorAriLoadInterruption();
  </script>
</body>
</html>
