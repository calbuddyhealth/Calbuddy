<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ari Lab</title>
</head>

<body>
  <main style="max-width: 760px; margin: 40px auto; padding: 20px; font-family: system-ui;">
    <h1>Ari Lab</h1>
    <p>A clean test space for Ari Rebirth. Scripts are loaded by the App Bridge, not manually duplicated here.</p>

    <textarea
      id="ariInput"
      placeholder="Talk with Ari..."
      style="width: 100%; min-height: 120px; padding: 14px; font-size: 16px;"
    ></textarea>

    <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
      <button id="ariAnalyzeBtn" style="padding: 12px 18px; font-weight: 700;">
        Analyze with Ari
      </button>

      <button id="ariDiagnosticBtn" style="padding: 12px 18px; font-weight: 700;">
        Run Readiness Diagnostic
      </button>

      <button id="ariIntegrationBtn" style="padding: 12px 18px; font-weight: 700;">
        Run Developer Layout Test
      </button>

      <button id="ariClearBtn" style="padding: 12px 18px; font-weight: 700;">
        Clear Output
      </button>
    </div>

    <pre
      id="ariOutput"
      style="margin-top: 20px; padding: 16px; background: #111827; color: #d1fae5; white-space: pre-wrap; overflow:auto;"
    ></pre>
  </main>

  <!-- Minimal Lab Loader -->
  <script src="calbuddy-core.js"></script>
  <script src="ari/ari-rebirth-app-bridge.js"></script>
  <script src="ari/testing/ari-readiness-diagnostic.js"></script>

  <script>
    const output = () => document.getElementById("ariOutput");

    function print(text) {
      output().textContent = text;
    }

    function section(title, body = "") {
      return [
        "",
        "==================================================",
        `===== ${title} =====`,
        "",
        body
      ].join("\n");
    }

    async function runAriOnce(message, options = {}) {
      if (
        !window.AriRebirthAppBridge ||
        typeof window.AriRebirthAppBridge.ask !== "function"
      ) {
        throw new Error("Ari Rebirth App Bridge is not loaded.");
      }

      const result = await window.AriRebirthAppBridge.ask(message, {
        source: "ari-lab",
        appMode: "rebirth-only",
        debugTiming: true,
        ownerMode: true,
        ariPermissions: {
          owner_access: true,
          suggest_code_changes: true,
          direct_code_editing: true,
          create_developer_tasks: true
        },
        githubFileContext: null,
        ...options
      });

      return {
        reply: result.reply,
        emotion: result.emotion,
        source: result.source || "ari-rebirth-app-bridge",
        summary: result.summary || {},
        analysis: result.analysis || {},
        raw: result
      };
    }

    function formatTiming(summary = {}) {
      if (!Array.isArray(summary.pipelineTiming)) {
        return "No pipeline timing found.";
      }

      return summary.pipelineTiming
        .map(item => `${item.label}: ${item.ms}ms`)
        .join("\n");
    }

    function formatCoreRouting(summary = {}) {
      return [
        `Safety: ${summary.safetyContextGateRan ? "ran" : "not run"}`,
        `Observer: ${summary.observerEvidenceRan ? "ran" : "not run"}`,
        `Conversation Function: ${summary.primaryFunction || "none"}`,
        `Classifier Type: ${summary.conversationType || "none"}`,
        `Semantic Intent: ${summary.semanticIntent || "none"}`,
        `Lane: ${summary.lane || "none"}`,
        `Triage Primary: ${summary.triagePrimaryLane || summary.triage?.primaryLane || "none"}`,
        `Contract Primary: ${summary.situationContractPrimary || summary.situationContract?.primary || "none"}`,
        `Response Shape: ${summary.responseShape || summary.situationContract?.responseShape || "none"}`
      ].join("\n");
    }

function formatCognitiveExecutive(summary = {}) {
  const ace = summary.cognitiveExecutive || {};

  return [
    `ACE Ran: ${summary.ariExecutiveRan ? "yes" : "no"}`,
    `ACE Version: ${summary.ariExecutiveVersion || "none"}`,
    `Authority: ${ace.authority || "none"}`,
    `Cognitive State: ${ace.cognitiveState || "none"}`,
    `Primary: ${ace.primary || "none"}`,
    `Activate: ${Array.isArray(ace.activate) ? ace.activate.join(", ") : "none"}`,
    `Requires: ${ace.requires ? JSON.stringify(ace.requires, null, 2) : "none"}`
  ].join("\n");
}

function formatKnowledgeRouter(summary = {}) {
  return [
    `Router Ran: ${summary.knowledgeRouterRan ? "yes" : "no"}`,
    `Router Version: ${summary.knowledgeRouterVersion || "none"}`,
    `Should Use Knowledge: ${summary.shouldUseKnowledge ? "yes" : "no"}`,
    `Provider: ${summary.knowledgeProvider || "none"}`,
    `Confidence: ${summary.knowledgeConfidence || "none"}`,
    `Reason: ${summary.knowledgeReason || "none"}`
  ].join("\n");
}

    function formatDeveloperLayer(summary = {}) {
      return [
        `Developer Layer Ran: ${summary.developerLayerRan ? "yes" : "no"}`,
        `Developer Intent: ${summary.developerIntent?.type || summary.developerIntent?.intent || "none"}`,
        `Developer Locked: ${summary.developerResponseLocked ? "yes" : "no"}`,
        `Response Locked: ${summary.responseLocked ? "yes" : "no"}`,
        `Code Evidence Ran: ${summary.codeEvidenceRan ? "yes" : "no"}`,
        `Patch Can Patch Now: ${summary.patchCanPatchNow === true ? "yes" : "no"}`,
        `Patch Reason: ${summary.patchDecisionReason || "none"}`,
        `GitHub Evidence Available: ${summary.githubEvidenceAvailable ? "yes" : "no"}`,
        `GitHub File: ${summary.githubEvidence?.filePath || "none"}`
      ].join("\n");
    }

    function formatComposer(summary = {}) {
      return [
        `Composer Packet Ready: ${summary.composerPacketReady || summary.composerPacket?.ready ? "yes" : "no"}`,
        `Composer Packet Primary: ${summary.composerPacket?.primary || summary.composerPacketPrimary || "none"}`,
        `AI Writer Ran: ${summary.aiWriterRan ? "yes" : "no"}`,
        `AI Writer Used AI: ${summary.aiWriterUsedAI ? "yes" : "no"}`,
        `AI Writer Source: ${summary.aiWriterSource || "none"}`,
        `Composer Version: ${summary.composerVersion || "none"}`,
        `Composer Source: ${summary.source || summary.composerSource || "none"}`,
        `Composer Validation: ${summary.composerValidation || "none"}`
      ].join("\n");
    }

    function formatFinalSummary(run = {}) {
      const summary = run.summary || {};

      return [
        "===== ARI REBIRTH APP RESPONSE =====",
        "",
        run.reply || "none",
        "",
        `Emotion:\n${run.emotion || "none"}`,
        "",
        `Source:\n${run.source || "none"}`,

        section("TIMING", formatTiming(summary)),
        section("CORE ROUTING", formatCoreRouting(summary)),
        section("COGNITIVE EXECUTIVE", formatCognitiveExecutive(summary)),
        section("KNOWLEDGE ROUTER", formatKnowledgeRouter(summary)),
        section("DEVELOPER LAYER", formatDeveloperLayer(summary)),
        section("COMPOSER", formatComposer(summary)),
        section("FINAL SUMMARY", JSON.stringify(summary, null, 2))
      ].join("\n");
    }

    async function runLayoutIntegrationTest() {
      const homepageContext = `
<section class="ari-action-grid three-actions">
  <a href="goals.html" class="ari-action-tile">My Goals</a>
  <a href="progress.html" class="ari-action-tile">Progress</a>
  <button class="ari-action-tile">Conversations</button>
</section>
`;

      const tests = [
        {
          id: "remove_conversations",
          prompt: "Remove the Conversations button from the homepage.",
          mustInclude: ["goals.html", "progress.html"],
          mustNotInclude: ["Conversations"]
        },
        {
          id: "rename_my_goals",
          prompt: "Rename My Goals to Goals.",
          mustInclude: ["Goals"],
          mustNotInclude: ["My Goals"]
        },
        {
          id: "change_bottom_tiles",
          prompt: "Change the homepage bottom tiles to Goals, Log Food, and Progress.",
          mustInclude: ["Goals", "Log Food", "Progress"],
          mustNotInclude: ["Conversations"]
        }
      ];

      const results = [];

      for (const test of tests) {
        const run = await runAriOnce(test.prompt, {
          appMode: "layout-integration-test",
          testMode: true,
          githubFileContext: {
            filePath: "index.html",
            content: homepageContext
          }
        });

        const proposedCode =
          run.raw?.proposedCode ||
          run.raw?.proposedHtml ||
          run.raw?.action?.proposedCode ||
          run.raw?.action?.proposedHtml ||
          run.summary?.proposedCode ||
          run.summary?.proposedHtml ||
          run.reply ||
          "";

        const missingRequired = test.mustInclude.filter(
          item => !proposedCode.includes(item)
        );

        const forbiddenFound = test.mustNotInclude.filter(
          item => proposedCode.includes(item)
        );

        results.push({
          id: test.id,
          prompt: test.prompt,
          passed: missingRequired.length === 0 && forbiddenFound.length === 0,
          missingRequired,
          forbiddenFound,
          reply: run.reply,
          proposedCode,
          developerIntent: run.summary?.developerIntent || null,
          developerLayerRan: run.summary?.developerLayerRan || false,
          patchCanPatchNow: run.summary?.patchCanPatchNow || false,
          timing: run.summary?.pipelineTiming || []
        });
      }

      return results;
    }

    document.getElementById("ariAnalyzeBtn").addEventListener("click", async () => {
      try {
        const message = document.getElementById("ariInput").value.trim();

        if (!message) {
          print("Enter a message first.");
          return;
        }

        const run = await runAriOnce(message);
        print(formatFinalSummary(run));
      } catch (error) {
        console.error("[ARI LAB ERROR]", error);
        print(`===== ARI LAB ERROR =====\n\n${error.message}\n\n${error.stack}`);
      }
    });

    document.getElementById("ariDiagnosticBtn").addEventListener("click", async () => {
      try {
        if (!window.Ari?.readinessDiagnostic) {
          print("Ari Readiness Diagnostic not loaded.");
          return;
        }

        const responseMap = {};
        const fullRuns = [];

        for (const testCase of window.Ari.readinessDiagnostic.testCases) {
          const run = await runAriOnce(testCase.prompt);
          responseMap[testCase.id] = run.reply;

          fullRuns.push({
            id: testCase.id,
            category: testCase.category,
            prompt: testCase.prompt,
            rebirthResponse: run.reply,
            emotion: run.emotion,
            source: run.source,
            timing: run.summary?.pipelineTiming || [],
            coreRouting: {
              primaryFunction: run.summary?.primaryFunction || null,
              conversationType: run.summary?.conversationType || null,
              semanticIntent: run.summary?.semanticIntent || null,
              lane: run.summary?.lane || null,
              contractPrimary:
                run.summary?.situationContractPrimary ||
                run.summary?.situationContract?.primary ||
                null
            },
            composer: {
              aiWriterRan: run.summary?.aiWriterRan || false,
              aiWriterUsedAI: run.summary?.aiWriterUsedAI || false,
              composerVersion: run.summary?.composerVersion || null,
              composerValidation: run.summary?.composerValidation || null
            },
            summary: run.summary
          });
        }

        const results = window.Ari.readinessDiagnostic.testCases.map(testCase => {
          return window.Ari.readinessDiagnostic.analyzeResponse(
            testCase,
            responseMap[testCase.id]
          );
        });

        const grade = window.Ari.readinessDiagnostic.grade(results);

        print(
          `===== ARI READINESS DIAGNOSTIC =====\n\n` +
          `Average Score:\n${grade.averageScore}\n\n` +
          `Readiness:\n${grade.readiness}\n\n` +
          `Recommendation:\n${grade.recommendation}\n\n` +
          section("WEAK AREAS", JSON.stringify(grade.weakAreas, null, 2)) +
          section("FULL RESULTS", JSON.stringify(results, null, 2)) +
          section("FULL ARI RUNS", JSON.stringify(fullRuns, null, 2))
        );
      } catch (error) {
        console.error("[ARI DIAGNOSTIC ERROR]", error);
        print(`===== ARI DIAGNOSTIC ERROR =====\n\n${error.message}\n\n${error.stack}`);
      }
    });

    document.getElementById("ariIntegrationBtn").addEventListener("click", async () => {
      try {
        const results = await runLayoutIntegrationTest();
        const passedCount = results.filter(result => result.passed).length;

        print(
          `===== ARI HOMEPAGE LAYOUT INTEGRATION TEST =====\n\n` +
          `Passed:\n${passedCount}/${results.length}\n\n` +
          JSON.stringify(results, null, 2)
        );
      } catch (error) {
        console.error("[ARI LAYOUT INTEGRATION ERROR]", error);
        print(`===== ARI LAYOUT INTEGRATION ERROR =====\n\n${error.message}\n\n${error.stack}`);
      }
    });

    document.getElementById("ariClearBtn").addEventListener("click", () => {
      print("");
    });
  </script>
</body>
</html>
