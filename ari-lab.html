<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ari Lab</title>
</head>

<body>
  <main style="max-width: 720px; margin: 40px auto; padding: 20px; font-family: system-ui;">
    <h1>Ari Lab</h1>
    <p>A standalone test space for Ari Rebirth.</p>

    <textarea
      id="ariInput"
      placeholder="Talk with Ari..."
      style="width: 100%; min-height: 120px; padding: 14px; font-size: 16px;"
    ></textarea>

    <button
      id="ariAnalyzeBtn"
      style="margin-top: 12px; padding: 12px 18px; font-weight: 700;"
    >
      Analyze with Ari
    </button>

    <pre
      id="ariOutput"
      style="margin-top: 20px; padding: 16px; background: #111827; color: #d1fae5; white-space: pre-wrap;"
    ></pre>
  </main>

  <!-- SYSTEM FOUNDATION -->
  <script src="ari/system/ari-loader.js"></script>
  <script src="ari/system/ari-authority.js"></script>

  <!-- OBSERVER -->
  <script src="ari/observer-system/ari-observer-network.js"></script>
  <script src="ari/observer-system/ari-question-understanding.js"></script>
  <script src="ari/observer-system/ari-life-signal-extractor.js"></script>

  <!-- ATTENTION / ROUTER -->
  <script src="ari/attention-system/ari-attention-system.js"></script>
  <script src="ari/brain/ari-router.js"></script>

  <!-- VALUES / IDENTITY / CONFLICT -->
  <script src="ari/value-system/ari-value-engine.js"></script>
  <script src="ari/identity-system/ari-identity-engine.js"></script>
  <script src="ari/conflict-system/ari-conflict-engine.js"></script>

  <!-- CONFIDENCE -->
  <script src="ari/confidence-system/ari-confidence-system.js"></script>
  <script src="ari/confidence-system/ari-confidence-calibration.js"></script>

  <!-- EXECUTIVE -->
  <script src="ari/executive-system/ari-executive-function.js"></script>

  <!-- EMOTION -->
  <script src="ari/heart/ari-emotion-engine.js"></script>
  <script src="ari/emotion-system/ari-emotional-intelligence.js"></script>
  <script src="ari/emotion-system/ari-underlying-emotion-engine.js"></script>
  <script src="ari/emotion-system/ari-emotion-recovery-questions.js"></script>

  <!-- MEANING / PERSON / BELIEF / SIMULATION -->
  <script src="ari/meaning-engine/ari-meaning-engine.js"></script>
  <script src="ari/person-model/ari-person-model.js"></script>
  <script src="ari/belief-system/ari-belief-engine.js"></script>
  <script src="ari/simulation-system/ari-simulation-engine.js"></script>

  <!-- EVIDENCE -->
  <script src="ari/evidence-system/ari-evidence-engine.js"></script>

  <!-- INSIGHT -->
  <script src="ari/insight-system/ari-insight-hypothesis-engine.js"></script>
  <script src="ari/insight-system/ari-counter-hypothesis-engine.js"></script>
  <script src="ari/insight-system/ari-insight-engine.js"></script>

  <!-- META AWARENESS -->
  <script src="ari/meta-awareness/ari-meta-awareness.js"></script>

  <!-- WISDOM -->
  <script src="ari/wisdom-system/ari-wisdom-library.js"></script>
  <script src="ari/wisdom-system/ari-wisdom-engine.js"></script>
  <script src="ari/wisdom-system/ari-wisdom-conflict-resolver.js"></script>
  <script src="ari/wisdom-system/ari-wisdom-question-recovery.js"></script>
  <script src="ari/wisdom-system/ari-regret-engine.js"></script>
  <script src="ari/wisdom-system/ari-long-term-consequence-engine.js"></script>
  <script src="ari/wisdom-system/ari-wisdom-synthesizer.js"></script>

  <!-- ARI SELF SYSTEM -->
  <script src="ari/self-system/ari-self-model.js"></script>
  <script src="ari/self-system/ari-self-values.js"></script>
  <script src="ari/self-system/ari-constitution.js"></script>
  <script src="ari/self-system/ari-self-reflection.js"></script>

  <!-- NERVOUS SYSTEM -->
  <script src="ari/nervous-system/ari-life-signal-weighting.js"></script>
  <script src="ari/nervous-system/ari-signal-system.js"></script>
  <script src="ari/nervous-system/ari-salience-network.js"></script>

  <!-- VOICE -->
  <script src="ari/voice-system/ari-voice-engine.js"></script>

  <!-- LANGUAGE SPINE -->
  <script src="ari/language-system/ari-language-helpers.js"></script>
  <script src="ari/language-system/ari-language-humanizers.js"></script>
  <script src="ari/language-system/ari-language-reflection-questions.js"></script>
  <script src="ari/language-system/ari-language-prioritizer.js"></script>
  <script src="ari/language-system/ari-language-router.js"></script>

  <!-- LANGUAGE BUILDERS -->
  <script src="ari/language-system/ari-language-insight-builder.js"></script>
  <script src="ari/language-system/ari-language-meaning-builder.js"></script>
  <script src="ari/language-system/ari-language-emotion-builder.js"></script>
  <script src="ari/language-system/ari-language-decision-builder.js"></script>
  <script src="ari/language-system/ari-language-planning-builder.js"></script>
  <script src="ari/language-system/ari-language-building-builder.js"></script>
  <script src="ari/language-system/ari-language-recovery-builder.js"></script>

  <!-- LANGUAGE COORDINATOR -->
  <script src="ari/language-system/ari-language-builder.js"></script>
  <script src="ari/language-system/ari-language-system.js"></script>

  <!-- ARI REBIRTH ORGANS -->
  <script src="ari/uncertainty/ari-uncertainty-classification-engine.js"></script>

  <script src="ari/identity/ari-identity-priority-engine.js"></script>
  <script src="ari/identity/ari-identity-conflict-resolver.js"></script>

  <script src="ari/values/ari-value-integration-engine.js"></script>

  <script src="ari/emotion/ari-stewardship-fear-differentiator.js"></script>

  <script src="ari/meaning/ari-life-chapter-engine.js"></script>

  <script src="ari/integration/ari-salience-governor.js"></script>
  <script src="ari/integration/ari-synthesis-engine.js"></script>

  <script src="ari/language/ari-language-composer.js"></script>
  <script src="ari/integration/ari-rebirth-pipeline.js"></script>

  <!-- MEMORY -->
  <script src="ari/memory-system/ari-memory-engine.js"></script>

  <!-- CORE SPINE -->
  <script src="ari/core-spine/ari-core-perception.js"></script>
  <script src="ari/core-spine/ari-core-cognition.js"></script>
  <script src="ari/core-spine/ari-core-reflection.js"></script>
  <script src="ari/core-spine/ari-core-expression.js"></script>
  <script src="ari/core-spine/ari-core-continuity.js"></script>
  <script src="ari/core-spine/ari-core-summary.js"></script>

  <!-- CORE COORDINATOR -->
  <script src="ari/system/ari-core.js"></script>
  <script src="ari/system/ari-prompt-builder.js"></script>
  <script src="ari/system/ari-bootstrap.js"></script>

  <script>
    document.getElementById("ariAnalyzeBtn").addEventListener("click", () => {
      const output = document.getElementById("ariOutput");

      try {
        const message = document.getElementById("ariInput").value;

        if (!message.trim()) {
          output.textContent = "Enter a message first.";
          return;
        }

        const analysis = window.Ari.core.analyzeMessage(message, {});

        let summary = window.Ari.core.createSystemSummary(analysis);

        if (window.AriRebirthPipeline && typeof window.AriRebirthPipeline.run === "function") {
          summary = window.AriRebirthPipeline.run(summary);
        }

        const languageRoute = window.Ari.languageRouter
          ? window.Ari.languageRouter.route(analysis)
          : "language-router-unavailable";

        const oldResponse = window.Ari.languageSystem.generate(analysis, {
          length: "normal"
        });

        const rebirthResponse =
          summary.finalResponse ||
          summary.synthesisRecommendedQuestion ||
          summary.salienceQuestion ||
          summary.recommendedRecoveryQuestion ||
          oldResponse;

        const primaryPriority =
          typeof summary.primaryPriority === "object"
            ? summary.primaryPriority?.name
            : summary.primaryPriority;

        const thingsToDelay = Array.isArray(summary.thingsToDelay)
          ? summary.thingsToDelay
              .map(item => typeof item === "string" ? item : item.name)
              .filter(Boolean)
              .join(", ")
          : "";

        output.textContent =
`===== OLD ARI RESPONSE =====

${oldResponse}

==================================================

===== ARI REBIRTH RESPONSE =====

${rebirthResponse}

==================================================

===== REBIRTH LEAD ORGAN =====

${summary.salienceLeadOrgan || "none"}

Mode:
${summary.salienceMode || "none"}

Lead Identity:
${summary.resolvedLeadIdentity || summary.leadIdentity || "none"}

Primary Life Chapter:
${summary.primaryLifeChapter || "none"}

Uncertainty Type:
${summary.uncertaintyType || "none"}

Integrated Value:
${summary.integratedValue || "none"}

Emotional Classification:
${summary.emotionalClassification || "none"}

==================================================

===== OLD LANGUAGE ROUTE =====

${languageRoute}

Recommended Language Lead:
${summary.recommendedLanguageLead || analysis.signals?.recommendedLanguageLead || "none"}

Strongest Signal:
${summary.strongestSignal || analysis.signals?.strongestSignalName || "none"}

Strongest Signal Category:
${summary.strongestSignalCategory || analysis.signals?.strongestSignalCategory || "none"}

==================================================

===== EXECUTIVE DECISION =====

${summary.executiveDecision || "none"}

Primary Priority:
${primaryPriority || "none"}

Recommended Focus:
${summary.recommendedFocus || "none"}

Things To Delay:
${thingsToDelay || "none"}

==================================================

===== REBIRTH PIPELINE CHECK =====

Pipeline Ran:
${summary.rebirthPipelineRan ? "yes" : "no"}

Pipeline Source:
${summary.rebirthPipelineSource || "none"}

Language Source:
${summary.source || "none"}

==================================================

===== REBIRTH SYSTEM SUMMARY =====

${JSON.stringify(summary, null, 2)}
`;
      } catch (error) {
        console.error("[ARI LAB ERROR]", error);

        output.textContent =
`===== ARI LAB ERROR =====

${error.message}

==================================================

${error.stack}
`;
      }
    });
  </script>
</body>
</html>
