<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f7f9ff;font-family:Arial,sans-serif;color:#101d49;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f9ff;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e9f5;border-radius:24px;padding:32px;">
            <tr><td align="center" style="font-size:12px;letter-spacing:3px;font-weight:700;color:#65739c;">ARTIFICIAL REASONING INTELLIGENCE</td></tr>
            <tr><td align="center" style="padding-top:10px;font-size:42px;font-weight:800;color:#101d49;">ARI <span style="color:#315ddd;">XP</span></td></tr>
            <tr><td align="center" style="padding-top:6px;font-size:12px;letter-spacing:4px;font-weight:700;color:#485a94;">EXPERIENCE</td></tr>
            <tr><td style="padding-top:30px;font-size:28px;font-weight:800;line-height:1.15;">Confirm your email</td></tr>
            <tr><td style="padding-top:12px;font-size:16px;line-height:1.6;color:#697394;">Confirm your email address to finish creating your ARI XP account.</td></tr>
            <tr>
              <td align="center" style="padding-top:24px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;min-width:220px;padding:16px 24px;border-radius:16px;background:#315ddd;color:#ffffff;text-decoration:none;font-size:16px;font-weight:800;">Confirm email address</a>
              </td>
            </tr>
            <tr><td align="center" style="padding-top:26px;font-size:13px;color:#8a93ad;">Button not working? Use this 6-digit code in ARI XP:</td></tr>
            <tr><td align="center" style="padding-top:8px;font-size:30px;letter-spacing:8px;font-weight:800;color:#101d49;">{{ .Token }}</td></tr>
            <tr><td align="center" style="padding-top:26px;font-size:12px;line-height:1.5;color:#9aa2b6;">If you did not create an ARI XP account, you can ignore this email.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
