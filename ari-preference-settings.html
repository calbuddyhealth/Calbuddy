<!-- Ari Preference Settings -->
<!-- V1.0.0 — Contract-Driven Preference Settings UI -->

<section
  id="ari-preference-settings"
  class="ari-preference-settings"
  aria-labelledby="ari-preference-settings-title"
>
  <header class="ari-preference-settings__header">
    <div>
      <p class="ari-preference-settings__eyebrow">ARI PERSONALIZATION</p>
      <h1 id="ari-preference-settings-title">Response Preferences</h1>
      <p class="ari-preference-settings__subtitle">
        Choose how Ari communicates, explains, supports, and challenges you.
        Changes apply after saving.
      </p>
    </div>

    <div
      id="ari-preference-status"
      class="ari-preference-settings__status"
      role="status"
      aria-live="polite"
    ></div>
  </header>

  <div
    id="ari-preference-loading"
    class="ari-preference-settings__loading"
  >
    Loading preferences…
  </div>

  <form
    id="ari-preference-form"
    class="ari-preference-settings__form"
    hidden
    novalidate
  >
    <section class="ari-preference-settings__preset-card">
      <div>
        <label for="ari-preference-preset">Preference preset</label>
        <p>Start with a preset, then customize individual settings.</p>
      </div>

      <select
        id="ari-preference-preset"
        name="activePreset"
      ></select>
    </section>

    <div
      id="ari-preference-categories"
      class="ari-preference-settings__categories"
    ></div>

    <div class="ari-preference-settings__actions">
      <button
        id="ari-preference-reset"
        class="ari-preference-button ari-preference-button--secondary"
        type="button"
      >
        Reset all
      </button>

      <button
        id="ari-preference-save"
        class="ari-preference-button ari-preference-button--primary"
        type="submit"
      >
        Save preferences
      </button>
    </div>
  </form>

  <dialog
    id="ari-preference-consent-dialog"
    class="ari-preference-consent-dialog"
  >
    <form method="dialog">
      <h2 id="ari-preference-consent-title">Confirm preference</h2>

      <p
        id="ari-preference-consent-text"
        class="ari-preference-consent-dialog__text"
      ></p>

      <label class="ari-preference-consent-dialog__check">
        <input
          id="ari-preference-consent-checkbox"
          type="checkbox"
        />
        <span>
          I understand this setting and explicitly consent to enabling it.
        </span>
      </label>

      <div class="ari-preference-consent-dialog__actions">
        <button
          id="ari-preference-consent-cancel"
          value="cancel"
          type="submit"
          class="ari-preference-button ari-preference-button--secondary"
        >
          Cancel
        </button>

        <button
          id="ari-preference-consent-confirm"
          value="confirm"
          type="submit"
          class="ari-preference-button ari-preference-button--primary"
          disabled
        >
          Confirm
        </button>
      </div>
    </form>
  </dialog>
</section>
