<!DOCTYPE html>
<html lang="en">
<head> 

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Vault | ARI Rebirth</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/base.css?v=16">
<link rel="stylesheet" href="assets/css/animations.css?v=16">
<link rel="stylesheet" href="assets/css/conversation-history.css?v=18">

</head>

<body>

<main class="ari-history-page" id="ariHistoryPage">

<header class="ari-history-header">

<button
class="ari-back-btn"
type="button"
onclick="goBack()">
←
</button>

<div class="ari-brand-mark">
<h1 class="ari-brand-title">ARI</h1>
<p class="ari-brand-subtitle">REBIRTH</p>
</div>

<button
class="ari-mini-btn"
type="button"
onclick="clearConversationHistory()">
Clear
</button>

</header>

<section class="ari-page-hero">
<p class="ari-page-kicker">Memory</p>
<h2 class="ari-page-title">Memory Vault</h2>

<p class="ari-page-description">
These are Ari's recent conversations.
Older conversations automatically expire after yesterday to keep the Memory Vault clean.
</p>
</section>

<section class="ari-history-panel">
<h3 class="ari-history-section-title">Today & Yesterday</h3>

<div id="conversationHistoryList">
<p class="window-note">Loading conversations...</p>
</div>
</section>

</main>

<script src="js/conversation-history.js"></script>

</body>
</html>
