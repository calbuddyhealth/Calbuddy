name: Temporary Conversation Dimension Fix

on:
  push:
    branches:
      - feature/ari-conversation-personalization-v2
    paths:
      - .github/workflows/temp-conversation-dimension-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ari-conversation-personalization-v2

      - name: Separate complexity from length
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('api/_lib/ari-vnext/conversation-personalization.js')
          text = path.read_text()
          old = r'''if (/\b(short answer|keep it short|keep (?:this|it) brief|be concise|concise answer|quick answer|simple answer|in simple terms|just the answer|just answer)\b/i.test(text))'''
          new = r'''if (/\b(short answer|keep it short|keep (?:this|it) brief|be concise|concise answer|quick answer|just the answer|just answer)\b/i.test(text))'''
          assert old in text, 'brief detail regex anchor missing'
          text = text.replace(old, new, 1)

          old = r'''if (/\b(simple terms|plain english|simpler|make it simple|less technical)\b/i.test(text))'''
          new = r'''if (/\b(simple terms|simple answer|plain english|simpler|make it simple|less technical)\b/i.test(text))'''
          assert old in text, 'simple complexity regex anchor missing'
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit dimension fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/ari-vnext/conversation-personalization.js
          git commit -m "Separate conversational complexity from answer length"
          git push origin HEAD:feature/ari-conversation-personalization-v2
