name: Apply persistent owner authority patch v4

on:
  push:
    branches:
      - agent/ari-persistent-owner-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ari-persistent-owner-authority
          fetch-depth: 1

      - name: Apply corrected semantic patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ari-persistent-owner-authority-patch-v3.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)

          old = "resolved = core.index('const resolvedVisualMode =', requested)"
          new = '''brace_start = core.index('{', requested)
          depth = 0
          resolved = None
          for index in range(brace_start, len(core)):
              char = core[index]
              if char == '{':
                  depth += 1
              elif char == '}':
                  depth -= 1
                  if depth == 0:
                      resolved = index + 1
                      while resolved < len(core) and core[resolved] in " \\t\\r\\n":
                          resolved += 1
                      break
          if resolved is None:
              raise SystemExit('owner visual auto-activation: closing brace missing')'''
          if old not in script:
              raise SystemExit('v3 patch source no longer contains expected visual boundary')
          script = script.replace(old, new, 1)
          exec(compile(script, '<persistent-owner-patch-v4>', 'exec'))
          PY

      - name: Verify focused owner-mode contract
        run: |
          node --check calbuddy-core.js
          node --test tests/ari-live-owner-session.test.mjs tests/ari-live-owner-vnext-routing.test.mjs

      - name: Commit patch and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ari-persistent-owner-authority-patch.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v2.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v3.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v4.yml
          git add calbuddy-core.js tests/ari-live-owner-session.test.mjs tests/ari-live-owner-vnext-routing.test.mjs
          git commit -m "Make verified owner authority persistent"
          git push origin HEAD:agent/ari-persistent-owner-authority
