name: Apply persistent owner authority patch v7

on:
  push:
    branches:
      - agent/ari-persistent-owner-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ari-persistent-owner-authority
          fetch-depth: 1

      - name: Apply corrected structural patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ari-persistent-owner-authority-patch-v6.yml').read_text()
          marker = "          python - <<'PY'\n"
          source_start = workflow.index(marker) + len(marker)
          source_end = workflow.index("\n          PY", source_start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[source_start:source_end].splitlines()
          )

          old = 'next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'next_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old not in script:
              raise SystemExit('literal test replacement hook missing')
          script = script.replace(old, new, 1)

          exec(compile(script, '<persistent-owner-patch-v7>', 'exec'))
          PY

      - name: Verify focused owner-mode contract
        run: |
          node --check calbuddy-core.js
          node --test tests/ari-live-owner-session.test.mjs tests/ari-live-owner-vnext-routing.test.mjs

      - name: Commit patch and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ari-persistent-owner-authority-patch.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v2.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v3.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v4.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v5.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v6.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v7.yml
          git add calbuddy-core.js tests/ari-live-owner-session.test.mjs tests/ari-live-owner-vnext-routing.test.mjs
          git commit -m "Make verified owner authority persistent"
          git push origin HEAD:agent/ari-persistent-owner-authority
