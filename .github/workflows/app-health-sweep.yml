name: ARI XP App Health Sweep

run-name: App Health ${{ inputs.mode }} sweep · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sweep depth
        required: true
        default: smart
        type: choice
        options:
          - smart
          - full
      base_sha:
        description: Previous App Health sweep commit for Smart Sweep change detection
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: app-health-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Smart Sweep
    runs-on: ubuntu-latest
    outputs:
      run_ari: ${{ steps.scope.outputs.run_ari }}
      run_ios: ${{ steps.scope.outputs.run_ios }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine affected systems
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ inputs.mode }}"
          BASE="${{ inputs.base_sha }}"
          HEAD="$GITHUB_SHA"
          RUN_ARI=false
          RUN_IOS=false

          if [ "$MODE" = "full" ]; then
            RUN_ARI=true
            RUN_IOS=true
          else
            if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$HEAD")"
            fi

            if [ "$BASE" = "$HEAD" ]; then
              CHANGED=""
            else
              CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
            fi

            printf 'Smart Sweep changes since %s:\n%s\n' "$BASE" "${CHANGED:-<none>}"

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              case "$file" in
                api/ari-vnext.js|api/_lib/ari-vnext/*|ari/vnext/*|ari/runtime/ari-runtime-controller.js|ari/intent/ari-central-intent-router.js|js/auth.js|js/nutrition-trust-layer.js|js/nutrition-transaction-client.js|js/ari-nutrition-data-quality.js|tests/ari-vnext-*.test.mjs|tests/nutrition-*.test.mjs|.github/workflows/ari-vnext-tests.yml)
                  RUN_ARI=true
                  ;;
                supabase/migrations/*nutrition*.sql)
                  RUN_ARI=true
                  ;;
              esac

              case "$file" in
                package.json|package-lock.json|capacitor.config.json|scripts/*|ios/*|assets/*|js/*)
                  RUN_IOS=true
                  ;;
                *)
                  if [[ "$file" != */* ]] && [[ "$file" == *.html || "$file" == *.js || "$file" == *.css || "$file" == *.json ]]; then
                    RUN_IOS=true
                  fi
                  ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "run_ari=$RUN_ARI" >> "$GITHUB_OUTPUT"
          echo "run_ios=$RUN_IOS" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Plan: readiness=true ari=$RUN_ARI ios=$RUN_IOS"

  readiness:
    name: ARI XP Readiness
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run ARI XP Node tests
        run: node --test tests/*.test.mjs

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local ARI XP server
        run: |
          python3 -m http.server 4173 > /tmp/arixp-http.log 2>&1 &
          echo $! > /tmp/arixp-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/signin.html > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/arixp-http.log
          exit 1

      - name: Run App Store browser smoke tests
        env:
          ARI_SMOKE_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          tests/app-store-smoke.spec.mjs
          tests/build5-review-surfaces.spec.mjs
          tests/ari-training-live.spec.mjs
          tests/ari-circle-menu-live.spec.mjs
          tests/nutrition-startup-live.spec.mjs
          --grep-invert "review-critical public and Circle surfaces render expected controls"
          --reporter=line

  ari-trust:
    name: Ari + Nutrition Trust
    needs: plan
    if: needs.plan.outputs.run_ari == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Ari and nutrition deterministic tests
        run: node --test tests/ari-vnext-*.test.mjs tests/nutrition-*.test.mjs

  ios:
    name: iOS Native Validation
    needs: plan
    if: needs.plan.outputs.run_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify App Store toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: ${SDK_VERSION}"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "App Store Connect requires the iOS 26 SDK or later."
            exit 1
          fi

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync current Safari source into iOS and prove parity
        run: |
          npm run ios:sync
          npm run cap:doctor

      - name: Verify Build 7 configuration and privacy purpose strings
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"

          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"

          SETTINGS="$(xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -showBuildSettings)"
          echo "$SETTINGS" | grep -q "CURRENT_PROJECT_VERSION = 7"
          echo "$SETTINGS" | grep -q "MARKETING_VERSION = 1.0"
          echo "$SETTINGS" | grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.arixp.app"

      - name: Validate iOS simulator build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate App Store release build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  summary:
    name: Sweep Summary
    if: always()
    needs:
      - plan
      - readiness
      - ari-trust
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Verify required results
        shell: bash
        run: |
          set -euo pipefail
          echo "Plan: ${{ needs.plan.result }}"
          echo "Readiness: ${{ needs.readiness.result }}"
          echo "Ari + Nutrition: ${{ needs.ari-trust.result }}"
          echo "iOS: ${{ needs.ios.result }}"

          if [ "${{ needs.plan.result }}" != "success" ] || [ "${{ needs.readiness.result }}" != "success" ]; then
            exit 1
          fi

          for result in "${{ needs.ari-trust.result }}" "${{ needs.ios.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
