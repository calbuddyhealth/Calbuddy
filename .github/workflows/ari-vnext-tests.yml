name: ARI vNext and nutrition trust tests

on:
  push:
    branches:
      - main
      - integration/ari-maintainability
      - agent/ari-vnext-intelligence
      - agent/ari-owner-advanced-controls
      - agent/ari-trust-layer-p0
      - feature/ari-circle-mission-v2
      - feature/ari-circle-places-explore
      - feature/ari-circle-mission-actions
      - feature/ari-circle-match-v2
      - feature/ari-circle-events-v1
      - feature/ari-circle-event-awareness
      - feature/ari-circle-event-initiative
      - feature/ari-circle-crews-v1
      - feature/ari-circle-crew-awareness
      - feature/ari-circle-crew-actions
      - feature/ari-circle-crew-initiative
      - feature/ari-circle-v6-experience
      - feature/ari-circle-v6-commit
    paths:
      - "api/ari-vnext.js"
      - "api/ari-vnext-circle-context.js"
      - "api/ari-vnext-initiative.js"
      - "api/_lib/ari-vnext/**"
      - "ari/vnext/**"
      - "ari/runtime/ari-runtime-controller.js"
      - "ari/intent/ari-central-intent-router.js"
      - "ari/personalization/**"
      - "ari/pipeline-stages/deliberation/ari-memory-stage.js"
      - "home.html"
      - "ari-circle-v6.html"
      - "assets/css/ari-circle-v6-experience.css"
      - "assets/css/ari-circle-v6-commit.css"
      - "js/ari-circle/v6/**"
      - "js/home-resilience.js"
      - "js/auth.js"
      - "js/ari-latency-hotfix.js"
      - "js/home-conversation-persistence.js"
      - "js/nutrition-trust-layer.js"
      - "js/nutrition-transaction-client.js"
      - "js/ari-nutrition-data-quality.js"
      - "supabase/migrations/*nutrition*.sql"
      - "supabase/migrations/*continuity*.sql"
      - "supabase/migrations/*action_network*.sql"
      - "supabase/migrations/*mission_v2*.sql"
      - "supabase/migrations/*places*.sql"
      - "supabase/migrations/*mission_places*.sql"
      - "supabase/migrations/*domain_events*.sql"
      - "supabase/migrations/*crews*.sql"
      - "tests/ari-vnext-*.test.mjs"
      - "tests/ari-circle-action-network-*.test.mjs"
      - "tests/ari-personalization.test.mjs"
      - "tests/nutrition-*.test.mjs"
      - ".github/workflows/ari-vnext-tests.yml"
  pull_request:
    branches:
      - main
      - feature/ari-next-owner-beta-lifecycle
      - feature/ari-circle-action-network
      - feature/ari-circle-mission-v2
      - feature/ari-circle-places-explore
      - feature/ari-circle-mission-actions
      - feature/ari-circle-match-v2
      - feature/ari-circle-events-v1
      - feature/ari-circle-event-awareness
      - feature/ari-circle-event-initiative
      - feature/ari-circle-crews-v1
      - feature/ari-circle-crew-awareness
      - feature/ari-circle-crew-actions
      - feature/ari-circle-crew-initiative
      - feature/ari-circle-v6-experience
    paths:
      - "api/ari-vnext.js"
      - "api/ari-vnext-circle-context.js"
      - "api/ari-vnext-initiative.js"
      - "api/_lib/ari-vnext/**"
      - "ari/vnext/**"
      - "ari/runtime/ari-runtime-controller.js"
      - "ari/intent/ari-central-intent-router.js"
      - "ari/personalization/**"
      - "ari/pipeline-stages/deliberation/ari-memory-stage.js"
      - "home.html"
      - "ari-circle-v6.html"
      - "assets/css/ari-circle-v6-experience.css"
      - "assets/css/ari-circle-v6-commit.css"
      - "js/ari-circle/v6/**"
      - "js/home-resilience.js"
      - "js/auth.js"
      - "js/ari-latency-hotfix.js"
      - "js/home-conversation-persistence.js"
      - "js/nutrition-trust-layer.js"
      - "js/nutrition-transaction-client.js"
      - "js/ari-nutrition-data-quality.js"
      - "supabase/migrations/*nutrition*.sql"
      - "supabase/migrations/*continuity*.sql"
      - "supabase/migrations/*action_network*.sql"
      - "supabase/migrations/*mission_v2*.sql"
      - "supabase/migrations/*places*.sql"
      - "supabase/migrations/*mission_places*.sql"
      - "supabase/migrations/*domain_events*.sql"
      - "supabase/migrations/*crews*.sql"
      - "tests/ari-vnext-*.test.mjs"
      - "tests/ari-circle-action-network-*.test.mjs"
      - "tests/ari-personalization.test.mjs"
      - "tests/nutrition-*.test.mjs"
      - ".github/workflows/ari-vnext-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Ari vNext, Action Network, personalization, and nutrition trust deterministic tests
        run: node --test tests/ari-vnext-*.test.mjs tests/ari-circle-action-network-*.test.mjs tests/ari-personalization.test.mjs tests/nutrition-*.test.mjs
