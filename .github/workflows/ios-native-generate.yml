name: ARI XP iOS native validation

on:
  push:
    branches:
      - Ari-rebirth-experiment
    paths:
      - .github/workflows/ios-native-generate.yml
      - package.json
      - package-lock.json
      - capacitor.config.json
      - ios/**
      - www/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ios-native-generate.yml
      - package.json
      - package-lock.json
      - capacitor.config.json
      - ios/**
      - www/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ios:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync iOS project
        run: |
          npm run ios:sync
          npm run cap:doctor

      - name: Verify ARI XP iOS privacy purpose strings
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"

          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"

      - name: Validate iOS simulator build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
