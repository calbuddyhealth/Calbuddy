name: ARI XP iOS native validation

on:
  push:
    branches:
      - main
      - Ari-rebirth-experiment
    paths:
      - .github/workflows/ios-native-generate.yml
      - package.json
      - package-lock.json
      - capacitor.config.json
      - scripts/**
      - ios/**
      - assets/**
      - js/**
      - ari/**
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.json"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ios-native-generate.yml
      - package.json
      - package-lock.json
      - capacitor.config.json
      - scripts/**
      - ios/**
      - assets/**
      - js/**
      - ari/**
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ios:
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify App Store toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: ${SDK_VERSION}"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "${SDK_MAJOR}" -lt 26 ]; then
            echo "App Store Connect requires the iOS 26 SDK or later."
            exit 1
          fi

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync current Safari source into iOS and prove parity
        run: |
          npm run ios:sync
          npm run cap:doctor

      - name: Verify Build 7 configuration, push capability, and privacy purpose strings
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          ENTITLEMENTS="ios/App/App/App.entitlements"

          test -f "$PLIST"
          test -f "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENTITLEMENTS" | grep -q 'ARI_APS_ENVIRONMENT'

          SETTINGS="$(xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -showBuildSettings)"
          echo "$SETTINGS" | grep -q "CURRENT_PROJECT_VERSION = 7"
          echo "$SETTINGS" | grep -q "MARKETING_VERSION = 1.0"
          echo "$SETTINGS" | grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.arixp.app"
          echo "$SETTINGS" | grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements"
          echo "$SETTINGS" | grep -q "ARI_APS_ENVIRONMENT = production"
          grep -q "com.apple.Push" ios/App/App.xcodeproj/project.pbxproj
          grep -q "native-push-runtime.js?v=1.0.0" www/home.html
          grep -q "native-push-runtime.js?v=1.0.0" www/ari-circle-v6.html

      - name: Validate iOS simulator build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate App Store release build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
