name: Temporary ARI adaptive investigation patch

on:
  push:
    branches:
      - agent/ari-live-adaptive-investigation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore orchestrator from main and apply surgical patch
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- api/_lib/ari-vnext/orchestrator.js
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(source, label, find, replacement) {
            const first = source.indexOf(find);
            const second = first < 0 ? -1 : source.indexOf(find, first + find.length);
            if (first < 0 || second >= 0) {
              throw new Error(`${label}: expected exactly one match; first=${first} second=${second}`);
            }
            return source.slice(0, first) + replacement + source.slice(first + find.length);
          }

          const orchestratorPath = 'api/_lib/ari-vnext/orchestrator.js';
          let source = fs.readFileSync(orchestratorPath, 'utf8');

          source = replaceOnce(
            source,
            'imports',
            `import {\n  DEVELOPER_STEP_LIMIT,\n  createDeveloperCheckpoint,\n  developerCheckpointNextStep,\n  developerPauseReply,\n  developerResumeCheckpoint\n} from "./developer-checkpoint.js";`,
            `import {\n  createDeveloperCheckpoint,\n  developerCheckpointNextStep,\n  developerPauseReply,\n  developerResumeCheckpoint\n} from "./developer-checkpoint.js";\nimport {\n  developerTaskBudgetDecision,\n  developerTaskBudgetInstruction,\n  recordDeveloperInitialModelCall,\n  recordDeveloperTaskStep,\n  startDeveloperTaskController\n} from "./developer-task-controller.js";`
          );

          source = replaceOnce(
            source,
            'controller initialization',
            `  const verifiedReads = new Map();\n  const resumedCheckpoint = developerResumeCheckpoint(turn);`,
            `  const verifiedReads = new Map();\n  const resumedCheckpoint = developerResumeCheckpoint(turn);\n  let taskController = startDeveloperTaskController(\n    resumedCheckpoint?.taskController || null,\n    { limits: { maxModelCalls: 25 } }\n  );\n  if (!resumedCheckpoint) taskController = recordDeveloperInitialModelCall(taskController, first);`
          );

          source = replaceOnce(
            source,
            'adaptive loop',
            `  for (let step = 0; step < DEVELOPER_STEP_LIMIT; step += 1) {`,
            `  let step = 0;\n  while (developerTaskBudgetDecision(taskController).continue) {\n    const stepStartedAt = Date.now();`
          );

          source = replaceOnce(
            source,
            'budget instruction',
            `      instructions: instructions + "\\n" + cognitiveSignalDecisionToInstruction(metacognition.executivePolicy?.directives) + "\\nOWNER DEVELOPER EXECUTION WORKSPACE\\nThe preceding function output is observed repository/CI/memory/cognitive-trace/mailbox evidence.`,
            `      instructions: instructions + "\\n" + cognitiveSignalDecisionToInstruction(metacognition.executivePolicy?.directives) + "\\n" + developerTaskBudgetInstruction(taskController) + "\\nOWNER DEVELOPER EXECUTION WORKSPACE\\nThe preceding function output is observed repository/CI/memory/cognitive-trace/mailbox evidence. Prefer one broad repository search followed by targeted exact reads. Avoid repeating an unchanged read or search when it cannot add evidence.`
          );

          source = replaceOnce(
            source,
            'record adaptive step',
            `      tools: developerTools\n    });\n    call = findFunctionCall(response?.output);`,
            `      tools: developerTools\n    });\n    taskController = recordDeveloperTaskStep(taskController, {\n      response,\n      evidence: observed,\n      runtimeMs: Date.now() - stepStartedAt\n    });\n    step += 1;\n    call = findFunctionCall(response?.output);`
          );

          source = replaceOnce(
            source,
            'adaptive checkpoint',
            `  const checkpoint = createDeveloperCheckpoint({ checked, reads: [...verifiedReads.values()], previous: resumedCheckpoint });`,
            `  const budgetDecision = developerTaskBudgetDecision(taskController);\n  const checkpoint = createDeveloperCheckpoint({\n    checked,\n    reads: [...verifiedReads.values()],\n    previous: resumedCheckpoint,\n    completedSteps: taskController.window.steps,\n    taskController\n  });`
          );

          source = replaceOnce(
            source,
            'pause reply',
            `    reply: developerPauseReply({ evidence, checkpoint }),`,
            `    reply: developerPauseReply({ evidence, checkpoint, budgetDecision }),`
          );

          source = replaceOnce(
            source,
            'pause source',
            `    source: "ari_vnext_owner_developer_step_limit"`,
            `    developerInvestigation: { paused: true, budgetDecision },\n    source: "ari_vnext_owner_developer_budget_pause"`
          );

          fs.writeFileSync(orchestratorPath, source);

          const checkpointTestPath = 'tests/ari-vnext-developer-checkpoint.test.mjs';
          let checkpointTest = fs.readFileSync(checkpointTestPath, 'utf8');
          checkpointTest = replaceOnce(
            checkpointTest,
            'mock request ceiling',
            `    assert.ok(requests.length <= 7, "investigation must stay bounded");`,
            `    assert.ok(requests.length <= 26, "adaptive investigation must retain a hard safety ceiling");`
          );
          checkpointTest = replaceOnce(
            checkpointTest,
            'adaptive test title',
            `test("six-step exhaustion checkpoints the exact unexecuted read and exposes collected evidence", async t => {`,
            `test("productive developer investigation continues beyond six and checkpoints at the adaptive safety ceiling", async t => {`
          );
          checkpointTest = replaceOnce(checkpointTest, 'read count', `  assert.equal(reads.length, 6);`, `  assert.equal(reads.length, 24);`);
          checkpointTest = replaceOnce(checkpointTest, 'request count', `  assert.equal(requests.length, 7);`, `  assert.equal(requests.length, 25);`);
          checkpointTest = replaceOnce(
            checkpointTest,
            'adaptive pause source assertion',
            `  assert.equal(result.source, "ari_vnext_owner_developer_step_limit");`,
            `  assert.equal(result.source, "ari_vnext_owner_developer_budget_pause");`
          );
          checkpointTest = replaceOnce(
            checkpointTest,
            'next operation at adaptive ceiling',
            `  assert.deepEqual(state.nextOperation, { name: "owner_repo_read", arguments: readArgs("api/file-7.js") });`,
            `  assert.deepEqual(state.nextOperation, { name: "owner_repo_read", arguments: readArgs("api/file-25.js") });`
          );
          checkpointTest = replaceOnce(
            checkpointTest,
            'checkpoint evidence window',
            `  assert.equal(state.inspectedFiles.length, 6);`,
            `  assert.equal(state.inspectedFiles.length, 12);\n  assert.equal(state.taskController.window.steps, 24);\n  assert.equal(state.taskController.window.modelCalls, 25);\n  assert.equal(state.taskController.lastDecision.reason, "step_cap");`
          );
          checkpointTest = replaceOnce(checkpointTest, 'last evidence reply', `  assert.match(result.reply, /Read api\\/file-6.js/);`, `  assert.match(result.reply, /Read api\\/file-24.js/);`);
          checkpointTest = replaceOnce(checkpointTest, 'next evidence reply', `  assert.match(result.reply, /Next: Read api\\/file-7.js/);`, `  assert.match(result.reply, /Next: Read api\\/file-25.js/);`);
          checkpointTest = replaceOnce(
            checkpointTest,
            'insert stall regression',
            `test("continue resumes the exact read without chat history and notices changed source", async t => {`,
            `test("adaptive investigation pauses after repeated evidence stops adding information", async t => {\n  const { reads, requests } = mockRuntime(t, count => [{\n    type: "function_call", name: "owner_repo_read", call_id: "stall-" + count,\n    arguments: JSON.stringify(readArgs("api/stall-" + Math.min(count, 6) + ".js"))\n  }]);\n  const result = await runAriVNext(turn({ turnId: "checkpoint-stall" }));\n  assert.equal(reads.length, 9);\n  assert.equal(requests.length, 10);\n  assert.equal(result.source, "ari_vnext_owner_developer_budget_pause");\n  assert.equal(result.developerInvestigation.budgetDecision.reason, "evidence_stalled");\n  assert.equal(result.executionWorkspaceUpdate.developerCheckpoint.taskController.window.steps, 9);\n  assert.match(result.reply, /stopped producing new evidence/);\n});\n\ntest("continue resumes the exact read without chat history and notices changed source", async t => {`
          );
          checkpointTest = replaceOnce(
            checkpointTest,
            'new source in persistence truth test',
            `  const result = { source: "ari_vnext_owner_developer_step_limit", executionWorkspaceUpdate: { developerCheckpoint: state } };`,
            `  const result = { source: "ari_vnext_owner_developer_budget_pause", executionWorkspaceUpdate: { developerCheckpoint: state } };`
          );
          fs.writeFileSync(checkpointTestPath, checkpointTest);

          const authTestPath = 'tests/ari-owner-auth.test.mjs';
          let authTest = fs.readFileSync(authTestPath, 'utf8');
          authTest = replaceOnce(
            authTest,
            'code task handler import',
            `import editHandler from "../api/ari-github-edit.js";\nimport readHandler from "../api/ari-github-read.js";`,
            `import editHandler from "../api/ari-github-edit.js";\nimport readHandler from "../api/ari-github-read.js";\nimport codeTaskHandler from "../api/ari-code-task.js";`
          );
          authTest = replaceOnce(
            authTest,
            'auth reviewed API files',
            `  const apiFiles = [\n    "api/ari-github-read.js",\n    "api/ari-github-edit.js"\n  ];`,
            `  const apiFiles = [\n    "api/ari-github-read.js",\n    "api/ari-github-edit.js",\n    "api/ari-code-task.js"\n  ];`
          );
          authTest = replaceOnce(authTest, 'forged handler coverage', `  for (const handler of [readHandler, editHandler]) {`, `  for (const handler of [readHandler, editHandler, codeTaskHandler]) {`);
          authTest = replaceOnce(authTest, 'reviewed code task endpoint', `    "ari-community-cycle.js",`, `    "ari-community-cycle.js",\n    "ari-code-task.js",`);
          authTest = replaceOnce(
            authTest,
            'explicit code task assertion',
            `  assert.equal(names.has("ari-owner-intelligence-controls.js"), true, "owner intelligence controls must remain explicit server API surface");`,
            `  assert.equal(names.has("ari-owner-intelligence-controls.js"), true, "owner intelligence controls must remain explicit server API surface");\n  assert.equal(names.has("ari-code-task.js"), true, "owner durable code-task execution must remain explicit reviewed server API surface");`
          );
          fs.writeFileSync(authTestPath, authTest);
          NODE

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/ari-vnext/orchestrator.js tests/ari-vnext-developer-checkpoint.test.mjs tests/ari-owner-auth.test.mjs
          git commit -m "Wire adaptive budget into live developer loop"
          git push origin HEAD:agent/ari-live-adaptive-investigation
