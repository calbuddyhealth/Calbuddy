name: ARI XP readiness tests

on:
  pull_request:
    branches:
      - Ari-rebirth-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run ARI XP tests
        run: node --test tests/*.test.mjs
