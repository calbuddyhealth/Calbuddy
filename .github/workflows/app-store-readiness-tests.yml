name: ARI XP readiness tests

on:
  push:
    branches:
      - main
      - "agent/ari-*"
      - Ari-rebirth-experiment
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run ARI XP Node tests
        shell: bash
        run: |
          set +e
          node --test --test-reporter=spec tests/*.test.mjs 2>&1 | tee /tmp/ari-node-tests.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "exit_code=${status}"
            grep -E "(^|[[:space:]])(not ok|fail|failed|failure|Error|AssertionError|ERR_|✖)" /tmp/ari-node-tests.log | tail -n 160 || true
          } > /tmp/ari-node-test-failures.txt
          {
            echo "### ARI XP Node test diagnostics"
            echo
            echo "Exit code: ${status}"
            echo
            echo '```text'
            cat /tmp/ari-node-test-failures.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload Node test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ari-node-test-diagnostics
          path: |
            /tmp/ari-node-test-failures.txt
            /tmp/ari-node-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local ARI XP server
        run: |
          python3 -m http.server 4173 > /tmp/arixp-http.log 2>&1 &
          echo $! > /tmp/arixp-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/signin.html > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/arixp-http.log
          exit 1

      - name: Run App Store browser smoke tests
        env:
          ARI_SMOKE_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          tests/app-store-smoke.spec.mjs
          tests/build5-review-surfaces.spec.mjs
          tests/ari-training-live.spec.mjs
          tests/ari-circle-menu-live.spec.mjs
          tests/nutrition-startup-live.spec.mjs
          --grep-invert "review-critical public and Circle surfaces render expected controls"
          --reporter=line
