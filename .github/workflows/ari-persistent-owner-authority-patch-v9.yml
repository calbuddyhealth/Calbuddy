name: Apply persistent owner authority directly v9

on:
  push:
    branches:
      - agent/ari-persistent-owner-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ari-persistent-owner-authority
          fetch-depth: 1

      - name: Patch persistent owner authority
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('calbuddy-core.js')
          core = path.read_text()

          def splice(text, start, end, replacement, label):
              if start < 0 or end < 0 or end <= start:
                  raise SystemExit(f'{label}: invalid boundary')
              return text[:start] + replacement + text[end:]

          def block_end(text, start, label):
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f'{label}: opening brace missing')
              depth = 0
              quote = None
              escape = False
              for i in range(brace, len(text)):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'", '`'):
                      quote = ch
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i + 1
              raise SystemExit(f'{label}: closing brace missing')

          persistent = r'''CalBuddy.getVisualLiveOwnerSession = function () {
            const key = "calbuddyVisualLiveOwnerSession";
            const saved = localStorage.getItem(key);
            if (!saved) return null;

            try {
              const state = JSON.parse(saved);
              if (!state?.userId || !["persistent_owner", "live_owner"].includes(state?.mode)) {
                localStorage.removeItem(key);
                return null;
              }

              // Accept a still-valid legacy Live Owner record as migration input.
              // Verified owner identity, not a browser-local timer, is authoritative.
              if (
                state.mode === "live_owner" &&
                Number.isFinite(Number(state?.expiresAt)) &&
                Number(state.expiresAt) <= Date.now()
              ) {
                localStorage.removeItem(key);
                return null;
              }

              return {
                ...state,
                mode: "persistent_owner",
                enabled: state.enabled !== false,
                persistent: true,
                expiresAt: null
              };
            } catch {
              localStorage.removeItem(key);
              return null;
            }
          };

          CalBuddy.isVisualLiveOwnerSessionActive = async function () {
            const key = "calbuddyVisualLiveOwnerSession";
            const session = await CalBuddy.getCurrentSession();
            const userId = String(session?.user?.id || "").trim();

            if (!session?.access_token || !userId) {
              localStorage.removeItem(key);
              return false;
            }

            const verified = await CalBuddy.verifyOwnerSession();
            if (!verified) {
              localStorage.removeItem(key);
              return false;
            }

            let state = CalBuddy.getVisualLiveOwnerSession();
            if (state?.userId && String(state.userId) !== userId) {
              localStorage.removeItem(key);
              state = null;
            }

            // Explicit opt-out pauses live inspection. Otherwise verified owner
            // identity automatically carries low-risk owner capabilities.
            if (state?.enabled === false) return false;

            if (!state || state.mode !== "persistent_owner" || state.enabled !== true) {
              state = {
                mode: "persistent_owner",
                userId,
                enabled: true,
                persistent: true,
                enabledAt: Number(state?.enabledAt || Date.now()),
                expiresAt: null
              };
              localStorage.setItem(key, JSON.stringify(state));
              window.dispatchEvent(
                new CustomEvent("calbuddy:liveOwnerSessionChanged", {
                  detail: { active: true, ...state }
                })
              );
            }

            return true;
          };

          CalBuddy.enableVisualLiveOwnerSession = async function () {
            const client = window.calbuddySupabase || CalBuddy.supabase;
            if (!client?.auth) {
              return {
                success: false,
                code: "LIVE_OWNER_AUTH_UNAVAILABLE",
                reply: "Persistent Owner Mode is unavailable because authentication is not ready."
              };
            }

            let session = null;
            try {
              const refreshed = await client.auth.refreshSession();
              session = refreshed?.data?.session || null;
            } catch {}

            if (!session) session = await CalBuddy.getCurrentSession();
            if (!session?.access_token || !session?.user?.id) {
              return {
                success: false,
                code: "LIVE_OWNER_AUTH_REQUIRED",
                reply: "Persistent Owner Mode requires a current signed-in owner session."
              };
            }

            const owner = await CalBuddy.verifyOwnerSession({ force: true });
            if (!owner) {
              return {
                success: false,
                code: "OWNER_ACCESS_DENIED",
                reply: "Persistent Owner Mode requires verified owner identity."
              };
            }

            const state = {
              mode: "persistent_owner",
              userId: String(session.user.id),
              enabled: true,
              persistent: true,
              enabledAt: Date.now(),
              expiresAt: null
            };
            localStorage.setItem("calbuddyVisualLiveOwnerSession", JSON.stringify(state));
            window.dispatchEvent(
              new CustomEvent("calbuddy:liveOwnerSessionChanged", {
                detail: { active: true, ...state }
              })
            );

            return {
              success: true,
              state,
              reply: "Persistent Owner Mode is enabled for this verified owner account. It stays available across reloads and token refreshes until you disable it or sign out. Read-only owner inspection and bounded developer capabilities stay available; high-impact actions keep their existing confirmation and authorization gates."
            };
          };

          CalBuddy.disableVisualLiveOwnerSession = async function () {
            const key = "calbuddyVisualLiveOwnerSession";
            const session = await CalBuddy.getCurrentSession().catch(() => null);
            const existing = CalBuddy.getVisualLiveOwnerSession();
            const userId = String(
              session?.user?.id || existing?.userId || CalBuddy.ownerSessionCache?.userId || ""
            ).trim();

            if (userId) {
              localStorage.setItem(
                key,
                JSON.stringify({
                  mode: "persistent_owner",
                  userId,
                  enabled: false,
                  persistent: true,
                  disabledAt: Date.now(),
                  expiresAt: null
                })
              );
            } else {
              localStorage.removeItem(key);
            }

            window.dispatchEvent(
              new CustomEvent("calbuddy:liveOwnerSessionChanged", {
                detail: { active: false, persistent: true }
              })
            );
            return {
              success: true,
              reply: "Persistent Owner Mode is paused for live visual inspection. Your verified owner identity remains intact, and high-impact actions still keep their separate confirmation gates."
            };
          };

          '''

          start = core.find('CalBuddy.getVisualLiveOwnerSession = function () {')
          end = core.find('CalBuddy.verifyOwnerSession = async function', start)
          core = splice(core, start, end, persistent, 'owner state functions')

          # Do not send browser-local owner expiry to the server. The server
          # already re-verifies owner identity and bounds each delegated grant.
          state_pos = core.find('const liveOwnerState =')
          if state_pos >= 0:
              request_pos = core.find('const started = await CalBuddy.requestVisualInspector({', state_pos)
              after_pos = core.find('if (!started?.success || !started?.requestId)', request_pos)
              if request_pos < 0 or after_pos < 0:
                  raise SystemExit('visual inspector request: boundary missing')
              start_line = core.rfind('\n', 0, state_pos) + 1
              replacement = r'''    const started = await CalBuddy.requestVisualInspector({
              action: "start",
              targetPath,
              viewports,
              actions,
              instruction,
              visualMode
            });

            '''
              core = splice(core, start_line, after_pos, replacement, 'visual inspector request')

          # Enabling owner mode is now an identity verification operation, not a
          # temporary 45-minute action proposal.
          needle = core.find('CalBuddy.isLiveOwnerEnableCommand(message)')
          if needle < 0:
              raise SystemExit('owner enable command missing')
          enable_start = core.rfind('if (', 0, needle)
          enable_end = block_end(core, enable_start, 'owner enable command')
          enable = r'''if (
            !readOnlyFallback &&
            userContext.ownerMode === true &&
            CalBuddy.isLiveOwnerEnableCommand(message)
          ) {
            const persistentOwner = await CalBuddy.enableVisualLiveOwnerSession();
            CalBuddy.setAriMood(persistentOwner?.success ? "happy" : "concerned");
            finishTiming();
            return {
              ...(persistentOwner || {}),
              source: "persistent_owner_mode",
              emotion: persistentOwner?.success ? "happy" : "concerned"
            };
          }'''
          core = splice(core, enable_start, enable_end, enable, 'owner enable command')

          declaration = 'const liveOwnerActive = await CalBuddy.isVisualLiveOwnerSessionActive();'
          if declaration not in core:
              raise SystemExit('live owner activity declaration missing')
          core = core.replace(
              declaration,
              'let liveOwnerActive = await CalBuddy.isVisualLiveOwnerSessionActive();',
              1
          )

          # A verified owner requesting live inspection can self-activate the
          # persistent low-risk capability without another pending confirmation.
          request_start = core.find('if (requestedLiveOwner && !liveOwnerActive) {')
          if request_start < 0:
              raise SystemExit('requested live owner block missing')
          request_end = block_end(core, request_start, 'requested live owner block')
          request_block = r'''if (requestedLiveOwner && !liveOwnerActive) {
            const activation = await CalBuddy.enableVisualLiveOwnerSession();
            if (!activation?.success) {
              finishTiming();
              return {
                ...(activation || {}),
                emotion: "concerned",
                liveOwnerSession: { active: false, persistent: true }
              };
            }
            liveOwnerActive = true;
          }'''
          core = splice(core, request_start, request_end, request_block, 'requested live owner block')

          path.write_text(core)
          PY

      - name: Verify core syntax
        run: node --check calbuddy-core.js

      - name: Commit product patch and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in .github/workflows/ari-persistent-owner-authority-patch*.yml; do
            [ -e "$f" ] && git rm "$f"
          done
          git add calbuddy-core.js
          git commit -m "Make verified owner authority persistent"
          git push origin HEAD:agent/ari-persistent-owner-authority
