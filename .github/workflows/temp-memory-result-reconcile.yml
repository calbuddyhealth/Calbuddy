name: Temporary Memory Result Reconcile

on:
  push:
    branches:
      - feature/memory-trust-rendering-fix
    paths:
      - .github/workflows/temp-memory-result-reconcile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/memory-trust-rendering-fix

      - name: Preserve full vNext result and reconcile verified memory reply
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('api/ari-vnext.js')
          text = path.read_text()
          old = '''    const modelStartedAt = Date.now();\n    const result = explicitMemoryAction.memoryOnly\n      ? {\n          success: true,\n          ready: true,\n          reply: buildVerifiedMemoryReply(explicitMemoryAction),\n          route: routePreview,\n          source: "ari_vnext_verified_memory_action",\n          action: {\n            type: "memory_save",\n            status: explicitMemoryAction.status,\n            requestedCount: explicitMemoryAction.requestedCount,\n            storedCount: explicitMemoryAction.storedCount,\n            failedCount: explicitMemoryAction.failedCount\n          }\n        }\n      : await runAriVNext(turn);\n    const modelMs = Date.now() - modelStartedAt;'''
          new = '''    const modelStartedAt = Date.now();\n    const result = await runAriVNext(turn);\n    if (explicitMemoryAction.memoryOnly) {\n      result.reply = buildVerifiedMemoryReply(explicitMemoryAction);\n      result.source = "ari_vnext_verified_memory_action";\n      result.action = {\n        type: "memory_save",\n        status: explicitMemoryAction.status,\n        requestedCount: explicitMemoryAction.requestedCount,\n        storedCount: explicitMemoryAction.storedCount,\n        failedCount: explicitMemoryAction.failedCount\n      };\n    }\n    const modelMs = Date.now() - modelStartedAt;'''
          assert old in text, 'verified result reconciliation anchor missing'
          path.write_text(text.replace(old, new, 1))
          PY
          node --check api/ari-vnext.js

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ari-vnext.js
          git commit -m "Preserve full vNext result for verified memory turns"
          git push origin HEAD:feature/memory-trust-rendering-fix
