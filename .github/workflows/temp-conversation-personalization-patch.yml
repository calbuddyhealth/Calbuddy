name: Temporary Conversation Personalization Patch

on:
  push:
    branches:
      - feature/ari-conversation-personalization-v2
    paths:
      - .github/workflows/temp-conversation-personalization-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ari-conversation-personalization-v2

      - name: Patch Ari vNext runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          orchestrator = Path('api/_lib/ari-vnext/orchestrator.js')
          text = orchestrator.read_text()
          old = 'import { communicationProfileToInstruction, resolveCommunicationProfile } from "./communication-profile.js";'
          new = 'import { communicationProfileToInstruction, resolvePersonalizedCommunicationProfile } from "./communication-profile.js";'
          assert old in text, 'orchestrator communication import anchor missing'
          text = text.replace(old, new, 1)

          old = '  const communication = resolveCommunicationProfile(turn?.preferences);'
          new = '''  const communication = resolvePersonalizedCommunicationProfile({\n    preferences: turn?.preferences || {},\n    learning: turn?.context?.communicationLearning || null,\n    message: turn?.message || "",\n    safety\n  });'''
          assert old in text, 'orchestrator communication resolution anchor missing'
          text = text.replace(old, new, 1)
          orchestrator.write_text(text)

          api = Path('api/ari-vnext.js')
          text = api.read_text()

          old = '    const fitnessRoute = Boolean(routePreview.training || routePreview.nutrition || routePreview.goals);\n    const shouldLoadMemory = Boolean(!casualConversation && (routePreview.memory || fitnessRoute || cognitiveLoopEnabled));'
          new = '    const fitnessRoute = Boolean(routePreview.training || routePreview.nutrition || routePreview.goals);\n    const shouldLoadConversationLearning = !casualConversation || cleanText(turn.message, 2000).length >= 12;\n    const shouldLoadMemory = Boolean(!casualConversation && (routePreview.memory || fitnessRoute || cognitiveLoopEnabled));'
          assert old in text, 'api conversation eligibility anchor missing'
          text = text.replace(old, new, 1)

          old = '''      fitnessRoute\n        ? listCommunicationOutcomes({ userId: auth.userId, limit: 24 })\n        : Promise.resolve([]),'''
          new = '''      shouldLoadConversationLearning\n        ? listCommunicationOutcomes({ userId: auth.userId, limit: 40 })\n        : Promise.resolve([]),'''
          assert old in text, 'api communication load anchor missing'
          text = text.replace(old, new, 1)

          old = '    const communicationLearning = fitnessRoute ? summarizeCommunicationLearning(communicationOutcomes) : null;'
          new = '''    const communicationLearning = communicationOutcomes.length\n      ? summarizeCommunicationLearning(communicationOutcomes, { route: routePreview })\n      : null;'''
          assert old in text, 'api communication summary anchor missing'
          text = text.replace(old, new, 1)

          old = '''    const communicationExposure = fitnessRoute\n      ? buildCommunicationExposure({ turnId: turn.turnId, route: result?.route || routePreview, result })\n      : null;'''
          new = '''    const communicationExposure = buildCommunicationExposure({\n      turnId: turn.turnId,\n      route: result?.route || routePreview,\n      result,\n      turn\n    });'''
          assert old in text, 'api communication exposure anchor missing'
          text = text.replace(old, new, 1)

          old = '''    const communicationResolutionTask = fitnessRoute\n      ? resolveCommunicationOutcomes({\n          userId: auth.userId,\n          longitudinalState: result?.longitudinalState || null,\n          message: turn.message\n        })\n      : Promise.resolve({ resolved: 0 });'''
          new = '''    const communicationResolutionTask = shouldLoadConversationLearning\n      ? resolveCommunicationOutcomes({\n          userId: auth.userId,\n          longitudinalState: result?.longitudinalState || null,\n          message: turn.message,\n          rows: communicationOutcomes\n        })\n      : Promise.resolve({ resolved: 0, signal: null });'''
          assert old in text, 'api communication resolution anchor missing'
          text = text.replace(old, new, 1)

          api.write_text(text)
          PY

      - name: Commit runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ari-vnext.js api/_lib/ari-vnext/orchestrator.js
          if git diff --cached --quiet; then
            echo "No runtime patch changes to commit."
            exit 0
          fi
          git commit -m "Wire advanced conversation personalization into Ari vNext"
          git push origin HEAD:feature/ari-conversation-personalization-v2
