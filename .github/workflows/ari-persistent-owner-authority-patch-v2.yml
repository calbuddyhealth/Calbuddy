name: Apply persistent owner authority patch v2

on:
  push:
    branches:
      - agent/ari-persistent-owner-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ari-persistent-owner-authority
          fetch-depth: 1

      - name: Apply persistent owner authority changes
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('calbuddy-core.js')
          core = core_path.read_text()

          def replace_between(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{label}: end marker missing')
              return text[:start] + replacement + text[end:]

          persistent_block = '''CalBuddy.getVisualLiveOwnerSession = function () {
            const key = "calbuddyVisualLiveOwnerSession";
            const saved = localStorage.getItem(key);
            if (!saved) return null;

            try {
              const state = JSON.parse(saved);
              if (!state?.userId || !["persistent_owner", "live_owner"].includes(state?.mode)) {
                localStorage.removeItem(key);
                return null;
              }

              // Legacy 45-minute records are migration input only. Verified owner
              // identity, not this client-side timestamp, is the authority boundary.
              if (
                state.mode === "live_owner" &&
                Number.isFinite(Number(state?.expiresAt)) &&
                Number(state.expiresAt) <= Date.now()
              ) {
                localStorage.removeItem(key);
                return null;
              }

              return {
                ...state,
                mode: "persistent_owner",
                enabled: state.enabled !== false,
                persistent: true,
                expiresAt: null
              };
            } catch {
              localStorage.removeItem(key);
              return null;
            }
          };

          CalBuddy.isVisualLiveOwnerSessionActive = async function () {
            const key = "calbuddyVisualLiveOwnerSession";
            const session = await CalBuddy.getCurrentSession();
            const userId = String(session?.user?.id || "").trim();

            if (!session?.access_token || !userId) {
              localStorage.removeItem(key);
              return false;
            }

            const verified = await CalBuddy.verifyOwnerSession();
            if (!verified) {
              localStorage.removeItem(key);
              return false;
            }

            let state = CalBuddy.getVisualLiveOwnerSession();
            if (state?.userId && String(state.userId) !== userId) {
              localStorage.removeItem(key);
              state = null;
            }

            // Explicit opt-out is respected. Otherwise verified owner identity
            // automatically carries low-risk live inspection authority.
            if (state?.enabled === false) return false;

            if (!state || state.mode !== "persistent_owner" || state.enabled !== true) {
              state = {
                mode: "persistent_owner",
                userId,
                enabled: true,
                persistent: true,
                enabledAt: Number(state?.enabledAt || Date.now()),
                expiresAt: null
              };
              localStorage.setItem(key, JSON.stringify(state));
              window.dispatchEvent(
                new CustomEvent("calbuddy:liveOwnerSessionChanged", {
                  detail: { active: true, ...state }
                })
              );
            }

            return true;
          };

          CalBuddy.enableVisualLiveOwnerSession = async function () {
            const client = window.calbuddySupabase || CalBuddy.supabase;
            if (!client?.auth) {
              return {
                success: false,
                code: "LIVE_OWNER_AUTH_UNAVAILABLE",
                reply: "Persistent Owner Mode is unavailable because authentication is not ready."
              };
            }

            let session = null;
            try {
              const refreshed = await client.auth.refreshSession();
              session = refreshed?.data?.session || null;
            } catch {}

            if (!session) session = await CalBuddy.getCurrentSession();

            if (!session?.access_token || !session?.user?.id) {
              return {
                success: false,
                code: "LIVE_OWNER_AUTH_REQUIRED",
                reply: "Persistent Owner Mode requires a current signed-in owner session."
              };
            }

            const owner = await CalBuddy.verifyOwnerSession({ force: true });
            if (!owner) {
              return {
                success: false,
                code: "OWNER_ACCESS_DENIED",
                reply: "Persistent Owner Mode requires verified owner identity."
              };
            }

            const state = {
              mode: "persistent_owner",
              userId: String(session.user.id),
              enabled: true,
              persistent: true,
              enabledAt: Date.now(),
              expiresAt: null
            };

            localStorage.setItem("calbuddyVisualLiveOwnerSession", JSON.stringify(state));
            window.dispatchEvent(
              new CustomEvent("calbuddy:liveOwnerSessionChanged", {
                detail: { active: true, ...state }
              })
            );

            return {
              success: true,
              state,
              reply:
                "Persistent Owner Mode is enabled for this verified owner account. It stays available across reloads and token refreshes until you disable it or sign out. Read-only owner inspection and bounded developer capabilities stay available; high-impact actions keep their existing confirmation and authorization gates."
            };
          };

          CalBuddy.disableVisualLiveOwnerSession = async function () {
            const key = "calbuddyVisualLiveOwnerSession";
            const session = await CalBuddy.getCurrentSession().catch(() => null);
            const existing = CalBuddy.getVisualLiveOwnerSession();
            const userId = String(
              session?.user?.id || existing?.userId || CalBuddy.ownerSessionCache?.userId || ""
            ).trim();

            if (userId) {
              localStorage.setItem(
                key,
                JSON.stringify({
                  mode: "persistent_owner",
                  userId,
                  enabled: false,
                  persistent: true,
                  disabledAt: Date.now(),
                  expiresAt: null
                })
              );
            } else {
              localStorage.removeItem(key);
            }

            window.dispatchEvent(
              new CustomEvent("calbuddy:liveOwnerSessionChanged", {
                detail: { active: false, persistent: true }
              })
            );
            return {
              success: true,
              reply:
                "Persistent Owner Mode is paused for live visual inspection. Your verified owner identity remains intact, and high-impact actions still keep their separate confirmation gates."
            };
          };
          '''

          core = replace_between(
              core,
              'CalBuddy.getVisualLiveOwnerSession = function () {',
              'CalBuddy.verifyOwnerSession = async function',
              persistent_block,
              'persistent owner session block'
          )

          live_state_start = '\n    const liveOwnerState =\n'
          live_state_end = '\n\n    if (!started?.success || !started?.requestId)'
          core = replace_between(
              core,
              live_state_start,
              live_state_end,
              '''\n    const started = await CalBuddy.requestVisualInspector({
            action: "start",
            targetPath,
            viewports,
            actions,
            instruction,
            visualMode
          });''',
              'delegated owner expiry removal'
          )

          enable_start = '''if (
            !readOnlyFallback &&
            userContext.ownerMode === true &&
            CalBuddy.isLiveOwnerEnableCommand(message)
          ) {'''
          disable_start = '''if (
            !readOnlyFallback &&
            userContext.ownerMode === true &&
            CalBuddy.isLiveOwnerDisableCommand(message)
          ) {'''
          core = replace_between(
              core,
              enable_start,
              disable_start,
              '''if (
            !readOnlyFallback &&
            userContext.ownerMode === true &&
            CalBuddy.isLiveOwnerEnableCommand(message)
          ) {
            const persistentOwner = await CalBuddy.enableVisualLiveOwnerSession();
            CalBuddy.setAriMood(persistentOwner?.success ? "happy" : "concerned");
            finishTiming();
            return {
              ...(persistentOwner || {}),
              source: "persistent_owner_mode",
              emotion: persistentOwner?.success ? "happy" : "concerned"
            };
          }

          ''',
              'owner enable chat path'
          )

          old_live_decl = '  const liveOwnerActive = await CalBuddy.isVisualLiveOwnerSessionActive();'
          if old_live_decl not in core:
              raise SystemExit('live owner declaration missing')
          core = core.replace(
              old_live_decl,
              '  let liveOwnerActive = await CalBuddy.isVisualLiveOwnerSessionActive();',
              1
          )

          core = replace_between(
              core,
              '  if (requestedLiveOwner && !liveOwnerActive) {',
              '  const resolvedVisualMode =',
              '''  if (requestedLiveOwner && !liveOwnerActive) {
            const activation = await CalBuddy.enableVisualLiveOwnerSession();
            if (!activation?.success) {
              finishTiming();
              return {
                ...(activation || {}),
                emotion: "concerned",
                liveOwnerSession: { active: false, persistent: true }
              };
            }
            liveOwnerActive = true;
          }

          ''',
              'visual owner auto-activation path'
          )

          core_path.write_text(core)

          Path('tests/ari-live-owner-session.test.mjs').write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const core = fs.readFileSync("calbuddy-core.js", "utf8");
          const api = fs.readFileSync("api/ari-visual-inspector.js", "utf8");
          const worker = fs.readFileSync("scripts/ari-visual-inspector.mjs", "utf8");
          const workflow = fs.readFileSync(".github/workflows/ari-visual-inspector.yml", "utf8");
          const isolation = fs.readFileSync("js/account-isolation-guard.js", "utf8");
          const consent = fs.readFileSync("js/ai-processing-consent.js", "utf8");

          test("Persistent Owner implementation stays syntactically valid", () => {
            for (const path of [
              "calbuddy-core.js",
              "api/ari-visual-inspector.js",
              "scripts/ari-visual-inspector.mjs",
              "js/ai-processing-consent.js"
            ]) {
              execFileSync(process.execPath, ["--check", path], { stdio: "pipe" });
            }
          });

          test("verified owner identity activates persistent owner mode without a 45-minute confirmation", () => {
            assert.match(core, /CalBuddy\.isLiveOwnerEnableCommand/);
            assert.match(core, /CalBuddy\.isLiveOwnerDisableCommand/);
            assert.match(core, /CalBuddy\.enableVisualLiveOwnerSession/);
            assert.match(core, /verifyOwnerSession\(\{ force: true \}\)/);
            assert.match(core, /mode:\s*"persistent_owner"/);
            assert.match(core, /persistent:\s*true/);
            assert.match(core, /until you disable it or sign out/);
            assert.doesNotMatch(core, /Enable Live Owner Session for up to 45 minutes/);
          });

          test("persistent owner state is account-bound but has no local timeout authority", () => {
            assert.match(core, /state\?\.userId/);
            assert.match(core, /String\(state\.userId\) !== userId/);
            assert.match(core, /expiresAt:\s*null/);
            assert.match(core, /state\?\.enabled === false/);
            assert.match(isolation, /calbuddyVisualLiveOwnerSession/);
            assert.match(isolation, /const VERSION = "1\.0\.2"/);
          });

          test("visual inspection automatically uses persistent owner capability unless sandbox is explicit", () => {
            assert.match(core, /isVisualLiveOwnerSessionActive/);
            assert.match(core, /resolvedVisualMode/);
            assert.match(core, /"live_owner"/);
            assert.match(core, /visualMode: resolvedVisualMode/);
            assert.match(core, /messageRequiresLiveOwner/);
            assert.match(core, /liveOwnerActive = true/);
            assert.doesNotMatch(core, /awaitingConfirmation: true/);
          });

          test("Live Owner delegation never sends the raw owner token as a workflow input", () => {
            assert.match(api, /extractBearerToken\(req\)/);
            assert.match(api, /createCipheriv\("aes-256-gcm"/);
            assert.match(api, /LIVE_GRANT_TTL_MS = 3 \* 60 \* 1000/);
            assert.match(api, /exchange_live_grant/);
            assert.match(workflow, /live_grant:/);
            assert.doesNotMatch(workflow, /access_token|refresh_token|SUPABASE_SERVICE_ROLE_KEY/);
          });

          test("worker injects real owner auth but blocks browser-side production mutations", () => {
            assert.match(worker, /installLiveOwnerSession/);
            assert.match(worker, /calbuddy-auth-session/);
            assert.match(worker, /shouldBlockLiveMutation/);
            assert.match(worker, /live_owner_read_only_guard/);
            assert.match(worker, /blockedMutations/);
            assert.match(worker, /ari-live-owner-read-only-no-refresh/);
            assert.match(worker, /request\.method\(\)/);
            assert.match(worker, /route\.abort\("blockedbyclient"\)/);
          });

          test("the delegated worker receives no refresh token from the owner browser", () => {
            assert.doesNotMatch(api, /refreshToken/);
            assert.doesNotMatch(api, /refresh_token:\s*payload/);
            assert.match(api, /accessToken: payload\.accessToken/);
            assert.match(api, /mutationAuthority: false/);
          });

          test("Persistent Owner carries request-scoped AI-processing authorization without changing permanent consent metadata", () => {
            assert.match(api, /scope:\s*"visual_owner_inspection"/);
            assert.match(api, /hasScopedLiveOwnerAIProcessingAuthorization/);
            assert.match(api, /visionBlockedByConsent: true/);
            assert.match(api, /accessTokenExpiresAt - 60_000/);

            const liveInstall = worker.slice(
              worker.indexOf("async function installLiveOwnerSession"),
              worker.indexOf("function normalizePath")
            );
            assert.match(liveInstall, /__ARI_SCOPED_AI_PROCESSING_AUTHORIZATION/);
            assert.match(liveInstall, /visual_owner_inspection/);
            assert.match(liveInstall, /user_metadata:\s*\{\}/);
            assert.doesNotMatch(liveInstall, /ari_ai_processing_consent:\s*true/);

            assert.match(consent, /scopedVisualAuthorization/);
            assert.match(consent, /__ARI_VISUAL_LIVE_OWNER/);
            assert.match(consent, /__ARI_SCOPED_AI_PROCESSING_AUTHORIZATION/);
            assert.match(consent, /visual_owner_inspection/);
            assert.match(consent, /authorizationSource/);
            assert.match(consent, /version:\s*"1\.1\.1"/);
          });
          '''.replace('\n          ', '\n').lstrip())

          Path('tests/ari-live-owner-vnext-routing.test.mjs').write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const runtimePath = "ari/runtime/ari-runtime-controller.js";
          const runtime = fs.readFileSync(runtimePath, "utf8");
          const core = fs.readFileSync("calbuddy-core.js", "utf8");

          test("canonical Ari runtime stays syntactically valid", () => {
            execFileSync(process.execPath, ["--check", runtimePath], { stdio: "pipe" });
          });

          test("vNext preserves the trusted CalBuddy action boundary separately from legacy fallback", () => {
            assert.match(runtime, /const trustedCalBuddyActions =/);
            assert.match(runtime, /typeof CalBuddy\.confirmPendingAction === "function"/);
            assert.match(runtime, /typeof CalBuddy\.cancelPendingAction === "function"/);
            assert.doesNotMatch(runtime, /legacy\.confirmPendingAction|legacy\.cancelPendingAction/);
            assert.match(runtime, /LOCAL_OWNER_CONTROL_ACTIONS/);
            assert.match(runtime, /enable_visual_live_owner_session/);
          });

          test("Persistent Owner enable, disable, and visual requests are intercepted before model routing", () => {
            assert.match(runtime, /runOwnerVisualPreflight/);
            assert.match(runtime, /CalBuddy\.isLiveOwnerEnableCommand/);
            assert.match(runtime, /CalBuddy\.isLiveOwnerDisableCommand/);
            assert.match(runtime, /CalBuddy\.isVisualInspectionCommand/);

            const preflightCall = runtime.indexOf("runOwnerVisualPreflight({");
            const bridgeCall = runtime.indexOf("window.AriVNextBridge.ask(message");
            assert.ok(preflightCall >= 0, "missing owner visual preflight call");
            assert.ok(bridgeCall > preflightCall, "owner visual preflight must execute before vNext model call");
          });

          test("legacy pending owner-control confirmations remain safely cancellable", () => {
            assert.match(runtime, /localPending && isAffirmative\(message\)/);
            assert.match(runtime, /trustedCalBuddyActions\.confirm\(\)/);
            assert.match(runtime, /localPending && isNegative\(message\)/);
            assert.match(runtime, /trustedCalBuddyActions\.cancel/);
            assert.match(runtime, /ari_vnext_local_owner_control_confirmation/);
            assert.match(runtime, /ari_vnext_local_owner_control_cancel/);
          });

          test("the deterministic core keeps persistent owner identity separate from high-impact action gates", () => {
            assert.match(core, /CalBuddy\.enableVisualLiveOwnerSession/);
            assert.match(core, /verifyOwnerSession\(\{ force: true \}\)/);
            assert.match(core, /mode:\s*"persistent_owner"/);
            assert.match(core, /high-impact actions keep their existing confirmation and authorization gates/);
            assert.match(core, /CalBuddy\.runVisualInspection/);
            assert.doesNotMatch(core, /Enable Live Owner Session for up to 45 minutes/);
          });

          test("runtime 1.6.7 is the canonical runtime version", () => {
            assert.match(runtime, /const VERSION = "1\.6\.7"/);
          });
          '''.replace('\n          ', '\n').lstrip())
          PY

      - name: Verify focused owner-mode contract
        run: |
          node --check calbuddy-core.js
          node --test tests/ari-live-owner-session.test.mjs tests/ari-live-owner-vnext-routing.test.mjs

      - name: Commit patch and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ari-persistent-owner-authority-patch.yml
          git rm .github/workflows/ari-persistent-owner-authority-patch-v2.yml
          git add calbuddy-core.js tests/ari-live-owner-session.test.mjs tests/ari-live-owner-vnext-routing.test.mjs
          git commit -m "Make verified owner authority persistent"
          git push origin HEAD:agent/ari-persistent-owner-authority
